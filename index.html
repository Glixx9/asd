{id:"street_sneeze",title:"A stranger sneezes — then makes a second sound",text:["A person standing outside a closed shop sneezes into their elbow. The sneeze is ordinary. The sound that follows is not. A short, sharp chirrup comes from their throat, almost like a bird call. They freeze and look around to see who heard it.","They wipe their nose and pretend nothing happened. Their eyes are watering. When a car horn sounds, their shoulders jerk and the same chirrup escapes again, quieter this time.","They notice you watching and give a strained smile. “Allergies,” they say, although it is not pollen season."],note:"The second sound seems involuntary, especially when they are startled.",ask:["You ask if they are all right. They say it started as a tickle behind the nose, then moved lower into the throat. They have been making the sound whenever they sneeze or hear a sudden noise.","They ask you not to tell anyone at work. They are afraid they will be sent home and questioned."],detail:["They say the sound sometimes comes out before the sneeze. They have begun avoiding crowded places because people turn around and stare.","As they speak, your own nose tingles. You smell dust and cold air much more strongly than before."],quiet:["You look away. The stranger waits until you have passed, then sneezes again. The small chirrup follows, clear enough to hear over the traffic.","Your throat tightens in sympathy. You swallow and keep walking."],touch:["You offer them a tissue. Their fingers brush yours as they take it. They sneeze again, and the chirrup seems to vibrate through the brief contact.","A prickling sensation spreads across your fingertips and up the back of your hand. It fades, but your throat feels unusually sensitive."],check:["You inspect your fingers. Nothing is visible. When you breathe in, the air feels cool all the way down your throat."] ,exposure:1},
{id:"street_whisper",title:"A stranger whispers your name",text:["Someone standing beside a bus shelter turns as you approach. They look directly at you and whisper your name. You have never seen them before. Their voice is barely audible above the traffic.","You stop. The stranger looks just as surprised as you feel. They say they did not mean to speak. They have been hearing names in ordinary sounds: in engines, in birdsong, in the squeak of shoes on pavement.","They ask whether you have heard anyone calling you when nobody is there. Before you can answer, a bus pulls in and blocks them from view."],note:"They knew your name, but you never introduced yourself.",ask:["You ask how they know your name. They say they do not know. It arrived in their head with the same certainty as a familiar memory. They look frightened by the answer.","They tell you that the names usually belong to people who are beginning to hear the signal. They apologise and say they should not have said anything."],detail:["They explain that the voice does not sound like a person speaking. It feels like recognising someone from another room. They have started avoiding quiet places because the names are clearer there.","The stranger leaves on the next bus. You are left with the uncomfortable feeling that you heard your name from inside your own head too."],quiet:["You keep walking without answering. The stranger does not follow. In the reflection of the bus shelter, their mouth continues moving after you have passed.","You tell yourself it was only a reflection, but you do not look back."],touch:["You reach towards their sleeve, asking them to repeat what they said. The moment your fingers touch the fabric, the stranger whispers your name again — this time in a voice that sounds exactly like yours.","Your ears ring. The stranger steps away and covers their mouth. You feel a small pressure behind your teeth."],check:["You say your own name quietly. Your voice sounds normal, but for a second it seems to come from the other side of the road."] ,exposure:1},
{id:"street_crouch",title:"Someone is crouched beside a drain",text:["A person in a work jacket is crouched beside a storm drain. They are not checking a phone or tying a shoe. Their head is tilted close to the metal cover, and one hand rests flat against the pavement.","As you approach, they tap the drain three times. They pause, then tap twice. The sound seems to come back from underneath the road. The person looks up and asks whether you can hear the answer.","Their knees are trembling. They stand slowly, keeping one hand against the wall for balance. A pale mark shows above the collar of their jacket."],note:"The tapping seems to be a response to something below the street.",ask:["You ask what they are doing. They say they are listening for a pattern that began in their flat and followed them outside. They are convinced the drain is carrying it from one part of town to another.","They say the tapping helps them tell whether the sound is close. Today it answered from directly underneath them."],detail:["They describe hearing the same rhythm in pipes, lift cables and the floor at work. They say it becomes clearer when they stop moving.","They ask you not to tap the drain yourself. You notice your fingers have begun to copy the pattern against your leg."],quiet:["You pass without speaking. The person keeps tapping. The sound becomes quieter as you move away, then returns when you stop at the crossing.","You cannot tell whether the sound is following you or whether you are simply listening for it now."],touch:["You touch their shoulder to get their attention. They jerk upright and grab your wrist. Their palm is cold and slightly damp. For a moment the tapping seems to move into your arm.","They release you immediately. Your fingers keep twitching in the same three-two pattern."],check:["You look at your hand. Your fingers move once, twice, then stop. You press them against your thigh until the movement passes."] ,exposure:1},
{id:"street_horn",title:"A car horn makes someone react strangely",text:["A car horn sounds at the junction. A pedestrian waiting beside you flinches violently and drops their shopping. Before they can apologise, a short growl escapes their throat.","They look horrified. They glance at the driver, then at you, as if checking whether anyone noticed. Their jaw trembles. A second horn sounds farther down the road, and they press both hands against their mouth.","The driver waves an apology and continues. The pedestrian bends to pick up their shopping, but their fingers keep curling and uncurling."],note:"Sudden noise seems to trigger something they cannot control.",ask:["You ask if they need help collecting their things. They nod without looking up. They say loud noises have been making their throat react. They have started taking quieter routes to avoid it.","They thank you and ask you not to mention the sound to anyone. They are embarrassed, not angry."],detail:["They say it began with a bark-like sound, then became a low rumble. It happens only when they are startled. They have no idea why.","You realise you have been holding your jaw tightly. When you relax it, your teeth ache for a moment."],quiet:["You give them room to collect the shopping. They avoid looking at you and leave in the opposite direction.","The next car horn seems painfully sharp. You flinch before you can stop yourself."],touch:["You pick up a fallen item and hand it to them. Their fingers brush yours. The pedestrian makes a small throat sound, and your own throat answers with a faint click.","You step back. The sensation settles beneath your jaw and remains there as you walk away."],check:["You press two fingers against your throat. There is no visible change, but the muscles feel unusually tense."] ,exposure:1},
{id:"street_stare",title:"A woman watches you without blinking",text:["A woman stands outside a closed café. She is staring at the people passing, but when you come level with her, her eyes settle on you and do not move. She looks tired rather than threatening.","You slow down. She blinks once, then asks whether you have been sleeping normally. You say not particularly. She nods as if she expected that answer. Her fingers are tucked beneath her sleeves, and the skin around her eyes is faintly pink.","She says she has started noticing people who wake up feeling ill before any other symptoms appear. She asks whether you can hear the traffic behind you."],note:"She seems to recognise the earliest stage of the illness.",ask:["You ask what she means. She says the first change is often attention: ordinary sounds become impossible to ignore, and people begin noticing movement at the edges of their vision.","She says she is not a doctor. She is only describing what happened to her sister."],detail:["Her sister began noticing birds before she could see them, then started turning her head towards every moving shadow. The woman says she is trying to help people notice the pattern earlier.","She gives you the address of a nearby pharmacy and tells you to rest if you feel worse."],quiet:["You keep walking. The woman does not follow, but you feel her gaze between your shoulder blades until you reach the crossing.","When you look back, she is watching someone else. They have stopped too."],touch:["You touch her sleeve to ask whether she needs help. She flinches, then looks down at your hand. “Warm,” she whispers. “You're further along than I thought.”","Your palm tingles. She steps back and tells you not to panic."],check:["You look at your palm. It is slightly warmer than the other hand. You rub it against your coat and continue."] ,exposure:0},
{id:"street_breath",title:"A man is breathing in short, animal-like bursts",text:["A man is standing beside a parked car with one hand on the roof. His breathing comes in quick bursts through his nose. Each breath ends with a soft huff. He looks as if he has just run a long distance, but he is not sweating.","He notices you looking and straightens. “I'm fine,” he says, too quickly. His nostrils flare as he takes another breath. He seems to be smelling the air around you rather than looking at your face.","A bus passes. The man turns his head to follow it, then looks back at you with a confused expression."],note:"His breathing changes when you move closer.",ask:["You ask whether he is having trouble breathing. He says no, that the air simply feels full of information. He can smell engines, rain, food and people separately, and it is exhausting.","He says he is trying to learn how to ignore some of it. He looks relieved that you asked normally."],detail:["He says the smell of people has become distinct, almost like recognising voices. He knows it sounds strange and asks you not to repeat it at work.","He walks away slowly, breathing through his mouth."],quiet:["You do not interrupt. The man closes his eyes and takes several slower breaths. When he opens them, he seems calmer.","You notice your own breathing has become unusually deliberate."],touch:["You reach to steady his elbow. His muscles tense and he draws in a sudden breath. The smell of warm fabric and skin becomes overwhelming for a second.","Your own nose tingles. You pull your hand away and step back."],check:["You breathe in through your nose. The street smells sharper than it did a minute ago, especially the damp stone and petrol."] ,exposure:1}
];
const extraElevatorEvents = [
{id:"elevator_neck",title:"A co-worker keeps rubbing the back of their neck",text:["A co-worker steps into the lift just before the doors close. They keep rubbing the back of their neck through the collar of their shirt. When the lift jolts, the collar slips and you see several pale curved marks just below the hairline.","They notice you looking and pull the collar back into place. Their hand stays there, pressing hard against the skin. They seem more embarrassed than frightened.","The lift begins to rise. A faint clicking sound comes from their neck whenever they swallow."],note:"The marks resemble the ones you noticed on yourself earlier.",ask:["You ask whether their neck hurts. They say it does not hurt exactly. It feels as if something is trying to move beneath the skin, especially when they hear the lift cables.","They ask whether you have noticed marks on yourself. Their eyes flick towards your collar."],detail:["They say the marks appeared in a curved row, then faded, then returned in a slightly different position. They have stopped taking photographs because the camera never captures them properly.","The lift chimes. They leave quickly without saying goodbye."],quiet:["You look at the floor indicator. The co-worker keeps rubbing their neck. When the doors open, they leave with one hand still pressed beneath the collar.","Your own neck feels warm where the marks appeared this morning."],touch:["You gently touch their shoulder. They flinch and their collar slips. The pale marks seem to shift as their skin tightens. Your fingertips feel a brief electric prickle.","They step away and ask you not to touch them again. You apologise. The warmth remains in your fingers."],check:["You feel the back of your own neck. The skin is smooth, but there is a faint line of warmth beneath it."] ,exposure:1},
{id:"elevator_breath",title:"Someone holds their breath when the doors close",text:["A stranger enters the lift on the next floor. They stand facing the doors and take one deep breath. When the doors close, they stop breathing altogether. Their shoulders remain still for several seconds.","You glance at them. Their eyes are open and fixed on the floor indicator. When the lift passes a floor, they release the breath in a long, careful exhale and immediately inhale again through their mouth.","They notice you watching and whisper that the lift smells too strong. They say they can smell every person who has been inside it."],note:"The enclosed space seems to overwhelm their senses.",ask:["You ask if they want you to open the doors. They shake their head and say they are trying to get used to the smell. They can distinguish the last several people who rode in the lift by the scent they left behind.","They ask whether you can smell anything unusual. You suddenly become aware of damp coats, hand soap and warm metal."],detail:["They say the smells form a trail. They can tell who entered, who left and which floor they went to. They do not want this ability and are frightened it will get stronger.","The doors open. They leave without looking back."],quiet:["You turn towards the floor indicator and give them space. They breathe in short, controlled bursts until the doors open.","After they leave, the lift smells briefly of wet grass, though nobody has been outside."],touch:["You touch the door-open button and ask if they need air. Their hand closes over yours. Their skin is cold, but the grip is unexpectedly strong.","A wave of smells floods your nose. You pull away, and the lift suddenly seems too warm."],check:["You sniff the air. The smell of the lift is still there, but now you can separate each layer of it."] ,exposure:1},
{id:"elevator_voice",title:"A co-worker's voice changes halfway through a sentence",text:["A co-worker gets into the lift and asks which floor you need. Their voice sounds normal at first. Halfway through the sentence, a second tone slips underneath it, lower and rougher, as if someone has repeated the same words a fraction later.","They stop speaking. Their eyes widen. They clear their throat and try again. The second tone returns. They press their lips together and look down at their shoes.","The lift hums around you. The co-worker mouths an apology without making a sound."],note:"Their voice seems to echo from inside their own throat.",ask:["You ask whether they have a sore throat. They nod and say it happens when they speak too quickly. Sometimes the second voice says the last word before they do.","They are frightened that someone will hear it and think they are doing it deliberately."],detail:["They say it is worse when they are tired or startled. They have begun writing messages instead of speaking. They ask you to pretend you did not hear it.","The lift doors open. They leave silently."],quiet:["You do not comment. The co-worker gives a grateful glance and keeps their mouth closed until the doors open.","You hear a faint echo of your own breathing after they leave."],touch:["You touch their sleeve to reassure them. They try to say thank you, but the second tone comes back, louder. Your own throat vibrates in answer for a fraction of a second.","You let go. The sensation is gone, but you swallow several times before speaking again."],check:["You say a quiet word to yourself. Your voice sounds normal, although you feel a faint buzz beneath your jaw."] ,exposure:1},
{id:"elevator_reflection",title:"The reflection moves a moment too late",text:["You are alone in the lift when someone enters carrying a folded umbrella. They stand beside you, looking at the metal doors. Their reflection appears in the polished panel, but it does not quite match their movements.","The person raises a hand to their face. The reflection waits, then raises its hand. The person lowers it. The reflection keeps its hand up for another second. They notice you watching and turn away from the panel.","They whisper that it has been happening in every reflective surface. They have started covering the mirrors at home."],note:"The person is frightened of their own reflection, not of you.",ask:["You ask whether they have told anyone. They say a doctor told them it might be fatigue, but the delay happens even when they are fully awake. They are afraid to look in the mirror now.","The person asks you to stand between them and the doors until the lift reaches their floor."],detail:["They say the reflection sometimes looks towards things before they happen. Yesterday it turned its head towards an empty corner, and a second later someone walked around that corner.","The lift chimes. They leave without checking the panel again."],quiet:["You look at the floor indicator instead. The person keeps their eyes lowered until the doors open.","When you step out, your own reflection seems perfectly normal. You still avoid looking at it for a moment."],touch:["You touch their shoulder and turn them gently away from the panel. Their reflection does not turn with them. For one second, it looks directly at you.","A cold sensation moves across your shoulder. The person hurries out, and the reflection finally follows."],check:["You glance at the metal panel. Your reflection matches you now, but your eyes seem to focus on it before you decide to look."] ,exposure:0},
{id:"elevator_smell",title:"A passenger asks whether you can smell rain",text:["A person enters holding a takeaway coffee. They sniff the air and ask whether you can smell rain. The lift is indoors, and the windows are sealed. You say no, but then a damp, earthy smell reaches you.","The person looks relieved. They say it has followed them since waking. It comes and goes, strongest when the lift passes the middle floors. They hold the coffee away from their face as if its smell has become unpleasant.","They ask whether the rain smell is stronger near you. You cannot tell. It seems to be coming from the walls."],note:"The smell appears to be connected to proximity, but not necessarily to contact.",ask:["You ask when it started. They say they woke with it in their bedroom, then smelled it in the car and at the entrance. It is not the smell of wet clothes. It is more like a garden after a storm.","They say they have started craving cold water and fresh air."],detail:["They describe a smell like moss, stone and leaves. It becomes clearer when they close their eyes. They say the smell seems to point towards somewhere outside the building.","They leave on the next floor and turn towards the nearest window."],quiet:["You do not answer. The person puts their coffee down and breathes slowly through their nose.","The smell fades as the lift rises, then returns when the doors open."],touch:["You touch their elbow to get their attention. Their sleeve is damp, though the fabric looks dry. A cool sensation spreads across your palm.","You pull your hand back. For a second, you can smell rain on your own clothes."],check:["You check your sleeve. It is dry. The earthy smell remains, faint but unmistakable."] ,exposure:1},
{id:"elevator_shoulder",title:"A passenger's shoulders keep twitching",text:["A passenger gets in and stands with their back to the wall. Their shoulders twitch in a repeated pattern: left, right, pause, both together. They hold their arms tightly against their sides to hide it.","When the lift starts moving, the twitching stops. When it slows, it begins again. The person notices you looking and gives a small, apologetic smile.","They say it is a muscle spasm. Their voice is calm, but their hands are clenched."],note:"The movement seems tied to the lift's vibration.",ask:["You ask whether they need to sit down. They say the movement happens when they hear a low frequency. They have noticed it near buses, fans and large machines.","They say it is easier to control when they are outside. They are only taking the lift because the stairs make their legs feel strange."],detail:["They say the movement began in their shoulder blades and has spread down their back. It is not painful, but it feels like their body is trying to adjust its balance.","They ask you not to tell anyone. They are worried about being sent for tests."],quiet:["You look away. The passenger keeps their back against the wall. The twitching becomes smaller, then stops when the lift reaches the next floor.","As you step out, your own shoulders give a tiny involuntary shiver."],touch:["You touch their upper arm to ask if they are okay. Their shoulder jumps sharply beneath your hand. A ripple of tension runs down your own back.","They apologise and step away. Your shoulder blades feel tight for the rest of the ride."],check:["You roll your shoulders. They move normally, but the muscles between them feel unusually alert."] ,exposure:1},
{id:"elevator_gloves",title:"Someone is wearing gloves indoors",text:["A co-worker enters wearing thin gloves despite the warm building. They keep their hands clasped together. When the lift jolts, one glove slips and you see pale, branching marks across the fingertips.","They pull the glove back into place immediately. Their eyes flick towards you, then the camera in the corner. They ask which floor you are going to, as if nothing happened.","The person keeps flexing their fingers inside the gloves. The material makes a faint clicking sound."],note:"They are hiding changes in their hands, but they may be willing to talk.",ask:["You ask whether their hands are injured. They say the skin has become too sensitive to touch. Even paper feels rough. The gloves help, but the fingers sometimes move without them deciding to.","They ask whether your hands have felt strange. You notice a slight tightness across your knuckles."],detail:["They say the marks appeared after they began waking with their fingers curled. They can still use their hands normally, but the shape feels different when they close them.","They leave the lift with both hands tucked into their pockets."],quiet:["You do not mention the gloves. The co-worker keeps their hands clasped until the doors open, then slips out quickly.","Your own fingers feel stiff when you flex them."],touch:["You touch the back of their gloved hand. The glove is warm, and something beneath it shifts slightly against your fingertips. The co-worker pulls away with a startled breath.","A prickling sensation spreads across your knuckles. You rub your hands together as the lift stops."],check:["Your hands look normal. The skin across your knuckles feels tight, as if you have been wearing gloves too long."] ,exposure:1},
{id:"elevator_phone",title:"A phone starts playing a sound nobody else hears",text:["A passenger enters while staring at their phone. A low, pulsing sound comes from the speaker. They turn the volume down, but the sound does not get quieter. They press the side buttons several times and then cover both ears.","They look around the lift, embarrassed. The phone screen is black, but the sound continues. When you look at it, the sound seems to move to the back of your teeth.","The passenger asks whether you can hear it. Their eyes are wet. They say it has been playing in their head since last night."],note:"The sound seems to affect you even though the phone is not visibly playing anything.",ask:["You ask whether they want you to call someone. They say they have tried switching the phone off, removing the battery and leaving it in another room. The sound continues whenever they are near a screen.","They say the lift is the worst place because the walls seem to carry it."],detail:["They describe the sound as a rhythm rather than a melody. It changes when people enter or leave a room. They say they can almost predict when the doors will open by listening to it.","The sound cuts off as the lift reaches the next floor."],quiet:["You stay silent. The passenger holds their ears and stares at the floor. The sound fades as the lift slows.","After they leave, you can still feel the rhythm in your jaw."],touch:["You reach for the phone to help switch it off. The moment your fingers touch the case, the sound becomes clear and loud. The passenger gasps and pulls it away.","A vibration runs from your fingertips to your wrist. The phone screen stays black."],check:["You look at your phone. It is not playing anything. Your jaw still seems to remember the rhythm."] ,exposure:1},
{id:"elevator_knees",title:"A co-worker keeps their knees locked",text:["A co-worker enters and stands very straight, knees locked and feet close together. When the lift moves, their legs tremble. They grip the handrail and stare at the floor.","They apologise for taking up space. You say it is fine. Their shoes shift slightly, heels lifting and lowering in a repeated pattern. They seem to be trying to stop their legs from moving.","The lift passes the second floor. The co-worker bends their knees suddenly, then straightens again, as if testing a new way to stand."],note:"Their balance seems to be changing in a small but visible way.",ask:["You ask whether they feel dizzy. They say the floor keeps seeming to tilt, even when it is level. They can stand more comfortably if they widen their stance.","They say they have started avoiding stairs because their legs sometimes move too quickly."],detail:["They say their balance is changing, but not getting worse. It feels as if their body is learning a different centre of gravity. They are not sure they want to know why.","They step out carefully and test their footing in the corridor."],quiet:["You keep to your side of the lift. The co-worker grips the rail until the doors open, then walks away with a wider stance than before.","You notice your own feet adjusting slightly as the lift starts again."],touch:["You offer an arm to steady them. Their grip closes around your sleeve, and their balance shifts with surprising force. Your knees flex automatically to keep you upright.","The co-worker lets go and thanks you. Your legs feel springy for several seconds."],check:["You stand still and test your balance. Your feet shift apart without you thinking about it, then return to normal."] ,exposure:0}
];

{id:"work_whisper",title:"A colleague whispers from behind a stack of boxes",text:["You are passing the stores area when someone whispers your name from behind a stack of boxes. A colleague steps out, looking pale. They ask whether you have heard the machines making a low sound even after they are switched off.","They say they have been hiding in the stores room because the production floor feels too loud. They keep glancing towards the ceiling vents. Their voice drops whenever another worker passes.","A trolley rolls by on its own for a few centimetres, then stops. The colleague watches it as if waiting for it to move again."],note:"They are trying to keep their symptoms private at work.",ask:["You ask what they have heard. They say the ventilation sounds like someone breathing through a wall. They can tell which room the sound is coming from, even when the doors are closed.","They ask you not to tell the supervisor until they decide what to do."],detail:["They say the sound gets louder when they are alone. They have begun leaving lights on and doors open. They ask whether you could walk with them back to the floor.","You agree, and they seem relieved."],quiet:["You pretend you did not hear the whisper. The colleague steps back behind the boxes, then emerges a moment later and walks away in the opposite direction.","The ventilation fan seems unusually loud as you continue."],touch:["You touch their shoulder. They flinch and whisper your name again, this time in a voice that sounds like it came from the vent.","Your ears pressure briefly. The colleague looks as startled as you feel."],check:["You pause beneath the vent. It sounds like ordinary airflow, but you cannot stop listening for a second rhythm."] ,exposure:1},
{id:"work_spill",title:"A worker drops a tray and reacts like an animal",text:["A worker carrying a tray of instruments drops it. The clatter rings through the room. They crouch immediately, shoulders hunched, and make a sharp chuffing sound before they seem to realise what happened.","They look around in embarrassment. Nobody laughs. One colleague quietly helps collect the items while the worker keeps their head lowered.","When they stand, they move with a quick, careful step, as if ready to bolt. Their eyes keep tracking every movement in the room."],note:"The reaction is involuntary and seems linked to sudden noise.",ask:["You ask if they hurt themselves. They say no, but the noise felt like it hit them physically. Their body reacted before they could think.","They say it has happened several times today. They are trying to avoid sudden sounds."],detail:["They say their reflexes have become too quick. They sometimes duck before an object moves, and they have started startling people by reacting too early.","They thank you for not making a joke about it."],quiet:["You keep working and let the colleague collect the tray. They seem grateful that nobody made a scene.","For the next few minutes, every clatter on the floor makes you tense your shoulders."],touch:["You help them stand and touch their forearm. Their muscles tighten and they make another short chuff. Your own shoulders jerk in response.","The contact is brief, but your skin feels warm where you touched them."],check:["You flex your shoulders and hands. They move normally, although you remain unusually alert to sudden noises."] ,exposure:1},
{id:"work_sleeve",title:"Someone keeps pulling their sleeves over their hands",text:["A colleague at the next station keeps tugging their sleeves down over their hands. Each time they reach for a tool, their fingers move in a small, rapid pattern. They stop whenever someone looks over.","They are trying to work normally, but they keep dropping things. A pen rolls off the bench. They catch it before it reaches the floor, then look surprised by how quickly they moved.","They notice you watching and give a small shake of the head, asking you not to say anything."],note:"Their hands are changing, but they are still trying to work.",ask:["You ask if they need a break. They say their fingertips feel too sensitive and their hands keep reacting to movement around them. They can catch objects without looking, but fine tasks are becoming difficult.","They ask whether your hands have felt different today."],detail:["They say the changes are strongest when they are concentrating. Their fingers sometimes move before they decide what to do. They are worried about making a mistake at work.","They agree to tell the supervisor they need a break."],quiet:["You look back at your own task. The colleague keeps their sleeves down and works more slowly.","You notice your own fingers tapping lightly against the edge of the bench."],touch:["You touch their sleeve to get their attention. Their fingers close around your wrist through the fabric, quick and firm. They release you immediately.","Your hand tingles. The colleague looks frightened and asks whether you felt that too."],check:["You examine your wrist. There is no mark, but the skin feels warm where their fingers closed around it."] ,exposure:1},
{id:"work_smell",title:"A co-worker says the room smells like a forest",text:["A co-worker walks into the break area and stops. They sniff the air, then look towards the lockers. They say the room smells like a forest after rain. Nobody else seems to notice.","They begin naming details: damp bark, moss, crushed leaves, cold soil. Their description is so exact that you can almost smell it yourself. They ask whether you can smell it too.","A cleaner passes with a bucket. The co-worker turns towards the bucket and says the smell is coming from the water, not the cleaning liquid."],note:"Their sense of smell seems to be changing dramatically.",ask:["You ask when the smell started. They say it began at home, then followed them to work. They can smell people before they enter a room and tell who has been near the lockers.","They are worried that it will become impossible to ignore."],detail:["They say they can follow a scent trail through the building. They do not want to do it, but their attention keeps being pulled towards it.","They ask you to walk with them outside for a minute."],quiet:["You say nothing. The co-worker keeps sniffing the air and eventually leaves the room, following the smell towards the corridor.","For a moment, you notice the faint scent of damp leaves too."],touch:["You touch their elbow. They turn sharply and inhale near your sleeve. They apologise immediately, saying they were trying to identify the smell.","You become aware of your own scent in a way that feels oddly personal and uncomfortable."],check:["You smell your sleeve. It smells like your usual detergent, with a faint earthy note beneath it."] ,exposure:0},
{id:"work_stare",title:"A colleague freezes when you walk past",text:["A colleague is standing beside the production board, staring at a blank section of wall. You say hello. They do not respond. Their eyes follow something moving across the wall, although there is nothing there.","When you step closer, they blink and look at you. They apologise and say they were listening. You ask what they were listening to. They say the wall makes a sound like distant footsteps.","They ask whether you have been feeling strange today. Their expression suggests they already know the answer."],note:"They appear to be seeing or hearing something just outside ordinary perception.",ask:["You ask what they mean by listening. They say they can hear movement inside the wall, not through it. They have been trying to work out whether it is travelling towards or away from them.","They say the sound changes when people walk past."],detail:["They say the footsteps stop whenever someone looks directly at the wall. They have begun watching it from the corner of their eye instead.","They ask you to tell them if you hear it too."],quiet:["You do not press them. They return to the production board, but their eyes keep flicking towards the wall.","As you walk away, you hear a faint step from behind the paint."],touch:["You touch their arm. They jump and grab your sleeve. Their eyes are wide, and they whisper that something moved behind you.","A chill moves down your back. When you turn, the corridor is empty."],check:["You look over your shoulder. There is nobody there. You can still feel the colleague's grip on your sleeve."] ,exposure:1},
{id:"work_breath",title:"Someone is breathing against a closed locker",text:["You pass the locker room and hear breathing from inside one of the changing cubicles. The door is closed. It sounds slow and deliberate, with a faint clicking at the end of each breath.","You knock. The breathing stops. A co-worker opens the door a few centimetres and looks out. Their face is flushed. They say they are fine, but they keep one hand pressed against their chest.","They ask whether anyone else is nearby. They seem relieved when you say the corridor is quiet."],note:"The co-worker may be hiding an involuntary change in their breathing.",ask:["You ask if they need help. They say their breathing has started making a sound they cannot control. It is worse when they are nervous or when the room is quiet.","They are afraid someone will hear and report them."],detail:["They say it sounds like a low purr when they breathe out. They have tried holding their breath, but the sound returns as soon as they relax.","They ask you to wait outside while they collect their things."],quiet:["You step away from the door. The co-worker waits until you have moved before leaving the cubicle.","You hear the low breathing again as the door closes behind them."],touch:["You place a hand on the door to steady it. The co-worker reaches out and briefly touches your wrist. Their skin is warm and their breath makes the metal door vibrate.","A small vibration remains in your wrist after they let go."],check:["You press your fingers against your wrist. The vibration is gone, but you can still hear the rhythm in your head."] ,exposure:1}

function installEncounterScenes(events, chapter, time, nextScene) {
 for (const ev of events) {
  S[ev.id]={time,chapter,title:ev.title,text:ev.text,note:ev.note,choices:[
   C("✋","Ask if they are okay","You want to understand what is happening.",ev.id+"_ask",{care:1,social:1,infection:1,minutes:3}),
   C("—","Stay quiet and watch","You do not want to embarrass them.",ev.id+"_quiet",{calm:1,minutes:1}),
   C("✋","Touch their arm or shoulder","You want to get their attention or steady them.",ev.id+"_touch",{care:1,infection:2,minutes:2}),
   C("↗","Keep your distance","You do not know what is happening, and you need to keep moving.",nextScene,{independent:1,minutes:2})
  ]};
  S[ev.id+"_ask"]={time,chapter,title:"You decide to ask what is happening.",text:ev.ask,choices:[
   C("⌕","Ask them to explain a little more","Their answer raises another question.",ev.id+"_detail",{curious:1,minutes:2}),
   C("→","Wish them well and move on","You have heard enough for now.",nextScene,{care:1,minutes:2})
  ]};
  S[ev.id+"_detail"]={time,chapter,title:"They tell you a little more.",text:ev.detail,choices:[
   C("→","Continue on your way","You cannot stay here all morning.",nextScene,{curious:1,minutes:2}),
   C("✋","Offer to get someone to help","They should not have to deal with it alone.",nextScene,{care:1,trust:1,minutes:3})
  ]};
  S[ev.id+"_quiet"]={time,chapter,title:"You decide not to interrupt.",text:ev.quiet,choices:[
   C("→","Continue on your way","Leave them some space.",nextScene,{calm:1,minutes:2}),
   C("✋","Turn back and quietly offer help","You do not want to leave them struggling.",ev.id+"_ask",{care:1,minutes:2})
  ]};
  S[ev.id+"_touch"]={time,chapter,title:"You make brief contact.",text:ev.touch,choices:[
   C("⌕","Check your own skin and senses","You want to see whether anything changed.",ev.id+"_check",{curious:1,minutes:2}),
   C("→","Step away and continue","You need to put some distance between you.",nextScene,{independent:1,minutes:2})
  ]};
  S[ev.id+"_check"]={time,chapter,title:"You check yourself.",text:ev.check,choices:[
   C("→","Continue on your way","You will keep an eye on it.",nextScene,{calm:1,minutes:2})
  ]};
 }
}

function chooseUnseenEncounter(pool){
 let seen=s.flags.encountersSeen||[];
 let available=pool.filter(id=>!seen.includes(id));
 if(!available.length){s.flags.encountersSeen=seen.filter(id=>!pool.includes(id));available=pool;}
 const chosen=available[Math.floor(Math.random()*available.length)];
 s.flags.encountersSeen.push(chosen);
 return chosen;
}

["Recovered file 13 — Ren's voice memo","Ren recorded this message while walking beside the river. They say the town feels like it is holding its breath. The traffic is quieter, but the small sounds are clearer. They can hear the water under the bridge and the leaves turning in the wind. They say they saw someone standing on the far bank, watching the current. The person looked up when Ren called out, but did not come closer. Ren says the person was smiling. Not a happy smile. A relieved one. The memo ends with Ren saying: If you hear me calling, make sure it is actually me. I don't know why I said that. I just wanted it recorded."],
["Recovered file 14 — Nia's notebook","The sound is not one sound. It has layers. There is a low part that feels like the building. There is a thin part that feels like light. There is a quick part that feels like footsteps. Sometimes there is a voice inside it, but not a voice that uses words. When I am frightened, everything arrives at once and I cannot separate it. When someone sits with me and speaks slowly, I can hear the spaces between the sounds. I do not think the signal is angry. I think it is trying to find a rhythm we can share. I wish the adults in the room would stop talking over it."],
["Recovered file 15 — Lee's incident report","At 08:19 all work-floor screens flickered. No power interruption was recorded. The conveyor controls stopped for approximately nine seconds. During that time, three employees reported hearing a knocking sound from below the floor. One employee reported seeing text on a monitor. The text was not captured by the system log. The loading bay camera shows an unidentified figure between two pallet stacks. The figure is visible for one frame only. It does not appear in the frames immediately before or after. The report recommends checking the camera hardware. A handwritten addition says: The figure is standing where the floor plan shows no space."],
["Recovered file 16 — Sam's witness statement","Martin was not acting like someone who wanted to frighten us. He looked embarrassed. He kept apologising for asking us to turn the lights down. He said the lights were making a sound and that the sound was pressing against his teeth. I asked whether he had a headache. He said no. He said he could hear the building thinking. I told him buildings do not think. He looked at me for a long time and said maybe not in the way we do. Then the lights flickered. I went to get Lee. When I came back, Martin was gone. I wish I had stayed."],
["Recovered file 17 — Old station instruction manual","The station was designed to record environmental patterns over long periods. Operators were instructed to avoid making unnecessary noise, to keep a consistent schedule and to log any changes in wind, vibration, temperature or pressure. The manual includes a warning that human movement can affect sensitive readings. It does not mention biological exposure or infection. A later handwritten addition says: If the readings appear to respond to the operator, stop the session and leave the room. Do not attempt to establish a call-and-response pattern. The handwriting is dated several years before the first Greywake report."],
["Recovered file 18 — Signal pattern log","The signal appears in short sequences. Some repeat every few minutes. Others change according to the number of people in the room. When one person speaks, the pattern sometimes becomes quieter. When several people speak at once, it becomes louder. The signal is strongest near places where people repeatedly gather: bus stops, break rooms, waiting areas, kitchens and corridors. A technician suggested that it may be learning the shape of human routines. Another wrote that this description is too sentimental for a technical report. Both notes remain in the file."],
["Recovered file 19 — Patient's letter home","I am sorry I did not call. I could not find a way to explain what was happening without making you think I was frightened of you. I was frightened of myself. I still am, sometimes. But there are moments when the changes feel natural, like a movement I have been holding back for years. I can still remember the kitchen at home, the old curtains, the smell of your soap. I can remember every ordinary thing. Please do not think I have forgotten you just because I do not look the same every morning. I am trying to find a way to come home."],
["Recovered file 20 — Shopkeeper's note","The first change I noticed was that people stopped looking at their phones while they waited outside. They listened. At first I thought they were waiting for a bus or watching the weather. Then I noticed that each person seemed to be listening to a different thing. One turned towards the river. One watched the roof. One kept looking at the ground. They were not speaking to each other, but they seemed to know when another person was about to move. The shop stayed open because people still needed milk, bread and batteries. I stopped asking what was wrong. I started asking whether they needed anything."],
["Recovered file 21 — Bus driver's report","At 07:22 a passenger asked me to stop before the official stop. They said they could hear someone calling from the road. I told them there was nobody there. They said they knew, but the call was familiar. I pulled in anyway. The passenger got off and stood beside the shelter. They did not walk towards the voice. They just listened until the bus behind us sounded its horn. Then they turned and got back on. They thanked me and sat down. At the next stop, they asked whether I could hear the river. We were nowhere near the river."],
["Recovered file 22 — Weather station log","Wind speed: low. Rainfall: none. Ground vibration: irregular. Air pressure: stable. Audio input: unavailable. At 03:11, the station recorded a repeating sequence that resembles a human walking pattern. At 03:14, the sequence changed to match the operator's heartbeat. At 03:17, the operator left the building. The recording continued for another forty minutes. At 03:58, the sequence stopped. The final note reads: The room is quiet now, but it does not feel empty."],
["Recovered file 23 — Photograph caption","This photograph was taken in the Northline car park at 06:11. The photographer says the scene was empty when they pressed the shutter. In the finished image, a person is visible near the far fence. Their face is turned away. Their shadow points towards the camera, although the sun is behind them. The photographer returned to the same place at noon and found no footprints. The image metadata shows it was saved twice, three hours apart, without being opened."],
["Recovered file 24 — Final audio transcript","Voice one: Are you still there? Voice two: Yes. Voice one: Can you hear me? Voice two: I can hear the room around you. Voice one: That isn't what I asked. Voice two: I know. Voice one: Are you changing? Voice two: Yes. Voice one: Do you know what into? Voice two: Not yet. Voice one: Are you afraid? Voice two: Sometimes. Voice one: What happens when it finishes? Voice two: I think I will still know your name. The recording ends with a soft sound like a hand being placed against glass."],
["Recovered file 25 — Aftercare guidance draft","Do not assume that a person who has changed appearance has lost memory, judgement or preference. Ask before touching them. Ask what makes a space comfortable. Do not crowd them with questions. If they describe unfamiliar sensations, record their words without replacing them with a diagnosis. Maintain contact with people they trust, if they want that contact. Avoid forcing a person to demonstrate abilities or explain the final form. The draft ends with a line that was crossed out and then written again: A person is not a symptom, and an unfamiliar body is not proof of an unfamiliar mind."],
["Recovered file 26 — Unsent note from Martin","I used to think I knew what being myself meant. My name, my job, my hands, the way I walked into a room. Now I am not sure those things were the whole answer. I still get annoyed when someone leaves a cup in the sink. I still hate the alarm. I still want to see my sister. But I can hear the weather moving across the estate and I know when someone is about to turn a corner. I do not want to be treated like a warning sign. I want to be asked what I need. Today I need my jacket, a quiet room and a chance to decide where I go next."],
["Recovered file 27 — Town council call log","Caller reports that the street outside the old clinic is unusually quiet. Caller says people are standing at opposite ends of the road and turning their heads at the same time. Operator asks whether there is a disturbance. Caller says no, that is the strange part. Nobody is fighting. Nobody is shouting. They are simply waiting. Caller asks whether the council has received reports of people hearing a low sound near the river. Operator records the issue as noise pollution. Caller says it is not noise. It is more like a question. The call ends when the caller says they think the question has just been answered."],
["Recovered file 28 — Research ethics note","The response team must not decide an individual's outcome on the basis of early sensory changes. A person who reports hearing birds does not necessarily develop flight-related traits. A person who seeks water does not necessarily develop an aquatic form. The relationship between behaviour and endpoint is probabilistic, not deterministic, and may be altered by later choices. Any attempt to force a specific result risks harming the subject and undermining their ability to participate. The final sentence is underlined: Do not turn a living person into a prediction."],
["Recovered file 29 — A message saved but never sent","I keep opening the phone because it is the one thing that still behaves normally. The screen lights when I touch it. Messages arrive in boxes. The feed scrolls. I can read the same words I read yesterday. But the person looking at the screen is not quite the person who woke up this morning. I do not know whether that is a bad thing. I wish someone would tell me that I can take my time. I wish I knew whether the next time I look in the mirror I will recognise the face looking back."],
["Recovered file 30 — The station's last note","The signal has stopped repeating the original sequence. It now changes in response to the people standing in the room. We cannot determine whether this means the process is ending or becoming more complex. The light in the central column is no longer stable. It appears to gather around each person in turn, then withdraw. There is no evidence that it is selecting a preferred outcome. There is evidence that it responds when people are given a choice. Recommendation: open the doors, remove the restraints, and let the subjects decide whether to approach. The final handwritten line says: Let them meet it as themselves."]
);

const endings={
wolf:{title:"THE WOLF",animal:"wolf",body:[
"The first change is in your balance. Your weight shifts forward, your shoulders settle, and the floor seems to offer a route rather than a surface. Your hearing sharpens until you can separate the breathing of everyone in the room. You smell damp wool, dust, rain on the car park and the faint trace of food in someone's pocket. The details arrive too clearly to ignore.",
"Your hands and feet change gradually. Your fingers shorten and draw together; your nails become hard claws. Your jaw lengthens, your ears move higher, and a thick coat grows over your skin. The change is strange but not painful. Your body finds a four-legged balance that feels unfamiliar for only a few seconds. Your old clothes fall around you, suddenly much too large.",
"When the light fades, you are a real grey wolf. You stand on four paws, with a long muzzle, pointed ears, a thick tail and a dense coat. You can smell the people around you and recognise them individually. You remember your name, your home and the morning you woke feeling ill. The animal looking back from the glass is a wolf, not a person wearing a wolf's shape.",
"You test one step, then another. Your body knows how to move. You are not sure what the town will make of you, but you are still curious about it. A familiar voice says your name. You turn towards it. You know who it is. You are still you, even though you are now entirely a wolf."
]},
fox:{title:"THE FOX",animal:"fox",body:[
"The room becomes a collection of small openings and possible routes. You notice the gap beneath a door, a loose panel, a shadow behind a chair. Your attention keeps moving. The change gathers around that alertness. Your shoulders narrow, your spine lengthens, and your balance shifts towards quick, light steps.",
"Your fingers draw together as your hands become paws. A fine coat spreads across your body, warm russet along your back and pale beneath your throat. Your face lengthens into a narrow muzzle. Your ears rise into tall triangles. A thick brush of a tail grows behind you, heavier than you expect and surprisingly useful for balance.",
"The reflection shows an ordinary red fox: pointed muzzle, bright eyes, black lower legs, white-tipped tail and a russet coat. You are not a hybrid or a mythical creature. You are a fox. You can hear a mouse moving inside the wall and smell rain in the grass beyond the station.",
"You move in a quick circle, testing the room. You can fit through spaces that once looked too small. You remember every person who spoke to you today, but you no longer feel the need to explain yourself to all of them. The world is full of hidden paths, and you know how to find them."
]},
cat:{title:"THE CAT",animal:"cat",body:[
"The first change is a strange sense of balance. Your body seems to know where every edge is. You can feel the exact distance between the floor and the chair, the window ledge and the table. Your hearing becomes precise. A small movement behind the wall is as clear as a footstep beside you.",
"Your shoulders and spine loosen. Your hands become compact paws, your nails retract into claws, and a soft coat grows across your skin. Your face shortens into a feline muzzle. Whiskers emerge, each one sensitive to the air around it. Your eyes widen, and the room seems brighter even as the light outside fades.",
"You look down and see a normal domestic cat's body: four paws, a flexible spine, a tail, whiskers and a coat. The exact colour is the one your reflection has been hiding until now. You are fully a cat, not a person with cat ears. Your voice becomes a small, surprised meow.",
"The room is suddenly full of interesting places: a warm patch of carpet, the underside of a chair, the windowsill, the narrow space behind a cupboard. You remember your old life clearly. You also discover that a quiet corner and a familiar person nearby can feel like the safest things in the world."
]},
dog:{title:"THE DOG",animal:"dog",body:[
"The change begins with smell. Every person in the room has a distinct scent, and you can tell who is nervous, who is tired and who has been outside in the rain. Your attention keeps returning to the people around you. You want to know where they are and whether they are all right.",
"Your posture lowers. Your hands and feet become paws, your jaw and nose lengthen, and a coat grows over your body. Your ears change shape. Your tail follows the movement of your spine, and your hearing becomes sensitive to small changes in tone. Your new body is strong and built for walking, running and staying close to others.",
"The transformation finishes with you as an ordinary dog. Your breed and coat pattern settle into a clear shape: a real domestic dog, with four legs, paws, a muzzle, ears and a tail. You can no longer use a phone or speak human words, but your memories remain. You recognise the people who treated you kindly.",
"You walk towards the nearest familiar person and sit beside them. The action feels natural. You still remember being the person who woke up sick and debated whether to go to work. Now the most important thing is that the people you care about are safe, and that someone remembers to open the door when you need to go outside."
]},
deer:{title:"THE DEER",animal:"deer",body:[
"Your hearing moves outward. You become aware of tiny sounds beyond the walls: a bird shifting on a roof, tyres on wet road, leaves moving along the fence. Your body responds to every change in the room. You feel an urge to find open space, somewhere you can see in every direction.",
"Your legs lengthen and strengthen. Your feet narrow into split hooves. Your posture rises, your neck extends, and a short coat grows across your body. Your face becomes long and delicate, with large dark eyes set to either side. The changes are careful and steady, like your body is assembling a shape it has practised in secret.",
"The reflection reveals a real deer. You stand on four slender legs, with cloven hooves, a short tail, a soft brown coat and large alert ears. If you are male, antlers may grow; if female, your head remains smooth. You are a deer, an ordinary animal built to notice danger and move quickly through open ground.",

horse:{title:"THE HORSE",animal:"horse",body:[
"A restless energy moves through your legs. You want to stand, stretch and move. The floor seems to have more room than it did a moment ago. Your breathing deepens. Your heartbeat feels powerful and steady. The transformation begins with your posture, lifting your body and changing the way your weight is carried.",

owl:{title:"THE OWL",animal:"owl",body:[

]},
raven:{title:"THE RAVEN",animal:"raven",body:[
"Your attention keeps catching on objects: a key on a table, a bright screw near the wall, a loose piece of foil, the reflection in a window. You notice patterns and remember where everything is. A restless curiosity builds, along with the urge to move, look and investigate.",
"Your arms become wings beneath a spreading layer of black feathers. Your hands reshape into the ends of the wings. Your face pushes forward into a strong dark beak. Your legs become scaled and clawed, and your body grows lighter. Your voice changes into a rough call that surprises you when it leaves your throat.",
"You are a real raven: black feathers with a subtle sheen, strong beak, intelligent eyes, wings and clawed feet. You are not a fantasy bird or a hybrid. Your body is entirely that of a raven. The room looks different from the shelf where you land, and you can remember the exact place of every object you noticed.",
"You turn your head and study the people around you. You still recognise them. You remember the small details of the day, including the missing keys and the stranger outside. A bright object catches your eye. You are curious, but you are also free to decide whether to investigate it."

otter:{title:"THE OTTER",animal:"otter",body:[
"You become aware of water everywhere: inside the pipes, in the damp air, beneath the road and in the river beyond the estate. The sensation is not thirst. It is a pull towards movement and coolness. Your hands feel restless, as if they are waiting to touch and turn something in the water.",
"Your body lengthens and becomes streamlined. Your fingers and toes develop webbing. A dense coat spreads over your skin, and your face becomes short and rounded with whiskers. Your tail grows long and strong, helping your balance. Your breathing and posture adjust to a body designed for swimming.",
"The reflection shows a real otter, with a sleek brown coat, whiskered muzzle, webbed feet and powerful tail. You are fully an otter. You can move on land, but the thought of slipping into water feels immediately right. The changes have not made you a mythical creature; they have made you an ordinary animal with an extraordinary new life.",
"You remember your old home and the people you met. You also hear water moving beyond the station. It is a clear direction. You move towards the door with a quick, fluid gait, eager to discover the river without knowing exactly what you will find there."
]},
badger:{title:"THE BADGER",animal:"badger",body:[
"The noise in the room becomes less important. You are drawn towards the solid things: the floor, the walls, the weight of the building, the dark space beneath the stairs. You feel patient and stubborn. The idea of being hurried becomes unpleasant. You want a safe place that belongs to you.",
"Your body lowers and grows compact and powerful. Your forelegs strengthen. Your hands become digging paws with long claws. Your face lengthens, and dark markings appear along the sides of your pale head. A coarse coat spreads over your back. Your shoulders and neck become strong enough to push through earth and loose material.",
"You are a real badger, with a stocky body, short powerful legs, digging claws, a grey coat and the familiar black-and-white striped face. You are fully an animal now. Your senses are sharp, but you prefer the safety of cover and the quiet of a place where you can rest undisturbed.",
"You remember the day and the decisions that brought you here. You do not feel the need to rush into the open. You find a dark, sheltered corner and settle there, knowing you can emerge when you are ready. The world can wait a little."
]},
hare:{title:"THE HARE",animal:"hare",body:[
"Your legs begin to feel spring-loaded. A small movement makes you want to move with it. Your hearing catches every change in the room, and your eyes keep checking the edges of the space. You feel alert, quick and easily startled, but there is also a strange excitement in the ability to move so quickly.",
"Your hind legs lengthen and strengthen. Your forelegs become small paws, your feet grow long, and your body becomes light. Your ears rise high above your head. A soft coat grows across your back and pale fur along your underside. Your face narrows, your nose twitches, and your eyes sit wide to the sides.",
"You look down and see a real hare: long ears, powerful hind legs, long feet, a compact body and a natural brown coat. You are entirely a hare. Your new body is built for sudden bursts of speed and quick turns across open ground.",
"You test one jump and land farther away than expected. The room is too enclosed for the movement you want. You remember your old life, but the open field outside has become an irresistible possibility. You pause at the door, listening, then move towards the grass."
]},
seal:{title:"THE SEAL",animal:"seal",body:[
"A coolness spreads through your body. The air feels dry, and you become aware of the dampness on the window and the water moving through the pipes. Your balance changes. Your shoulders and back begin to work together in a new way, as if your body is preparing to move through a medium that is heavier than air.",
"Your arms and legs reshape into flippers. Your body becomes smooth and streamlined, and a dense layer of fur grows over your skin. Your neck shortens, your face becomes rounded, and whiskers spread from your muzzle. Your breathing changes, and the world seems to slow as your body adapts to holding its breath.",
"The reflection shows a real seal, with a rounded body, smooth coat, whiskered face and flippers. You are fully a seal, not a person with fins. On land your movement is awkward but possible; in water your body would be far more graceful.",
"You remember the people who helped you, the road outside and the sound of rain. Beyond the building, the river carries water towards the coast. You do not know what comes next, but you feel a deep pull towards the shoreline and the open water beyond it."
]},
squirrel:{title:"THE SQUIRREL",animal:"squirrel",body:[
"Your attention becomes quick and restless. You notice every small object and every possible hiding place. You keep glancing upwards, towards shelves, pipes and window frames. Your body feels lighter, and the urge to climb grows stronger with every passing minute.",
"Your hands and feet become small gripping paws. Your legs shorten, your spine becomes flexible, and a soft coat grows over your body. Your ears rise, your face narrows, and a long bushy tail grows behind you. Your teeth change into the strong incisors of a rodent, suited to cracking seeds and nuts.",
"You are a real red squirrel, small and quick, with bright eyes, pointed ears, nimble paws and a large bushy tail. You are fully an animal. The room is enormous now, full of climbable surfaces and places to hide.",
"You remember your old home and the ordinary routine of getting ready for work. You also find yourself checking every ledge and corner. A small movement outside catches your eye. You dart towards the window, curious about the world beyond it."
]},
hedgehog:{title:"THE HEDGEHOG",animal:"hedgehog",body:[
"You want to curl inwards. The room feels too bright and too open, and every sound seems to come from too close. A calm, protective instinct settles over you. You begin to prefer the quiet spaces beneath furniture and behind boxes.",
"Your body becomes small and rounded. Your face narrows into a pointed snout, your legs shorten, and a dense covering of spines grows across your back. Your underside remains soft with fur. Your paws become small and clawed, suited to walking and digging through leaves and soil.",
"The final reflection shows an ordinary hedgehog, with a pointed face, tiny ears, small paws and a coat of protective spines. You are fully a hedgehog. You can curl into a tight ball when startled, and your sense of smell is far more useful than your eyesight.",

function addClue(){const n="A detail from the day has been saved to your notes.";if(!s.clues.includes(n))s.clues.push(n);}
function advanceClock(minutes){if(!minutes)return;const p=s.time.split(":").map(Number);let total=p[0]*60+p[1]+minutes;if(total>=1440){s.day+=Math.floor(total/1440);total%=1440;}s.time=String(Math.floor(total/60)).padStart(2,"0")+":"+String(total%60).padStart(2,"0");}
function sceneClock(t){if(!t)return;const p=t.split(":").map(Number),q=s.time.split(":").map(Number);const target=p[0]*60+p[1],current=q[0]*60+q[1];if(s.day===2&&target<current&&current>20*60)s.time=t;else if(target>current)s.time=t;}
function effects(e={}){Object.entries(e).forEach(([k,v])=>{if(k==="clue"){for(let i=0;i<v;i++)addClue();}else if(k==="minutes"){advanceClock(v);}else if(k==="route"){s.flags.route=v;}else if(k==="atHome"){s.flags.atHome=!!v;}else if(k==="infection"){s.infection=Math.max(0,(s.infection||0)+v);if(s.infection>=5)s.condition=Math.max(s.condition,2);if(s.infection>=9)s.condition=Math.max(s.condition,3);if(s.infection>=14)s.condition=Math.max(s.condition,4);}else if(Object.prototype.hasOwnProperty.call(s.stats,k)){s.stats[k]+=v;}});}
const roadPool=[
{name:"a cyclist in a yellow jacket",title:"A cyclist has stopped beside the road.",text:["A cyclist in a yellow jacket is crouched beside a bicycle near the kerb. The chain has slipped off. They look up when you approach and ask whether you have a minute. Their hands are black with grease. A delivery van passes, and the cyclist flinches at the sound of its engine.","They say they heard a strange low note while riding past the old clinic. It seemed to come from the road surface rather than the buildings. They stopped because the sound made their front wheel feel as if it were vibrating. The bicycle is ordinary. The road is ordinary. The cyclist's expression is not.","They thank you for stopping, whether or not you help. You notice a small pale mark at the base of their thumb. It resembles the marks you saw on your own neck this morning."]},
{name:"an older man walking a terrier",title:"A man with a small dog blocks the pavement.",text:["An older man is standing beside a low wall with a small terrier on a lead. The dog is not barking. It is staring at a drain cover, ears raised, body completely still. The man asks whether you can hear a tapping sound beneath the pavement.","He says the dog has stopped taking its usual route. Every morning it walks past the bakery, turns at the pharmacy and comes home. Today it refused to pass the drain. The man has tried treats, a different lead and a cheerful voice. Nothing works. The dog keeps listening.","When you crouch, the tapping stops. The terrier looks directly at you, then gives one quiet whine. The man asks if you have been feeling unwell. He says several people on the street look as though they have not slept."]},
{name:"a delivery driver with a paper map",title:"A delivery driver asks for directions.",text:["A delivery driver has pulled into a lay-by and is studying a paper map on the bonnet. Their phone has no signal. They ask whether the old weather station road is still open. You point towards the main road, but the driver shakes their head. They say the sat-nav keeps sending them down a lane that is not on the map.","They have been driving for an hour and keep passing the same bus shelter. The driver shows you a photograph. In the background, a person is standing beneath the shelter, facing away. The driver says the person was there on every pass, in exactly the same position.","The driver thanks you and folds the map. As they pull away, the radio inside the van makes a short, low sound. You hear it through the closed window."]},
{name:"a woman carrying shopping bags",title:"A stranger drops a bag of groceries.",text:["A woman carrying two shopping bags drops one near the crossing. An orange rolls into the road. You catch it before it reaches the kerb and hand it back. She laughs, embarrassed, then apologises for looking at you so closely.","She says you have the same pale marks she saw on her brother's wrist. He has been sleeping for most of the day and waking up with a different sense of smell. He says he can tell when it is going to rain. The woman says she does not know whether to believe him.","One of the bags has split. A carton of milk is leaking onto the pavement. She thanks you for helping and says she hopes you feel better. You did not tell her you were ill."]},
{name:"a road worker beside temporary barriers",title:"A road worker is standing beside an empty lane.",text:["A road worker in a fluorescent jacket stands beside a row of temporary barriers. No roadworks are visible. The worker is holding a stop/go sign but has not raised it. They ask whether you can hear a hum coming from the tarmac.","They say the sound started before sunrise. It comes and goes in a slow pulse. A second worker went to fetch a supervisor and has not returned. The first worker does not seem frightened; they seem annoyed that nobody will listen.","A car approaches and slows. The road worker raises the sign. For a moment the hum rises with the engine, then falls away. The worker looks at you as if you have just confirmed something they were hoping was not true."]},
{name:"a teenager waiting at a bus shelter",title:"Someone at the bus shelter is filming the empty road.",text:["A teenager is standing beneath the bus shelter, holding a phone towards the empty road. They lower it when they see you. They say they are trying to record a sound that happens between passing cars. Their friends think they are making it up.","They play the recording. At first it sounds like wind. Then there is a short sequence of clicks, followed by something that resembles a breath. The teenager says the sound appears on every recording, even when the phone is switched off and restarted.","They ask whether you have heard it too. You have. You just have not heard it through a phone before."]}
