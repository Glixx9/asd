"The pharmacy is quiet. A notice beside the till asks customers with fever or unusual symptoms to keep some distance and speak to the pharmacist rather than waiting in the queue. You explain the sore throat, headache and strange sensitivity to sound. You do not mention the pale marks until the pharmacist asks whether you have noticed anything unusual on your skin.",
"The pharmacist listens without making a diagnosis. They say several people have asked about similar symptoms, but there is no confirmed explanation. They advise you to follow ordinary health guidance, stay home if you feel unwell and contact the appropriate medical service if symptoms worsen. They do not claim to know what Greywake is.",
"While the pharmacist checks a leaflet, you notice a small display of travel-sized mirrors. In one of them, your reflection seems to blink a fraction later than you do. You turn away. The pharmacist returns and asks whether you have somewhere comfortable to rest."
],choices:[C("⌂","Go home and rest","You have enough information for now.","home_afternoon",{home:2,calm:1,minutes:15}),C("🌿","Walk along the canal before going home","You want to be outside a little longer.","canal_path",{water:2,minutes:18}),C("⌕","Ask about the other people reporting symptoms","You want to know whether there is a pattern.","pharmacy_reports",{curious:2,minutes:5})]},
pharmacy_reports:{time:"09:26",chapter:"Monday · The pharmacy",title:"The reports have one detail in common.",text:[
"The pharmacist cannot share anyone's private information, but says the public reports have become more consistent. People mention a low sound, unusual changes in smell, a feeling of pressure behind the eyes and brief markings on the skin. Some say the symptoms are worse indoors. Others say they are worse near roads, drains or large electrical systems.",
"The pharmacist says they have heard people describe the same sound in places that are miles apart. It is not loud enough to be called a noise complaint. It is more like a vibration that people notice when everything else becomes quiet. The official advice is still cautious because nobody knows the source.",
"You thank them and leave. Outside, the traffic sounds unusually distant. The canal path is only a short walk away. You could go home, or follow the water for a while."
],choices:[C("🌿","Follow the canal path","The water may help clear your head.","canal_path",{water:2,calm:1,minutes:15}),C("⌂","Go straight home","You are getting tired.","home_afternoon",{home:1,minutes:8})]},
canal_path:{time:"10:02",chapter:"Monday · The canal path",title:"The water is moving in the wrong direction.",text:[
"The canal path is quiet. A couple of people walk dogs on the far bank. A cyclist passes without ringing their bell. The water moves slowly beneath the bridge, carrying leaves and a paper cup. You stop beside the rail. The air is cooler here, and the headache eases a little.",
"You notice the water is moving against the wind. It is not a strong current, but the surface is travelling upstream in narrow lines. A duck follows one of the lines, then turns sharply and paddles away. You hear the small movement of its feet beneath the surface. You can distinguish it from the sound of the water against the stone.",
"A person is sitting on a bench with a dog beside them. The dog is watching you. It does not bark or pull at the lead. It simply watches, then looks down at the water. You feel an odd certainty that the dog has noticed the same current."
],choices:[C("≈","Sit and watch the water","Let the pattern settle in your mind.","canal_bench",{water:2,calm:1,minutes:12}),C("🐾","Approach the dog and its owner","The dog seems unusually interested in you.","canal_dog",{social:1,care:1,minutes:6}),C("🌳","Continue towards the park","You want to see what is happening beyond the bridge.","park",{wild:1,minutes:15})]},
canal_bench:{time:"10:18",chapter:"Monday · The canal path",title:"The current makes a pattern you almost recognise.",text:[
"You sit on the bench and watch the water. The lines on the surface repeat in groups of three. A leaf turns, pauses and moves back towards the bridge. You count the intervals without meaning to. The same rhythm appears in the sound beneath the path, a low pulse that seems to travel through the bench and into your legs.",
"For a moment you feel as if you could tell where the current is strongest without looking. You close your eyes. The water becomes a map made of small pressures and sounds. When you open them, the pattern is gone. The canal looks ordinary again.",
"Your phone vibrates. A local update says the old weather station road has been closed. The message includes a photograph of the gate. In the reflection of the sign, a person is standing behind the camera."
],choices:[C("🌳","Walk on to the park","You want to see whether the same pattern appears there.","park",{water:1,curious:1,minutes:12}),C("⌂","Head home","You have had enough fresh air for now.","home_afternoon",{home:1,minutes:10})]},
canal_dog:{time:"10:14",chapter:"Monday · The canal path",title:"The dog recognises something before its owner does.",text:[
"The dog is a small brown spaniel. It watches your face, then sniffs the air near your hand. Its owner apologises for the attention and says the dog has been acting strangely since yesterday. It keeps stopping at drains and listening to the ground. It has also started waking up before the alarm.",
"You crouch and let the dog sniff your fingers. It gives a quiet huff and sits down. The owner says it normally jumps at everyone. Today it seems unusually calm. You notice the dog has a pale mark beneath one ear, almost hidden by the fur.",
"The owner asks whether you have been near the old clinic. You say no. They nod as if that confirms something, then stand and continue along the path. The dog looks back once before following."
],choices:[C("🌳","Continue towards the park","There may be more to see beyond the bridge.","park",{wild:1,care:1,minutes:12}),C("⌂","Return home","You need to rest.","home_afternoon",{home:1,minutes:10})]},
park:{time:"10:42",chapter:"Monday · The park",title:"The park is full of ordinary animals acting strangely.",text:[
"The park is not empty, but everyone seems to be keeping to themselves. A jogger slows near the trees. Two children throw crumbs for pigeons. A dog runs after a ball and stops halfway across the grass, looking towards the old road. The birds are quieter than usual, though you can hear them moving in the branches.",
"A fox appears near the bins. It is not especially large or unusual. It stands in the open for several seconds, looking directly at you. Then it turns and walks along the hedge. You notice that its route follows the same three-part rhythm you heard beneath the canal path.",
"You feel a sudden urge to follow it. Not to chase it, exactly. More like you know it has found a route through the park that you have never noticed. The fox disappears behind a row of shrubs. You can follow, sit and watch the birds, or head home."
],choices:[C("🦊","Follow the fox at a distance","You want to see where it goes.","fox_route",{curious:2,wild:1,minutes:10}),C("🐦","Sit beneath the trees and watch the birds","Stay still and listen.","bird_watch",{sky:2,night:1,minutes:12}),C("⌂","Go home","Your legs are beginning to feel heavy.","home_afternoon",{home:1,minutes:14})]},
fox_route:{time:"10:58",chapter:"Monday · The park",title:"The fox uses a path you had never seen.",text:[
"You follow the fox without getting too close. It slips through a gap in the hedge, crosses a narrow strip of grass and disappears beneath the low branches of a tree. You find the gap easily, although you have walked past this hedge many times without noticing it.",
"On the other side is a small service lane running behind the park. The fox stops beside a drain and looks down. You hear a faint tapping beneath the cover. The fox does not seem frightened. It waits, then moves away along the wall. You realise you have been holding your breath.",
"The lane leads towards a footbridge and the main road. You can return to the park or take the lane towards home. The fox is gone, but you still know which direction it went."
],choices:[C("→","Take the footbridge towards home","You have seen enough for now.","home_afternoon",{independent:1,minutes:14}),C("⌕","Look more closely at the drain","The tapping sounds familiar.","drain_inspection",{curious:2,minutes:5})]},
drain_inspection:{time:"11:06",chapter:"Monday · The park",title:"Something taps back from beneath the drain.",text:[
"You crouch beside the drain cover. The metal is cold. The tapping stops when you touch it. You lift your hand and wait. Three taps come from below, then two. You tap once with a fingernail. The answer comes immediately: three taps, then two.",
"A car passes on the road above. The vibration runs through the metal and into your wrist. You hear a much larger sound beneath it, a low hum that seems to move away from the park. You stand quickly. The skin at the back of your neck feels tight.",
"You take a photograph of the drain. The image shows only a wet metal cover and a few leaves. When you look up, a cyclist is standing at the end of the lane. They are watching you, but not approaching."
],choices:[C("→","Leave the lane and go home","You do not want to stay beside the drain.","home_afternoon",{calm:1,minutes:12}),C("✋","Ask the cyclist what they saw","They may have heard the tapping too.","road_encounter",{social:1,minutes:4})]},
bird_watch:{time:"11:02",chapter:"Monday · The park",title:"The birds move together, then separate.",text:[
"You sit beneath a tree and look up. Pigeons move along a branch. A blackbird hops between two patches of grass. A pair of magpies land on the fence and call to one another. Their movements are ordinary, but you find yourself following each one without effort.",
"A sudden gust moves through the trees. The birds lift together, turn over the path and settle on the roof of a nearby building. You can hear the individual wingbeats. For a moment the whole park seems to have a second layer of sound, one made of small movements and distant calls.",
"You look down at your hands. The fingers feel oddly light. There is a faint tingling along your forearms, like the first sensation of a limb falling asleep. You rub them and the feeling fades. The birds remain on the roof, all facing the same direction."
],choices:[C("→","Walk home through the trees","You want somewhere quiet.","home_afternoon",{sky:1,calm:1,minutes:15}),C("⌕","Follow the direction the birds are facing","They seem to be watching something beyond the park.","weather_station_road",{sky:2,curious:1,minutes:18})]},
weather_station_road:{time:"11:28",chapter:"Monday · The old road",title:"The road to the weather station is blocked.",text:[
"The road is closed by temporary barriers. There is no crew in sight, only a small sign asking people to turn back. Beyond the barrier, the tarmac looks damp and dark. You can hear a low sound coming from the other side, although the road is empty.",
"A small service gate stands open beside the fence. There are fresh tyre marks in the mud, leading towards the old weather station. A notice has been fixed to the gate with new screws. The paper is dry, but the ink has begun to run as if it has been exposed to rain.",
"You are not sure whether you should go closer. You could turn back, follow the fence to the public footpath, or ask the person standing beside the barrier what is happening."
],choices:[C("⌕","Read the notice carefully","The wording may explain the closure.","weather_notice",{curious:1,minutes:4}),C("↩","Turn back towards the park","You do not need to investigate every strange thing.","home_afternoon",{calm:1,minutes:12}),C("✋","Speak to the person by the barrier","They look like they may be waiting for someone.","road_encounter",{social:1,minutes:3})]},

station_approach:{time:"12:20",chapter:"Monday · Outside the weather station",title:"You reach the station, but the gate is locked.",text:[
"The path ends at a tall wire fence. Beyond it stands the old weather station, a low concrete building with a dish antenna and a row of dark windows. The place looks abandoned, but a light is on in one of the rooms. You can hear the low vibration clearly now. It seems to come from the ground beneath the fence.",
"A notice says the site is closed pending inspection. The padlock is new. There are fresh tyre marks in the gravel and a set of footprints leading to the gate. They stop at the fence. You look through the mesh and see a white van parked beside the building. It is the same van you saw in the town earlier.",
"You cannot get inside today without forcing the gate. You decide not to do that. The signal is stronger here, but it does not seem to be going anywhere. You can return home and come back in the morning, or walk around the fence and see whether there is a public path to the rear entrance."
],choices:[C("⌂","Return home and rest","You can come back when the site opens.","home_afternoon",{home:1,calm:1,minutes:25}),C("↗","Walk around to the rear fence","There may be another entrance.","weather_station_road",{curious:1,independent:1,minutes:12}),C("⌕","Photograph the van and the gate","Keep a record of what you saw.","home_afternoon",{curious:1,clue:1,minutes:8})]},
weather_notice:{time:"11:34",chapter:"Monday · The old road",title:"The notice has been replaced more than once.",text:[
"The notice says the road is closed for a structural inspection. The date is today's date, but the paper beneath it is older. You can see the corner of a previous notice, with a different reason printed on it: electrical fault. Beneath that is a third layer, where the words have been scratched away.",
"The sign has been fixed to the gate with fresh screws. The metal around them is warm. You touch it with one finger and hear a faint vibration. It is the same low pattern you heard in the bathroom, the canal path and the drain.",
"A vehicle approaches from the far side of the road. You step back. It is a plain white van with no company markings. It stops before the barrier. The driver does not get out. After a few seconds, the van reverses and disappears."
],choices:[C("→","Walk back towards the park","You have enough information for now.","home_afternoon",{calm:1,minutes:15}),C("⌕","Follow the fence towards the service entrance","There may be another way in.","service_gate",{curious:2,minutes:8})]},
service_gate:{time:"11:48",chapter:"Monday · The old road",title:"A service gate stands open in the fence.",text:[
"The service gate is not locked. Beyond it, a narrow gravel path runs between the fence and a line of trees. You can see the roof of the weather station in the distance. The path is quiet, but the gravel seems to shift under your shoes in a repeated rhythm.",
"A small metal box is attached to the fence. It has a keyhole and a warning label that has been scratched away. You can hear something moving inside it. It sounds like a tiny motor, but the box is not connected to a power source.",
"You are close enough now to smell damp soil and warm metal. The headache returns, but it is accompanied by a clear sensation of direction. You know the signal is stronger beyond the trees. You can continue, or leave before the feeling becomes harder to ignore."
],choices:[C("→","Continue towards the weather station","You want to see the source for yourself.","station_approach",{curious:2,sky:1,minutes:25}),C("↩","Turn back","You are not ready to go further.","home_afternoon",{calm:1,minutes:15})]},
home_afternoon:{time:"13:20",chapter:"Monday · Afternoon at home",title:"The afternoon passes in uneven pieces.",text:[
"By the time you get home, the light has changed. You put the shopping on the counter and sit down. Your body feels tired, but your mind is unusually alert. You can hear the neighbours moving around upstairs. A tap runs, a cupboard closes, and a chair scrapes across the floor. You can tell which room each sound comes from.",
"You try to watch television. The dialogue is difficult to follow because you keep hearing the electrical hum beneath it. You turn the volume down. The hum becomes clearer. You switch the television off. The room seems to settle, but the sound does not disappear.",
"Your phone has several new updates. One says the clinic is operating with reduced hours. Another says a bus route has been suspended. A third is a photograph of the old weather station road, taken from the other side of the fence. You recognise the same white van. It is parked beside the building now."
],choices:[C("⌂","Rest until evening","You are exhausted and need sleep.","evening_home",{home:2,calm:2,minutes:90}),C("▣","Read the latest local posts","Find out what has happened since the morning.","feed_night",{curious:2,minutes:20}),C("🌿","Go for another walk","You feel drawn towards the open air.","canal_path",{wild:1,minutes:25})]},
evening_home:{time:"18:12",chapter:"Monday · Evening at home",title:"The house makes sounds you have never noticed.",text:[
"The afternoon rest helps, but you wake with a different kind of awareness. The fridge clicks on and you can hear the motor start from the bedroom. A car passes outside and its tyres make a soft hiss over the road. Somewhere in the wall, a small animal scratches once, then goes quiet.",
"You make something simple to eat. Your appetite is inconsistent. You can smell the food clearly, but the taste changes from bite to bite. You wash the plate and leave it to dry. In the dark kitchen window, your reflection looks ordinary until you turn away. For a fraction of a second, it seems to remain facing you.",
"You check the time. The day has lasted longer than you expected. The official news is still repeating the same statements. The local posts are less certain. You decide to sleep early. Tomorrow, if the signal is still there, you will have to find out where it comes from."
],choices:[C("⌂","Go to bed","Let the night take over.","dream",{home:1,calm:2,minutes:35}),C("▣","Check the phone one last time","You want to know whether anything has changed.","feed_night",{night:1,minutes:10})]},
evening_window:{time:"19:02",chapter:"Monday · Evening",title:"Someone is standing beneath the streetlight.",text:[
"You look through the curtains. A person is standing beneath the streetlight across the road. They are not using a phone or waiting for a car. Their head is tilted slightly, as if listening to something above the houses. A passing car slows, then continues.",
"The person turns towards your window. You step back, but they do not move. After a few seconds, they raise one hand and point towards the end of the road. The gesture is not threatening. It feels more like an instruction to look.",
"At the end of the road, the streetlight flickers three times. The person beneath it is gone. You close the curtain. The sound in the walls is stronger now, and you know you will not sleep until you have listened to it properly."
],choices:[C("⌕","Look outside again","You want to see where the person went.","front_path",{curious:1,night:1,minutes:6}),C("⌂","Go to bed","You need to stop chasing every sound.","dream",{calm:2,minutes:15})]},
key_search:{time:"07:24",chapter:"Monday · The missing keys",title:"Where did you put your car keys?",text:[
"You stand in the hallway and try to remember the last time you used the car. You can picture taking your bag inside last night, but the rest of the memory is blurred. The key bowl is empty. The hook by the door is empty. You check your pockets again, even though you already know they are not there.",
"The house has four likely places: yesterday's jacket, the kitchen counter, the sofa cushions or the bedside drawer. You could search each one, but every search takes time. Your head still hurts. You can also give up and take the bus, walk, or decide to stay home after all.",
"You have a vague memory of hearing something drop last night. It might have been the keys. It might have been something else. The clock keeps moving while you stand in the hallway."
],choices:[C("⌕","Check yesterday's jacket","Search the pockets and lining.","search_coat",{minutes:5}),C("⌕","Check the kitchen counter","Look behind the kettle and the bread bin.","search_kitchen",{minutes:5}),C("⌕","Search between the sofa cushions","Check under the cushions and beside the armrest.","search_sofa",{minutes:6}),C("⌕","Check the bedside drawer","Look beneath the phone charger and loose change.","search_bedroom",{minutes:5}),C("🚌","Take the bus instead","You do not want to waste the morning searching.","bus_stop",{route:"bus",social:1,minutes:8}),C("⌂","Stay home after all","You are feeling worse, not better.","stay_home_call",{atHome:true,home:2,minutes:3})]},
keys_found:{time:"07:35",chapter:"Monday · The missing keys",title:"You find the keys.",text:[
"Your fingers close around the familiar metal. The keys are exactly where you left them, although you have no memory of putting them there. A small plastic tag taps against the ring. You hold it still and listen. The sound seems to continue for a moment after the keys stop moving.",
"You check the time. The search has taken longer than you expected. Your head is still sore, but the thought of getting to work feels manageable now. You pick up your bag, work ID and water bottle. The car is outside. You can drive in, or change your mind and take the bus.",
"As you open the front door, the air outside smells of damp leaves and cold metal. You have the odd impression that something on the street has noticed you leaving."
],choices:[C("🚗","Drive to work","Get into the car and take the main road.","driveway",{speed:1,minutes:4}),C("🚌","Leave the car and take the bus","You would rather not drive while feeling unwell.","bus_stop",{route:"bus",calm:1,minutes:8}),C("⌂","Go back inside","You have changed your mind about working today.","stay_home_call",{atHome:true,home:2,minutes:3})]},
driveway:{time:"07:48",chapter:"Monday · The driveway",title:"The car starts, but the radio is already on.",text:[
"You unlock the car and sit behind the wheel. The seat feels familiar. The steering wheel is cool. You put the key in and start the engine. The radio comes on at a low volume, although you are sure you turned it off last night. A presenter is reading the morning traffic report.",
"For a moment the radio signal breaks. Beneath the static is the same low sound you heard in the house. You turn the radio off. The sound continues, now coming from somewhere outside the car. You look towards the road. A person is standing beside the bus stop, holding a folded umbrella.",
"You check your mirrors. The road is clear. You can drive towards Northline, stop to ask the person whether they need help, or take the longer road past the park."
],choices:[C("🚗","Take the main road","Head straight towards work.","drive_road",{route:"driving",speed:1,minutes:8}),C("✋","Stop beside the person at the bus stop","They may need help.","road_encounter",{route:"driving",social:1,minutes:4}),C("↗","Take the back road past the park","Avoid the main traffic.","backroad",{route:"driving",wild:1,minutes:12})]},
drive_road:{time:"08:00",chapter:"Monday · On the road",title:"The traffic lights change before you reach them.",text:[
"The main road is busier than usual. A bus pulls away from the stop, a van changes lanes, and a cyclist waits at the crossing. The traffic lights ahead turn green before the queue has fully stopped. You ease forward. Your hearing seems to pick out each engine separately.",
"A road worker in a fluorescent jacket is standing near a temporary barrier. They raise one hand, not to stop traffic but to signal you to slow down. There is no visible roadwork. A second worker stands farther along the pavement, looking down at a drain cover.",
"You can continue towards the industrial estate, or stop and see whether the road worker needs help. The low vibration has followed you from the driveway. It seems to be coming from the road itself."
],choices:[C("✋","Stop and speak to the road worker","They may know why the road is vibrating.","road_encounter",{route:"driving",social:1,minutes:5}),C("🚗","Continue to Northline","You do not want to be late.","car_park",{route:"driving",speed:1,minutes:8}),C("↗","Turn towards the park","Take a quieter road.","backroad",{route:"driving",wild:1,minutes:10})]},
backroad:{time:"08:04",chapter:"Monday · The back road",title:"The back road is almost empty.",text:[
"You turn away from the main road. The back road runs beside a row of small houses and a patch of scrubland. There are no queues. A dog is standing behind a garden gate, watching the car pass. It does not bark. It follows you with its eyes until you disappear around the bend.",
"The radio is off, but you can still hear a low hum. It rises when you pass a storm drain and fades when you reach the open stretch beside the park. You lower the window. The air smells of wet grass and earth. Your headache eases slightly.",
"At the next junction, a person is walking along the verge with a small backpack. They stop as you approach and look directly at the windscreen. You can slow down and ask if they need a lift, or continue towards work."
],choices:[C("✋","Stop and ask whether they need a lift","You do not recognise them, but they look tired.","road_encounter",{route:"driving",care:1,social:1,minutes:5}),C("🚗","Continue to the industrial estate","You need to get to work.","car_park",{route:"driving",speed:1,minutes:7})]},
car_park:{time:"08:17",chapter:"Monday · Northline car park",title:"There are fewer cars than usual.",text:[
"You turn into the Northline car park. Several spaces are empty, including the ones normally taken by the night shift. A security vehicle is parked beside the loading bay. Its engine is running, but nobody is inside. You park and switch off the ignition.",
"The silence is immediate. You can hear the engine ticking as it cools, a bird calling from the roof and someone moving a trolley inside the building. Your hands remain on the steering wheel for a few seconds. You feel reluctant to leave the car, although you cannot say why.",
"A colleague is crossing the car park with a paper cup. They stop when they see you and glance towards the security vehicle. You can ask them what is happening, check the loading bay or go inside."
],choices:[C("✉","Ask the colleague what is happening","They may know why the car park is so empty.","coworker_encounter",{social:1,minutes:4}),C("⌕","Look at the security vehicle","The engine is running with nobody inside.","security_vehicle",{curious:1,minutes:4}),C("→","Go inside","You are already late.","arrival",{calm:1,minutes:3})]},
security_vehicle:{time:"08:22",chapter:"Monday · Northline car park",title:"The security vehicle has been left running.",text:[
"The driver's door is unlocked. A radio sits on the passenger seat. Its display shows a channel number, but no name. You hear a short burst of static, then a voice says, “Keep the east side clear.” The voice sounds close, as if someone is speaking from the other side of the glass.",
"You look through the windscreen. The back seat is empty. A paper cup sits in the holder. There is a damp mark on the driver's seat, shaped like a hand. The engine continues to idle. You step back and close the door without touching anything else.",
"The colleague with the paper cup has disappeared. The automatic doors open at the entrance. You decide whether to go inside or look towards the loading bay."
],choices:[C("→","Go inside","You need to find out what is happening.","arrival",{curious:1,minutes:3}),C("↗","Walk around to the loading bay","There may be someone outside.","loading_yard",{wild:1,minutes:5})]},
bus_stop:{time:"07:32",chapter:"Monday · The bus stop",title:"The bus is late, but the shelter is not empty.",text:[
"You walk to the bus stop. The display says the next service is due in six minutes, then changes to twelve. A man in a dark coat is reading the same notice over and over. A woman with a shopping trolley is looking towards the road. Nobody seems particularly interested in talking.",
"A low sound comes from the shelter roof. It is not the usual vibration of traffic. It has a pattern: three short pulses, a pause, then two. The man looks up at exactly the same time you do. He asks whether you heard that. You nod.",
"The bus arrives with its lights on, but the destination display is blank. You can get on, wait for the next one, or walk towards the industrial estate."
],choices:[C("🚌","Get on the bus","You can decide what to do once you are moving.","commute",{route:"bus",social:1,minutes:12}),C("✋","Ask the man what he heard","He seems to have noticed the same sound.","road_encounter",{route:"walking",curious:1,minutes:4}),C("→","Walk towards Northline","It is not far, and the bus feels wrong.","walk_to_work",{route:"walking",wild:1,minutes:18})]},
road_encounter:{time:"07:50",chapter:"Monday · A chance encounter",title:"Someone stops you on the road.",text:["A stranger catches your attention.","They seem to have noticed something unusual.","You can stop and speak, ask what they have heard, or continue towards your destination."],choices:[C("✋","Stop and help","Find out whether they need anything.","road_help",{care:1,social:1,minutes:5}),C("⌕","Ask whether they heard the humming","You want to compare what you noticed.","road_question",{curious:1,scent:1,minutes:4}),C("→","Continue on your way","You have already lost time.","arrival",{independent:1,minutes:2})]},
road_help:{time:"07:58",chapter:"Monday · A chance encounter",title:"The stranger accepts your help.",text:[
"You stop and offer help. The person gives their name, but it does not stick in your memory at first. They are carrying something awkward, or trying to fix something, or simply looking for a way to get home. You help them with the immediate problem. It takes only a few minutes.",
"They thank you and ask whether you are feeling well. You say you are tired. They look at your face and say they have seen several people with the same expression: as if they are trying to listen to something behind the world. You ask what they mean, but they cannot explain it.",
"Before leaving, they point out a shortcut towards Northline. You take it. The encounter was ordinary enough, but you find yourself remembering the person's voice long after they are gone."
],choices:[C("→","Take the shortcut towards work","You are nearly there.","arrival",{social:1,care:1,minutes:8}),C("⌕","Ask one more question","You want to know what they meant.","road_question",{curious:1,minutes:3})]},
road_question:{time:"08:00",chapter:"Monday · A chance encounter",title:"The stranger has heard it too.",text:[
"You ask whether they have heard the low sound. They do not answer immediately. Then they nod. They say it is strongest near drains, old electrical boxes and places where people wait without moving. They have heard it at a bus shelter, outside a clinic and once in their own kitchen.",
"They say it is not a voice. It is more like a rhythm that seems to change when someone notices it. They tried recording it, but the recording played back as ordinary traffic. They have stopped trying to prove it to anyone.",
"The person checks the time and continues down the road. You are left with the feeling that the sound is not following you. It is already everywhere, and you are only beginning to hear it."
],choices:[C("→","Continue towards Northline","The work entrance is just ahead.","arrival",{curious:1,minutes:7}),C("↗","Take the quieter route past the park","You want to hear the sound away from traffic.","backroad",{wild:1,minutes:12})]},
coworker_encounter:{time:"08:08",chapter:"Monday · Northline",title:"A co-worker you do not know very well stops you.",text:["Someone from another department has something to tell you.","They look tired and slightly embarrassed. You have seen them around the building, but you have never had a proper conversation. They ask whether you have noticed anything unusual today.","The briefing is about to start. You can ask what they noticed, offer help, or leave the conversation and go to your station."],choices:[C("⌕","Ask what they noticed","You want to hear the details.","coworker_detail",{curious:1,minutes:4}),C("✋","Offer to help","They look as if they could use someone listening.","coworker_help",{care:1,social:1,herd:1,minutes:5}),C("→","Head to the briefing","You can talk later.","briefing",{calm:1,minutes:2})]},
coworker_detail:{time:"08:16",chapter:"Monday · Northline",title:"The co-worker describes a small change.",text:[
"The co-worker explains what happened during the last shift. It was not dramatic. A light made a sound. A scanner displayed a number before anyone entered it. Someone smelled rain in a room with no windows. The person telling you this keeps checking whether you are laughing.",
"You are not laughing. You describe the metallic taste and the pressure behind your eyes. They nod, but do not seem relieved. They say the strangest part is that the symptoms feel different for each person. One colleague cannot stand bright light. Another keeps turning towards the ventilation ducts. Someone else has started waking before dawn.",
"A supervisor calls for everyone to enter the briefing room. The co-worker gives you a quick nod and walks away. You have learned something, but it does not make the day easier."
],choices:[C("→","Go to the briefing","You do not want to miss the instructions.","briefing",{curious:1,minutes:3}),C("↗","Walk with them to the locker room","There may be more time to talk there.","locker_room",{social:1,minutes:5})]},
coworker_help:{time:"08:18",chapter:"Monday · Northline",title:"A small kindness changes the conversation.",text:[
"You offer to help. The co-worker asks you to carry a box of gloves to the first-aid room. It is a simple task, but it gives them time to collect their thoughts. They say they have been hearing a faint clicking sound whenever they stand near the east corridor.",
"They are not sure whether it is part of the building or something they are imagining. They have reported it twice. Nobody has found a fault. They say they are considering going home, but do not want to leave their team short-handed.",
"You tell them that feeling unwell is a good enough reason to ask for help. They thank you. The supervisor calls the briefing. You put the gloves down and head towards the meeting room."
],choices:[C("→","Go to the briefing","The shift is being reorganised.","briefing",{care:1,minutes:3}),C("⌂","Suggest they report their symptoms","They should not have to hide it.","manager",{care:1,trust:1,minutes:4})]},
coworker_floor:{time:"08:42",chapter:"Monday · The work floor",title:"The colleague beside you has noticed the same thing.",text:[
"The colleague looks at the monitor, then at you. They say the screen flashed a sentence, but they could not read it. They heard the three knocks from behind the wall. They also felt a vibration through the soles of their shoes, as if something heavy had moved beneath the floor.",
"They ask whether you are going to report it. You say you are not sure. The colleague says the last person who reported a similar event was taken to the assessment room and did not return to the floor. They do not know whether that means anything.",
"A machine restarts by itself. The normal work screen appears. The colleague takes a step back and says they need a break. You can go with them, investigate the screen, or head towards the canteen."
],choices:[C("✋","Walk with the colleague to the break room","They should not have to go alone.","break_room",{care:1,social:1,minutes:6}),C("⌕","Check the monitor again","You want to see whether the message returns.","glitch",{curious:1,minutes:3}),C("☕","Go to the canteen","You need a drink and a quieter place.","canteen",{home:1,minutes:7})]},
locker_room:{time:"08:24",chapter:"Monday · The locker room",title:"The locker room smells of damp clothes and metal.",text:[
"The locker room is usually noisy at shift change. Today it is almost empty. A row of lockers stands open. Someone has left a pair of work shoes on the bench and a jacket hanging from a hook. The air smells of detergent, damp fabric and something faintly earthy.",
"You open your locker. Your work clothes are where you left them. The metal door vibrates lightly beneath your fingers. You let go, and the vibration stops. A locker farther down the row gives three soft knocks from the inside. Nobody is standing near it.",
"You can check the locker, wash your face in the nearby toilets, or head to the floor before the briefing begins."
],choices:[C("⌕","Open the locker that knocked","You want to know whether someone is inside.","locker_knock",{curious:2,minutes:4}),C("↗","Go to the washroom","You need to cool your face.","staff_toilets",{calm:1,minutes:5}),C("→","Head to the work floor","You are already behind schedule.","floor",{speed:1,minutes:3})]},
locker_knock:{time:"08:31",chapter:"Monday · The locker room",title:"The locker is empty, but the sound continues.",text:[
"The locker door opens easily. Inside is a spare uniform, a pair of gloves and a folded sheet of paper. There is no phone, no person and no obvious source of the tapping. You touch the back panel. It is cold, then suddenly warm beneath your fingertips.",
"The paper is a printed rota from last week. One name has been circled. Martin. Beside it, someone has written a time: 02:13. The ink is still wet. You look towards the door. Nobody is there.",
"The sound stops. You fold the paper and put it back. You can take it to the supervisor or leave the locker as you found it."
],choices:[C("⌕","Take the paper to the supervisor","Someone should know about it.","manager",{trust:1,curious:1,minutes:4}),C("→","Leave the locker room","You do not want to be caught here.","floor",{independent:1,minutes:3})]},
staff_toilets:{time:"08:38",chapter:"Monday · Staff toilets",title:"The mirror makes your face look unfamiliar.",text:[
"The staff toilets are empty. You turn on the tap and splash cool water onto your face. The temperature helps, but the sound of the water is too clear. You can hear it strike the basin, divide around the plug and run into the pipe. It sounds almost like a stream.",
"You look in the mirror. The pale marks are no longer limited to your neck. A faint line runs beneath your jaw and disappears when you turn your head. Your eyes look normal, but your pupils adjust before the overhead light changes. You lean closer. Your reflection seems to be waiting for you to move.",
"A hand dryer starts in the next cubicle, although you are sure nobody entered. The noise makes you flinch. You dry your hands on a paper towel and decide whether to report the symptoms or return to work."
],choices:[C("✓","Report that you are unwell","You should not pretend everything is fine.","clinic",{care:1,trust:1,minutes:5}),C("→","Return to the work floor","You want to understand what is happening first.","floor",{calm:1,minutes:3}),C("⌕","Check the cubicle","The hand dryer started by itself.","empty_cubicle",{curious:1,minutes:4})]},
empty_cubicle:{time:"08:45",chapter:"Monday · Staff toilets",title:"The cubicle is empty.",text:[
"The cubicle is empty. The hand dryer has stopped. You check the floor, the door latch and the small gap beneath the partition. Nobody is there. A faint damp mark is visible on the wall, shaped like a hand pressed flat against it.",
"You touch the mark with a paper towel. It is not water. It is cool and slightly sticky, like condensation that has been sitting too long. The towel comes away clean. The mark fades while you watch.",
"You hear footsteps in the corridor. Someone pauses outside the door, then walks away. You decide not to stay in the toilets any longer."
],choices:[C("→","Go back to the work floor","You need to get moving.","floor",{independent:1,minutes:3}),C("✓","Go to the assessment room","You want someone to check the marks.","clinic",{care:1,minutes:6})]},
canteen:{time:"09:04",chapter:"Monday · The canteen",title:"The canteen is open, but almost nobody is eating.",text:[
"The canteen smells of toast, cleaning spray and hot water. A vending machine hums beside the windows. Three people sit at separate tables. One has a tray of food in front of them but is only moving it around with a fork. Another is staring at the window, where the reflection of the room looks slightly darker than the room itself.",
"You buy a bottle of water. The machine takes the money, pauses, then returns the exact amount in coins. The display flashes a number that looks like a time: 02:13. You try again. This time the bottle drops normally.",
"A member of staff you do not recognise is wiping down a table. They ask whether you have heard the announcement about the east corridor. They say the corridor is not the only area that has been closed. The old loading lift has also been taken out of service."
],choices:[C("✉","Ask the staff member what else is closed","They may know more than the announcement.","canteen_staff",{social:1,minutes:4}),C("⌕","Look at the vending machine display","The time appeared for a reason.","vending_machine",{curious:1,minutes:3}),C("→","Return to the floor","You need to keep working.","floor",{speed:1,minutes:5}),C("✋","Sit near the person at the far table","They keep looking towards the door.","work_event_gate",{social:1,minutes:2})]},
canteen_staff:{time:"09:12",chapter:"Monday · The canteen",title:"The canteen worker has been asked to keep quiet.",text:[
"The staff member says the old loading lift stopped between floors during the night. Nobody was inside, but the doors opened onto a corridor that does not appear on the building plan. Maintenance closed it and told everyone not to discuss it.",
"They say the same thing happened at another site last week. A worker stepped out of a lift and found themselves in a room full of chairs, all facing a blank wall. The worker walked back into the lift and returned to the correct floor. The report was filed as a mechanical fault.",
"The staff member looks at the vending machine, then at you. They say they are going home after the shift. They do not want to wait for another announcement."
],choices:[C("→","Go back to the floor","You want to see whether the lift is really closed.","floor",{curious:1,minutes:5}),C("⌕","Look for the old loading lift","The story is too specific to ignore.","loading_lift",{curious:2,minutes:7})]},
vending_machine:{time:"09:10",chapter:"Monday · The canteen",title:"The vending machine is displaying a time.",text:[
"The display reads 02:13. You press the button for water. The display changes to 08:42, then back to 02:13. The machine hums, but the motor is not running. You place your hand against the side panel. The vibration is stronger near the coin return.",
"A small piece of paper is caught behind the clear plastic window. You pull it free. It is a receipt from yesterday, timestamped 02:13. The item listed is a bottle of water. The payment method is blank. At the bottom is a short line of text: LISTEN BEFORE YOU LEAVE.",
"You put the receipt in your pocket. The machine returns to its normal display. Someone enters the canteen, and the hum becomes quieter."
],choices:[C("→","Return to the floor","You have a receipt and no explanation.","floor",{clue:1,minutes:4}),C("⌕","Go to the loading lift","The receipt may be connected to the closed area.","loading_lift",{curious:1,minutes:7})]},
loading_yard:{time:"09:18",chapter:"Monday · The loading yard",title:"The loading yard is colder than the rest of the site.",text:[
"The loading yard is open to the grey sky. A truck is parked beside the dock, its trailer doors closed. The air smells of diesel, wet cardboard and damp earth. A forklift sits with its forks lowered. Nobody is operating it, but the warning light is blinking.",
"You walk along the painted line. There are fresh tyre marks in the dust, but they do not lead to the truck. They lead to a blank section of wall. You touch the wall. It is warmer than the air, and a faint vibration moves beneath the paint.",
"A worker appears at the far end of the yard. They are carrying a clipboard and walking quickly. They stop when they see you, then point towards the main building. You can ask what they are doing, inspect the wall or return inside."
],choices:[C("✉","Ask the worker what happened","They may have seen the same thing.","yard_worker",{social:1,minutes:4}),C("⌕","Inspect the warm section of wall","The vibration is coming from behind it.","yard_wall",{curious:2,minutes:5}),C("→","Return to the work floor","You do not want to be outside alone.","floor",{calm:1,minutes:4})]},
yard_worker:{time:"09:24",chapter:"Monday · The loading yard",title:"The worker says a truck arrived with no driver.",text:[
"The worker says a truck arrived at 06:11. The gate camera recorded it entering, but there is no record of it leaving. The cab was empty when security checked. The trailer doors were sealed. The delivery paperwork listed a destination that does not exist.",
"They say the truck has been moved twice since then. Each time, the tyre marks lead towards the same blank wall. Nobody can explain how it turns in the narrow yard. The worker has been asked to keep the area clear until someone from the response team arrives.",
"They look at your face and ask whether you have been getting headaches. You say yes. The worker tells you to stay away from the wall. They say it seems to react when someone stands close."
],choices:[C("→","Go back inside","You do not need to test the warning.","floor",{calm:1,minutes:4}),C("⌕","Look at the wall anyway","You want to know what is behind it.","yard_wall",{curious:2,minutes:3})]},
yard_wall:{time:"09:30",chapter:"Monday · The loading yard",title:"The wall feels warm beneath your palm.",text:[
"You place your palm against the painted concrete. The vibration moves from your wrist to your elbow. It is not a steady hum. It comes in groups, with pauses between them. You recognise the rhythm from the bus shelter and the drain cover.",
"A thin line appears in the paint, running from the floor to shoulder height. It is not a crack. It looks more like a seam. You step back. The line fades, but the vibration continues. For a moment you feel certain that something on the other side has noticed you.",
"The worker calls from the far end of the yard. They tell you to leave the wall alone. You do. The low sound follows you back towards the doors."
],choices:[C("→","Return to the work floor","You have seen enough.","floor",{clue:1,minutes:5}),C("↘","Go towards the service corridor","The sound seems to be coming from inside.","corridor",{curious:1,minutes:6})]},
loading_lift:{time:"09:22",chapter:"Monday · The loading lift",title:"The old lift is locked off.",text:[
"The old loading lift is behind a metal grille. A chain has been looped through the handle. There is a small warning sign, but the print has been rubbed away. You can hear the lift moving, even though the indicator is dark.",
"The sound stops at your floor. A faint click comes from behind the grille. The doors do not open. You look at the indicator again. It shows a floor number that the building does not have. The display changes to a blank line, then returns to zero.",
"A voice from inside the lift says your name. It sounds like a recording of your own voice, played at a lower speed. You step away. The lift begins moving again."
],choices:[C("→","Return to the canteen","You need to get away from the lift.","canteen",{calm:1,minutes:5}),C("⌕","Follow the lift's movement on the indicator","You want to know where it stops.","lift_indicator",{curious:2,minutes:4})]},
lift_indicator:{time:"09:28",chapter:"Monday · The loading lift",title:"The indicator shows a floor below the foundations.",text:[
"The indicator moves down: 0, -1, -2, then a symbol you do not recognise. The lift should not be able to go any lower. You place your hand on the wall beside the grille. The vibration travels through the concrete and into your shoulder.",
"A paper label has been taped beneath the display. It reads SERVICE ACCESS — AUTHORISED STAFF ONLY. The label is old, but the tape is new. Someone has written 02:13 beneath it in blue ink.",
"The indicator returns to zero. The lift doors remain shut. You decide whether to report what you saw or find another route to the lower level."
],choices:[C("⌕","Tell the supervisor","You want a record of what happened.","manager",{trust:1,minutes:4}),C("↘","Look for the service corridor","There may be another way below the building.","corridor",{curious:1,minutes:8})]},
break_room:{time:"09:02",chapter:"Monday · The break room",title:"The break room is quieter than it should be.",text:[
"The break room has a row of plastic chairs, a kettle and a noticeboard covered in old shift reminders. The colleague sits near the window. You make a cup of water and try to slow your breathing. The room is quiet, but the quiet feels occupied.",
"A chair at the far end is pulled slightly away from the table. There is a damp ring on the seat, as if someone has just stood up from it. Nobody else is in the room. The colleague says they saw someone sitting there a moment ago, but when they looked again the chair was empty.",
"The wall clock has stopped at 02:13. You can hear the second hand trying to move, even though it is not moving. You decide whether to return to the floor, report the incident or look at the noticeboard."
],choices:[C("⌕","Read the old shift notices","One of them may explain the time.","noticeboard",{curious:1,minutes:4}),C("→","Return to the floor","You want to stay near other people.","floor",{social:1,minutes:3}),C("✓","Report the incident","The room should be checked.","manager",{trust:1,minutes:5})]},
noticeboard:{time:"09:08",chapter:"Monday · The break room",title:"An old notice has your name on it.",text:[
"Most of the notices are ordinary: holiday requests, safety reminders, a lost lunchbox and a rota change. One sheet is older and has been pinned beneath the others. It lists staff who were present during a building evacuation several years ago.",
"Your name is not on the list. It is written on the back, in a different hand, beside a time: 02:13. The paper is yellowed, but the writing looks fresh. You turn it over again. The list is blank now.",
"You put the notice back. The colleague says they are going to report sick and leave. You can go with them to the supervisor or return to the work floor."
],choices:[C("→","Return to the floor","You want to finish the shift if you can.","floor",{calm:1,minutes:4}),C("✓","Go to the supervisor","You have enough strange evidence to report.","manager",{trust:1,curious:1,minutes:5})]},

walk_to_work:{time:"07:39",chapter:"Monday · Walking to work",title:"The pavement is busy enough to feel ordinary.",text:[
"You take the pavement towards Northline. A bus pulls away from the stop. Someone jogs past with their hood up. A delivery van reverses into a side road, and a woman outside the bakery is trying to balance a coffee and a paper bag. Nothing looks unusual. You are still a little feverish, and the cold air catches in your throat.",
"Halfway down the street, you notice a person standing near a closed shop. They are watching people pass, but not in the usual way. Their shoulders are raised. Their mouth keeps opening as if they are trying to say something, then closing again. You look away and keep walking.",
"A few steps later, the person moves into your path. You hear a strange sound from their throat. It is close enough now that you can see their eyes watering. You have a moment to decide whether to stop or keep moving."
],choices:[C("→","Keep walking along the main pavement","You are already late. Do not get involved.","street_event_gate",{independent:1,minutes:1}),C("✋","Slow down and see if they need help","Something about them looks genuinely wrong.","street_event_gate",{care:1,minutes:2}),C("↗","Cross the road and take the quieter route","You would rather keep some distance.","arrival",{calm:1,minutes:6})]},

street_bark:{time:"07:43",chapter:"Monday · A chance encounter",title:"The stranger suddenly barks at you.",text:[
"The person steps towards you and makes a sharp, startling barking sound. It is unmistakably a human voice, but it comes out like a dog's bark — sudden, rough and much louder than you expect. Two pedestrians turn around. One laughs nervously, then realises nobody else is laughing.",
"The stranger looks horrified by what they have just done. They clamp a hand over their mouth and take a step back. Their breathing is fast. You catch a glimpse of pale marks running from beneath their jaw towards the collar of their coat. They try to apologise, but their throat makes another short clicking sound.",
"You are close enough to feel the warmth of their breath. A faint metallic taste returns to your mouth, and the pressure behind your ears increases. It is a small change, but you notice it. The stranger looks at you as if they are waiting to see whether you will run."
],note:"You cannot tell whether the sound was involuntary, or whether the stranger recognised something in you.",choices:[C("✋","Ask if they are all right","They look frightened of their own voice.","street_bark_ask",{care:1,social:1,infection:1,minutes:3}),C("↗","Step back and keep your distance","You do not know what is happening to them.","street_bark_leave",{calm:1,minutes:2}),C("✋","Touch their shoulder","You want to stop them panicking.","street_bark_touch",{care:1,infection:2,minutes:3}),C("→","Say nothing and walk away","You do not want to get involved.","street_bark_leave",{independent:1,minutes:1})]},
street_bark_ask:{time:"07:47",chapter:"Monday · A chance encounter",title:"They try to explain what happened.",text:[
"The stranger lowers their hand. “Sorry. I didn't mean to do that.” Their voice is hoarse. They say it happened yesterday as well, once when a car horn startled them and once when someone dropped a metal tray. They have been trying not to speak much because they cannot predict what will come out.",
"They ask whether you heard the sound in the street last night. You say you have heard something, but you do not know what it is. The stranger nods. Their jaw moves once, almost like they are testing whether it still belongs to them. You notice your own throat tighten in response.",
"A pedestrian asks whether they should call someone. The stranger shakes their head and says they are going home. Before leaving, they tell you not to let anyone make you feel ashamed if your body starts doing things you cannot control."
],choices:[C("→","Let them go and continue to work","You have already lost a few minutes.","arrival",{care:1,minutes:5}),C("⌕","Ask where they got the pale marks","You recognise the pattern from your own skin.","street_bark_marks",{curious:1,minutes:3})]},
street_bark_touch:{time:"07:47",chapter:"Monday · A chance encounter",title:"Your hand meets their shoulder.",text:[
"You reach out and touch their shoulder. Their coat is damp, but beneath the fabric their skin feels unusually warm. The stranger flinches and another short bark escapes them. You pull your hand back. For an instant, the sound seems to continue inside your wrist, a small vibration that travels up your arm.",
"They apologise again and move away quickly. You rub your fingertips together. There is no mark, no visible residue, nothing you can point to. But your throat feels scratchier than it did a moment ago, and a thin ringing has appeared in your left ear.",
"The pedestrians have gone back to their own mornings. Nobody asks whether you are all right. You are left standing beside the shop window, trying to decide whether the contact made a difference."
],choices:[C("→","Continue towards Northline","You need to get inside.","arrival",{minutes:6}),C("⌕","Check your hand and neck","You want to see whether anything has changed.","street_bark_marks",{curious:1,minutes:3})]},
street_bark_leave:{time:"07:46",chapter:"Monday · A chance encounter",title:"You leave the stranger behind.",text:[
"You step away. The stranger does not follow. Behind you, they make one more barking sound, quieter this time, then cover their mouth again. A woman crossing the road asks if they need help. They nod without looking up.",
"You keep walking. The metallic taste remains, but it is faint. You swallow and feel a small catch at the back of your throat. It could be the illness you woke with. It could be the cold air. You cannot tell.",
"At the next crossing, the pedestrian light changes. You realise you have been holding your breath. You let it out and continue towards work."
],choices:[C("→","Continue to Northline","The entrance is just ahead.","arrival",{minutes:5})]},
street_bark_marks:{time:"07:51",chapter:"Monday · A chance encounter",title:"The marks are familiar, but not identical.",text:[
"The stranger says the marks appeared after the first night they heard the low sound. At first they looked like faint scratches. Then they began to fade whenever someone photographed them. They show you the side of their neck. The lines are arranged in a shallow curve, similar to yours but longer.",
"You touch your own neck. The skin there feels warm. The stranger notices and looks away, as if they have said too much. They tell you that the clinic gave them a leaflet but no explanation. They were told to rest and report any sudden changes.",
"A bus pulls in at the stop behind you. The stranger steps towards it, then pauses and looks back. “If you hear yourself make a sound you didn't choose,” they say, “don't panic. Just get somewhere you feel safe.”"
],choices:[C("→","Let them board and continue to work","You need to get to Northline.","arrival",{curious:1,minutes:5}),C("✋","Ask if they want you to call someone","They should not have to deal with this alone.","street_bark_ask",{care:1,minutes:2})]},

street_cough:{time:"07:43",chapter:"Monday · A chance encounter",title:"A stranger coughs in a strange rhythm.",text:[
"A person coming towards you stops beside a lamppost and coughs three times. The first two sound ordinary. The third ends in a low, almost animal rumble. They press a fist against their mouth and look embarrassed. Their eyes flick towards you, then away.",
"They say it is just a cough, but their voice is strained. Their fingers keep tapping against their chest in the same three-beat pattern. You feel a matching pressure behind your sternum. The person takes a step aside to let you pass.",
"For a moment you can choose to stop, ask if they need help, or walk past without making the encounter any bigger."
],choices:[C("✋","Ask whether they need help","They look unwell.","street_cough_ask",{care:1,social:1,infection:1,minutes:3}),C("→","Walk past without stopping","You do not want to get too close.","arrival",{independent:1,minutes:2}),C("⌕","Watch their hands","The tapping pattern feels familiar.","street_cough_watch",{curious:1,infection:1,minutes:2})]},
street_cough_ask:{time:"07:47",chapter:"Monday · A chance encounter",title:"They tell you it happens when they are startled.",text:[
"The stranger says the cough began yesterday. It happens when a loud sound catches them off guard. They have tried drinking water and resting, but the third sound always comes back. They ask if you have heard anyone else making noises like that.",
"You tell them about the person near the shop. Their expression changes. They say they saw someone do something similar outside the clinic. Nobody knew whether to laugh or call for help.",
"They thank you for stopping. As you turn away, you notice your own breathing has fallen into the same three-beat rhythm. You deliberately take a slow breath and the pattern breaks."
],choices:[C("→","Continue to work","The entrance is close now.","arrival",{minutes:5}),C("⌕","Ask where the clinic is","You want to know where they were seen.","arrival",{curious:1,minutes:3})]},
street_cough_watch:{time:"07:46",chapter:"Monday · A chance encounter",title:"The tapping stops when you look directly at it.",text:[
"You watch their hand. The fingers tap three times, pause, then tap twice. When you focus on the movement, the tapping stops. The stranger notices you watching and pulls their hand into their pocket.",
"They look at you for a moment. “You can hear it too,” they say. It is not a question. Before you can answer, they cross the road and disappear into the morning crowd.",
"Your own fingers twitch against your bag strap. Three taps. A pause. Two taps. You stop them and keep walking."
],choices:[C("→","Go to Northline","You are nearly there.","arrival",{curious:1,minutes:5})]},

street_event_gate:{time:"07:42",chapter:"Monday · A chance encounter",title:"A moment on the pavement.",text:["Someone steps into your path. The encounter is brief, but you will remember it."],choices:[C("→","Continue","See what happens.","street_bark",{minutes:1})]},

elevator_event_gate:{time:"08:08",chapter:"Monday · The lift",title:"The elevator arrives.",text:["The doors slide open. You step inside. Someone else is already waiting in the corner, or gets in just before the doors close."],choices:[C("→","Ride to the briefing room","The lift begins to move.","elevator_ears",{minutes:1})]},
elevator_ears:{time:"08:10",chapter:"Monday · The lift",title:"Someone gets in holding both ears.",text:[
"The lift stops one floor below yours. A co-worker you recognise only by sight steps in. They keep their head down and both hands pressed over their ears, fingers spread into their hair as if they are trying to hide what they are doing. When they notice you looking, they lower one hand and pretend to adjust an earbud. There is no earbud.",
"Their eyes are watery. Their jaw is clenched. The lift starts moving again, and they press both palms against their ears once more. A tiny sound escapes them — not quite a groan, more like a high note cut short. They look embarrassed and turn towards the doors.",
"You are standing close together in the enclosed lift. You can see the skin around their ears is pale and slightly swollen. They are trying very hard to act normal. The floor indicator moves slowly upwards. You have a few seconds to decide what to do."
],note:"You notice the same pressure behind your own ears. The lift is quiet enough to hear the other person's breathing.",choices:[C("✋","Ask if they are okay","You can see they are struggling.","elevator_ears_ask",{social:1,care:1,infection:1,minutes:2}),C("—","Stay quiet and look away","They clearly do not want attention.","elevator_ears_quiet",{calm:1,minutes:1}),C("✋","Touch their arm gently","You want to get their attention without startling them.","elevator_ears_touch",{care:1,infection:2,minutes:2}),C("↗","Step out at the next floor","You would rather give them space.","elevator_ears_exit",{independent:1,minutes:1})]},
elevator_ears_ask:{time:"08:13",chapter:"Monday · The lift",title:"They ask you not to make a scene.",text:[
"You ask if they are all right. They glance at the small camera in the corner, then lower their voice. “It's the sound. It gets louder in here.” They point towards their ears without touching them. “I can hear the cables. The motor. The lights. I can hear all of it at once.”",
"They say they have been holding their ears because it helps them pretend the sound is coming from outside. They have not told their supervisor. They are afraid of being sent home or taken to the assessment room. Their breathing settles a little while they speak, but their hands keep trembling.",
"The lift slows. They ask you not to mention the conversation. The doors open onto the briefing floor. They step out quickly, then pause as if they are waiting to see whether you will follow."
],choices:[C("→","Let them go and follow to the briefing","You will give them space for now.","briefing",{calm:1,minutes:2}),C("✋","Offer to walk with them","They should not have to face the floor alone.","briefing",{care:1,social:1,minutes:3}),C("⌕","Ask what happened to their ears","You want to understand the swelling.","elevator_ears_detail",{curious:1,minutes:2})]},
elevator_ears_detail:{time:"08:15",chapter:"Monday · The lift",title:"The skin around their ears is changing.",text:[
"They hesitate, then turn their head enough for you to see. The skin behind each ear is covered in fine pale lines. The lines move slightly when they swallow, as though something beneath the skin is shifting position. They say it began as an itch, then became pressure, then a sound they could not escape.",
"They ask whether your ears have been ringing. You do not answer straight away. Your left ear gives a thin, brief tone. The co-worker notices your expression and looks frightened. “It's started for you too,” they whisper.",
"The lift doors remain open. People are waiting outside. The moment is over, but the question follows you into the corridor."
],choices:[C("→","Leave the lift and go to the briefing","You need to think about this somewhere else.","briefing",{curious:1,minutes:2}),C("✋","Tell them they should report it","They deserve help, even if the response team is frightening.","briefing",{care:1,minutes:2})]},
elevator_ears_touch:{time:"08:13",chapter:"Monday · The lift",title:"Your hand touches their sleeve.",text:[
"You touch their upper arm. The co-worker jerks away, then catches your wrist to steady themselves. Their fingers are hot. For a second, the sound in the lift seems to move from their ears into your hand. A thin ringing spreads beneath your skin, then fades into a dull pulse.",
"They let go immediately and apologise. “Sorry. I didn't mean to grab you.” Their eyes search your face. They have noticed something change in your expression. You feel a small wave of warmth travel from your wrist towards your elbow.",
"The lift doors open. The co-worker steps out without another word. You remain inside for one extra second, staring at the place where they touched you."
],choices:[C("→","Follow them to the briefing","You do not want to be late.","briefing",{minutes:2}),C("⌕","Look at your wrist","You want to check whether anything is visible.","elevator_wrist",{curious:1,minutes:2})]},
elevator_wrist:{time:"08:15",chapter:"Monday · The lift",title:"There is no mark, but the feeling remains.",text:[
"Your wrist looks normal. No rash, no scratch, no swelling. Yet the skin feels warm in a narrow line where their fingers closed around it. When you flex your hand, the sensation moves with the tendons.",
"You hear the lift motor start again. The sound is much louder than it was a minute ago. You press the button for the briefing floor, although the doors are already open. The lift gives a soft chime, as if it has understood the mistake."
],choices:[C("→","Leave the lift","The briefing room is nearby.","briefing",{minutes:2})]},
elevator_ears_quiet:{time:"08:12",chapter:"Monday · The lift",title:"You pretend not to notice.",text:[
"You look at the floor indicator. The co-worker keeps both hands over their ears. Their shoulders rise and fall with shallow breaths. You hear a faint clicking sound each time the lift passes a floor, and the co-worker winces at every one.",
"They catch you looking once. Their eyes ask you not to say anything. You give the smallest nod and turn away. When the doors open, they leave quickly, one hand still pressed against the side of their head.",
"You step out after them. The ringing in your ears is faint, but it has not gone away. You cannot tell whether it began in the lift or whether you only noticed it there."
],choices:[C("→","Go to the briefing room","Keep the encounter to yourself for now.","briefing",{minutes:2})]},
elevator_ears_exit:{time:"08:11",chapter:"Monday · The lift",title:"You step out before the doors close.",text:[
"You press the button for the next floor and step out. The co-worker remains in the lift, hands pressed over their ears. They look relieved that you have given them space. The doors close slowly. Through the narrow gap, you see them lower their hands and stare at their reflection in the metal wall.",
"You take the stairs for the last floor. The sound is quieter outside the lift. You still feel unwell, but you are no longer standing close to someone whose symptoms you do not understand."
],choices:[C("→","Take the stairs to the briefing","You arrive a little later than planned.","briefing",{calm:1,minutes:4})]},
elevator_fingers:{time:"08:10",chapter:"Monday · The lift",title:"A co-worker hides their hands in their sleeves.",text:[
"A person from another department gets into the lift. They keep their hands hidden inside their sleeves, even though the building is warm. When the lift jolts, one hand slips free. The fingers are trembling in a quick, repeating pattern. The person immediately hides them again.",
"They notice you saw. Their face changes, but they say nothing. The lift continues upwards. You can ask about their hands, stay quiet, or move away from them."
],choices:[C("⌕","Ask what is wrong with their hands","You saw the movement clearly.","elevator_fingers_ask",{curious:1,infection:1,minutes:2}),C("—","Stay quiet","You do not want to embarrass them.","briefing",{calm:1,minutes:2}),C("↗","Move towards the doors","Give them room.","briefing",{independent:1,minutes:2})]},
elevator_fingers_ask:{time:"08:13",chapter:"Monday · The lift",title:"They say their fingers keep moving by themselves.",text:[
"They tell you the fingers have been twitching since yesterday. It is not painful, but sometimes the movement becomes so regular that it feels deliberate. They have started wearing long sleeves to hide it. They ask whether you have noticed anything similar in yourself.",
"You glance down at your own hand. Your thumb moves once against your palm. You stop it. The co-worker sees and gives a tired nod, as if you have answered without speaking."
],choices:[C("→","Leave the lift together","The briefing room is just ahead.","briefing",{social:1,minutes:2}),C("✋","Offer to get them some help","They should not have to hide it.","briefing",{care:1,minutes:2})]},
elevator_empty:{time:"08:10",chapter:"Monday · The lift",title:"The lift is empty, but someone is holding the doors.",text:[
"You step inside alone. Just before the doors close, a hand appears between them. Someone gets in, but you only see their reflection in the metal wall. They stand behind you, close enough that you can hear their breathing.",
"The lift begins moving. In the reflection, the person is holding both ears. When you turn around, nobody is there. The reflection keeps looking at you for another second before it turns away."
],choices:[C("↗","Press the door-open button","You want to get out.","briefing",{calm:1,minutes:2}),C("—","Stay still until the lift arrives","Do not react to the reflection.","briefing",{curious:1,infection:1,minutes:2})]}


};

// Additional random encounter variations. Each event has its own follow-up
// scenes so the same choice does not always produce the same result.
const extraStreetEvents = [
{id:"street_sniff",title:"A stranger stops and smells the air",text:["A person walking towards you slows down and turns their head. They sniff once, then again, as if trying to identify a smell. Their eyes settle on you. They look embarrassed and apologise, but then they take another careful breath.","They say they have been smelling things that are not there: wet soil in shops, warm fur on buses, rain inside closed rooms. Today they say the smell is strongest around you. They do not sound accusing. They sound confused.","A cyclist passes between you. The stranger flinches at the movement and presses a hand to their nose. You notice a faint tremor running through their jaw."],note:"The stranger seems to recognise a change in you before you have named it.",ask:["You ask what they mean by saying you smell different. They hesitate, then say it is not unpleasant. It is simply not the smell they remember from yesterday. They ask whether your own sense of smell has changed.","You admit that ordinary smells have become unusually sharp. The stranger nods as if that confirms something. They recommend getting somewhere quiet if the sensations become overwhelming."],detail:["They describe a smell like damp leaves and warm stone. They say it appears whenever someone nearby has started changing. They cannot explain how they know that, only that they have noticed it several times.","As they walk away, you catch the same smell on your own sleeve. It fades when you turn towards the wind."],quiet:["You say nothing. The stranger takes one more cautious breath, then moves to the other side of the pavement. They keep glancing back, not at your face but at the space around you.","Once they are gone, you notice the smell of wet earth lingering in your nose even though the pavement is dry."],touch:["You touch their sleeve to get their attention. The fabric is cool, but their wrist beneath it is warm. They startle and inhale sharply. A smell like wet leaves fills your nose, followed by a sudden metallic taste.","They pull away, apologising. Your fingertips tingle for several seconds. Nothing visible has changed, but you keep smelling the stranger's coat after they have left."],check:["You rub your fingertips together. They look normal. The smell remains, faint and earthy, and seems to move when you turn your head."] ,exposure:1},
{id:"street_jogger",title:"A jogger stops in the middle of the pavement",text:["A jogger comes towards you at an easy pace, then suddenly stops. One foot remains lifted for a moment before they place it down carefully. Their breathing is fast, but their face is not flushed from exercise. They are listening to something beyond the road.","They apologise for blocking the pavement. As they step aside, their shoulders twitch in a short, repeated movement. A low huff escapes them. They look startled by their own voice and press a hand against their chest.","The jogger asks whether you heard that. Before you can answer, they start moving again, much faster than before, then stop at the next lamppost as if they have forgotten where they were going."],note:"Their movement is almost normal until you watch their feet.",ask:["You ask if they are injured. They say no, but their legs keep wanting to move before they decide to. They have been running every morning for years, but today they cannot tell whether they are tired or full of energy.","They ask you not to call anyone. They only want to get home and sit down. Their eyes keep tracking movement at the edge of the street."],detail:["They say the first odd thing was hearing their own footsteps from behind them. Then their stride began changing without permission. They are frightened that they might run into traffic if it happens again.","You watch them walk away slowly, concentrating on every step."],quiet:["You move to one side. The jogger takes two quick steps, then slows and looks down at their shoes. They seem relieved that you did not make a fuss.","A few seconds later, you hear their footsteps accelerate down the next street, much faster than an ordinary jog."],touch:["You reach out to steady the jogger as they stumble. Their arm tenses like a pulled cable. They make a sharp breathy sound and spring backwards, covering their mouth.","A brief pulse runs through your palm. Your own legs feel unusually ready to move, as if you have just heard a starting whistle."],check:["You stand still and test your balance. Your legs feel normal, but the urge to take a quick step remains for a few seconds."] ,exposure:1},
{id:"street_dog",title:"A dog refuses to pass you",text:["A woman is walking a medium-sized dog along the pavement. The dog stops several metres away and plants all four paws. Its ears are raised. The woman gives the lead a gentle tug, then apologises when the dog refuses to move.","The dog is not growling. It is watching you with an intense, almost puzzled expression. It takes one step forward, sniffs the air and then backs away. The woman says it has been doing this to people who look unwell.","She asks whether you have been near the old clinic. You say you are only going to work. The dog gives a low whine and looks at your hands."],note:"The dog reacts to you before its owner notices anything unusual.",ask:["You ask why the dog is behaving like that. The woman says it has become unusually selective about people and places. It will not enter certain shops, and it keeps stopping beside drains.","She says the vet found nothing physically wrong. The dog is eating and sleeping normally. It just seems to notice something other people cannot."],detail:["The woman says the dog reacted the same way to her brother two days before he developed a fever. She does not know whether it means anything. She is worried, but does not want to frighten people.","The dog finally moves on, but keeps looking back over its shoulder."],quiet:["You give the dog space. It watches until you pass, then turns and walks in the opposite direction. The woman gives you an apologetic smile.","You feel a strange pull in your chest as the dog leaves, like the beginning of a sound you almost recognise."],touch:["You crouch and offer the back of your hand. The dog sniffs once, then recoils with a sharp bark. Its nose brushes your knuckles before the woman pulls it gently away.","Your fingertips feel cold, then warm. For a moment you can smell the dog's wet coat and the grass on its paws with impossible clarity."],check:["You look at your hand. There is no scratch or mark. You can still smell the dog, even after it has turned the corner."] ,exposure:0},
{id:"street_child",title:"A child points at your face",text:["A parent and a young child are walking towards the shops. The child looks at you, then points at your eyes. The parent gently lowers the child's hand and apologises. The child does not look frightened. They look curious.","“Your eyes did that thing,” the child says. The parent tells them not to stare. You ask what thing. The child makes a small movement with their own eyes, looking to the side without turning their head.","The parent hurries the child along. Before they leave, the child looks back and says, “I think you can hear the birds now.” You had not noticed any birds until that moment."],note:"A child notices something you cannot see in your own reflection.",ask:["You ask the parent what the child meant. The parent looks uncomfortable and says the child has been saying unusual things since yesterday. They keep describing sounds before they happen.","The parent says they are taking the child home. They do not want to discuss it in the street."],detail:["The child says they can hear wings moving behind the clouds. There are no birds overhead. The parent gently interrupts and leads them away.","You look up. A bird crosses the sky a moment later, exactly where the child pointed."],quiet:["You let them pass. The parent keeps the child close, but the child turns once more to look at you. They smile as if they have recognised a secret.","For a few seconds, the traffic seems quieter and the birds sound much closer."],touch:["You crouch to speak at the child's height, and the parent steps between you. Their sleeve brushes your wrist as they guide the child away.","The brief contact leaves a cool tingling across your skin. You hear a bird call from a rooftop behind you, though you cannot see it."],check:["You check your eyes in a dark shop window. They look normal. The reflection seems to catch the movement of a bird before you hear it."] ,exposure:0},
