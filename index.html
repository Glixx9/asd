const coworkerPool=[
{name:"Mara from packaging",title:"A co-worker you barely know stops you.",text:["Mara from packaging is standing by the lockers, turning a paper cup between her hands. You have nodded to her plenty of times but never had a proper conversation. She asks whether you slept badly. Her own eyes are red, and she keeps rubbing the side of her neck.","She says the lights in the corridor made her feel dizzy during the night shift. She reported it, but the supervisor told her to take a break. When she came back, the lights were off and the corridor was still humming. She does not know what that means.","Mara glances towards the clock-in terminal. She says she is thinking of going home, but does not want to leave the team short. She asks what you would do."]},
{name:"Dev from maintenance",title:"A maintenance worker catches your eye.",text:["Dev from maintenance is kneeling beside a tool case, sorting through a handful of small parts. You have seen him around the building, usually carrying a radio. Today he looks unusually distracted. He asks whether you have noticed a vibration in the floor.","He says the vibration is not coming from the machines. He switched off the nearest equipment and the sound continued. He followed it to a sealed service panel, where it stopped the moment he touched the handle. He has not told the manager because he expects to be laughed at.","Dev wipes his hands on a cloth and asks whether you have heard anything strange outside the building as well."]},
{name:"Patrick from dispatch",title:"Someone from dispatch is waiting by the clock-in screen.",text:["Patrick from dispatch is trying to sign in, but the terminal keeps rejecting his badge. He jokes that the computer has decided he no longer works here. Then he lowers his voice and says the system showed him clocking in at 02:13, even though he was at home.","He checked the security log. The entry is real, but the camera shows an empty corridor. Patrick says he would normally ignore a computer glitch, except that the same thing happened to two other people on the night shift.","He asks if you have had trouble with your badge. When you look down, the reader flashes green before you touch it."]},
{name:"Aoife from quality",title:"A co-worker from quality asks if you are all right.",text:["Aoife from quality is standing beside the noticeboard with a clipboard tucked under one arm. She asks whether you are feeling unwell. She is not being nosy; she has been asked to check that people know how to report symptoms.","She says three people have described the same sequence: headache, strange taste, unusually sharp hearing, then pale marks that disappear when photographed. She has written the reports down because the official form has no box for half of what people are describing.","Aoife asks whether you want her to record anything. She promises not to put your name on the list unless you agree."]},
{name:"Chris from the night shift",title:"A tired night-shift worker recognises you.",text:["Chris from the night shift is leaning against the wall near the vending machines. You have passed each other at shift change for months. Today Chris looks exhausted. They say they have not slept since leaving work, because every time they close their eyes they hear the conveyor belts moving.","The strange part, Chris says, is that the machines were switched off. They checked. The sound continued in the empty building. They went outside and could still hear it beneath the traffic. They ask if you can hear it now.","For a moment the vending machine hum seems to deepen. Chris watches your face, then gives a small nod. You heard it too."]},
{name:"Liam from stores",title:"A stores assistant offers you a spare coffee.",text:["Liam from stores is carrying a tray of paper cups. He offers you one, then notices you look pale and says perhaps coffee is a bad idea. He has been counting stock since six and says the numbers keep appearing in the wrong order.","He thought the scanner was broken, but the same thing happened when he wrote the figures by hand. He says he can remember the totals perfectly, but the sequence feels unfamiliar, as though he is reading a list from the wrong end.","Liam laughs at himself, then stops. He asks whether you have noticed any small changes in how you think or remember things."]}
];

roadPool.push(
{name:"a courier with a torn backpack",title:"A courier is searching the pavement for something.",text:["A courier is crouched beside a wall, collecting small items from the pavement. A zip has split on their backpack and several parcels have fallen out. They ask if you can hold one while they fix the strap.","They say their sense of direction has been unreliable all morning. Their delivery app keeps showing the same street, even when they are several kilometres away. They have started using landmarks instead of the map.","When you hand the parcel back, they ask whether you can hear a low buzzing sound from the road. They say it follows them whenever they turn towards the old clinic."]},
{name:"a woman waiting outside a pharmacy",title:"Someone outside the pharmacy asks you a question.",text:["A woman is standing outside the pharmacy with a folded leaflet in her hand. She asks whether you have been feeling unwell. When you hesitate, she says she is not trying to pry; she has seen several people with the same tired expression.","She says her brother's hearing became painfully sharp before he developed a fever. He can hear the fridge motor from upstairs and cannot sleep. The leaflet gives ordinary advice but does not explain the strange sensory changes.","She asks whether you know if the pharmacy is still open. She seems more worried about her brother than herself."]},
{name:"a groundskeeper with muddy boots",title:"A groundskeeper stops beside the path.",text:["A groundskeeper is sweeping leaves away from a drain. They stop when you approach and ask whether you have noticed the pavement vibrating. They say it happens in short pulses, usually just before birds take off from the nearby trees.","They have worked in the area for years and know every path and tree. Today the birds are gathering in places where they never used to settle. The groundskeeper says the animals seem to be listening to something beneath the ground.","They look at your shoes and say you have brought the smell of wet earth with you, even though the path is dry."]},
{name:"a taxi driver taking a break",title:"A taxi driver has pulled in beside the kerb.",text:["A taxi driver is standing beside the open driver's door, stretching their back. They ask if you are heading towards the industrial estate. They have been driving in circles because the navigation keeps sending them past the same junction.","They say passengers have been asking to get out at places that are not on the route. One person insisted they had reached the river, although the car was still in the town centre. The driver has stopped taking fares near the old clinic.","They ask whether you have had any trouble with your own sense of direction today."]},
{name:"a student with a broken earbud",title:"A student asks if you have a spare earbud.",text:["A student is standing beside a bus shelter, holding one broken earbud. They say the left one started making a low humming sound and then became painfully loud. They took it out, but the sound seemed to continue inside their ear.","They have tried using a different pair, but the same tone appears whenever they are near a large building. They are late for class and annoyed that nobody believes them.","They ask whether you can hear a faint ringing from the shelter roof. You can, although you are not sure it is coming from the roof."]},
{name:"a post worker with a heavy trolley",title:"A post worker pauses to catch their breath.",text:["A post worker is stopped beside a trolley full of letters. They ask if you can help lift one wheel over a broken paving stone. When you do, they thank you and say the trolley feels heavier than it did yesterday.","They have been getting unusual aches in their shoulders and hands. They say their grip seems stronger at some moments and strangely weak at others. They have started changing how they hold the trolley.","They look at your hands and ask whether you have noticed anything similar."]}
);
coworkerPool.push(
{name:"Niall from goods-in",title:"A goods-in worker catches you near the entrance.",text:["Niall from goods-in is checking a delivery label against a clipboard. He says the numbers keep appearing in the wrong order, even though he knows what they should be. He has rewritten the same line four times.","He says his eyes are fine. It is more like the numbers move into a pattern before he reads them. He has started counting boxes by touch instead of sight.","He asks whether you have been having trouble concentrating this morning."]},
{name:"Sinead from the canteen",title:"The canteen worker asks whether you are feeling cold.",text:["Sinead from the canteen is carrying a tray of mugs. She notices you rubbing your arms and asks whether you are cold. The room is warm, but she says she has been feeling sudden patches of cold herself.","She says the kettle sometimes clicks off before the water boils. She can tell when it is about to happen because she feels a small pressure in her fingertips. She knows that sounds ridiculous, but it has happened every time today.","She offers you a glass of water and asks whether you want her to call someone."]},
{name:"Eoin from engineering",title:"An engineer is listening to a machine that is switched off.",text:["Eoin from engineering is standing beside a silent machine with his head tilted. He says he can still hear it running. The control panel is dark and the power has been isolated, but the low rhythm continues.","He has checked the bearings, the motor and the floor mounts. Nothing is moving. He says the sound seems to be coming from inside his own head, but it gets louder when he stands near the machine.","He asks whether you can hear it too. You notice the familiar pressure behind your teeth."]},
{name:"Molly from administration",title:"An administrator asks you to check a message.",text:["Molly from administration is holding her phone out. A voice message has arrived from a colleague who called in sick. It contains only a few seconds of breathing and a repeated tapping sound.","Molly says the message was sent at 02:13, but the colleague insists they sent it after waking at six. The timestamp keeps changing when she refreshes it.","She asks whether you think she should forward it to the manager or delete it."]},
{name:"Ravi from cleaning",title:"A cleaner is wiping the same patch of floor repeatedly.",text:["Ravi from cleaning is working near the corridor. He has wiped the same patch of floor several times, but keeps saying it still feels sticky. The floor looks completely dry.","He says the mop head keeps turning towards the east corridor, even when he is holding it straight. He has changed the mop twice. The movement keeps happening.","He asks whether you can stand on the patch and tell him if the floor feels different beneath your shoes."]},
{name:"Grace from training",title:"A trainer asks if you have noticed anyone moving differently.",text:["Grace from training is carrying a folder of induction forms. She asks whether you have noticed staff walking differently today. She says several people are taking wider steps and turning their whole bodies instead of just their heads.","She has been trying to explain it as fatigue, but the pattern is too consistent. Some people seem to be adjusting their balance without thinking about it.","She asks whether you have felt your own balance changing."]}
);

function prepareRandomEncounter(type){const pool=type==="road"?roadPool:coworkerPool;const pick=pool[Math.floor(Math.random()*pool.length)];if(type==="road"){s.flags.roadPerson=pick.name;S.road_encounter.title=pick.title;S.road_encounter.text=pick.text;S.road_encounter.note="A chance encounter. You did not plan to stop, but the conversation may matter.";const next=s.flags.route==="driving"?"car_park":(s.flags.route==="bus"?"commute":"arrival");S.road_encounter.choices=[C("✋","Stop and help","Find out whether they need anything.","road_help",{care:1,social:1,minutes:5}),C("⌕","Ask whether they heard the humming","You want to compare what you noticed.","road_question",{curious:1,scent:1,minutes:4}),C("→","Continue on your way","You have already lost time.",next,{independent:1,minutes:2})];}else{s.flags.coworker=pick.name;S.coworker_encounter.title=pick.title;S.coworker_encounter.text=pick.text;S.coworker_encounter.note="This person is different on each playthrough. You have only a few minutes before the briefing.";}}
function go(id,e={}){
 let target=id;
 if(target==="street_event_gate"){target=chooseUnseenEncounter(randomEncounterPools.street);const exposure=randomEncounterExposure[target]||0;if(exposure)e={...e,infection:(e.infection||0)+exposure};}
 if(target==="elevator_event_gate"){target=chooseUnseenEncounter(randomEncounterPools.elevator);const exposure=randomEncounterExposure[target]||0;if(exposure)e={...e,infection:(e.infection||0)+exposure};}
 if(target==="work_event_gate"){target=chooseUnseenEncounter(randomEncounterPools.work);const exposure=randomEncounterExposure[target]||0;if(exposure)e={...e,infection:(e.infection||0)+exposure};}
 if(id.startsWith("search_")){
  const place=id.slice(7);if(!s.flags.keysSearched.includes(place))s.flags.keysSearched.push(place);
  if(place===s.flags.keyLocation){s.flags.keysFound=true;if(!s.items.includes("car keys"))s.items.push("car keys");target="keys_found";e={...e,minutes:8,curious:1};}
  else{target="key_search";s.flags.lastKeySearch=place;const labels={coat:"yesterday’s jacket",kitchen:"the kitchen counter",sofa:"between the sofa cushions",bedroom:"the bedside drawer"};S.key_search.text=[`You check ${labels[place]||"that spot"} carefully. No keys. You find a receipt, a loose coin and a small amount of dust, but not the key ring. The search takes longer than expected.`,`You are sure the keys are somewhere in the house. You try to remember coming in last night, but the memory is still blurry. The other likely places remain.`,`You can keep searching, take the bus or give up and stay home. Your headache has not improved, and the clock keeps moving.`];e={...e,minutes:7,curious:1};}
 }
 if(e.route)s.flags.route=e.route;
 if(["arrival","commute","driveway","station","front_path","corner_shop","pharmacy","canal_path","park","weather_station_road","service_gate","road_encounter","walk_to_work"].includes(target))s.flags.atHome=false;
 if(target==="road_encounter")prepareRandomEncounter("road");
 if(target==="coworker_encounter")prepareRandomEncounter("coworker");
 const n=S[target];if(!n)return;
 const dayTwo=["morning","wait","station","control","outside","core","final"];
 if(dayTwo.includes(target)&&s.day===1){s.day=2;if(n.time)s.time=n.time;}
 else if(n.time)sceneClock(n.time);
 s.scene=target;effects(e);
 if(!s.visited.includes(target))s.visited.push(target);
 if(s.condition<5&&["neck","floor","incident","corridor","underpass","roof","evening","morning","station","core","home_bathroom","canal_path","park"].includes(target))s.condition++;
 render();
}
function render(){
 if(s.scene==="ending"){renderEnding();return;}
 const n=S[s.scene];let visibleChoices=n.choices;if(s.scene==="key_search")visibleChoices=n.choices.filter(c=>!c.n.startsWith("search_")||!s.flags.keysSearched.includes(c.n.slice(7)));$("story").innerHTML=`<div class="kicker">${n.chapter} · ${s.time}</div><h2>${n.title}</h2>${n.text.map((t,i)=>`<p ${i===0?'class="lead"':''}>${t}</p>`).join("")}${n.note?`<div class="note">${n.note}</div>`:""}<div class="choices">${visibleChoices.map((c,i)=>`<button class="choice" data-c="${i}"><span class="glyph">${c.g}</span><span><strong>${c.t}</strong><small>${c.d}</small></span></button>`).join("")}</div>`;
 $("story").querySelectorAll("[data-c]").forEach(b=>b.addEventListener("click",()=>{const c=visibleChoices[Number(b.dataset.c)];if(c.n==="ending"){effects(c.e);s.scene="ending";render();}else go(c.n,c.e);}));
 renderSide();
}
function renderSide(){
 const status=["You feel normal enough.","A little feverish and tired.","Your senses feel unusually sharp; your ears still feel pressurised.","Your body feels unfamiliar in small ways. Your throat is rough and your skin feels warm.","The changes are harder to ignore. Sounds seem to linger after they stop.","Something is close to changing. Your body is reacting before you decide to move."];
 const keyStatus=s.flags.keysFound?"Found":(s.flags.keysSearched.length?"Still missing":"Not checked");
 const route=s.flags.atHome?"Staying home":(s.flags.keysFound?"Driving":"Getting to work");
 $("side").innerHTML=`<div class="who"><div class="sigil">◌</div><div><b>${esc(s.name||"You")}</b><small>DAY ${s.day} · ${s.time}</small></div></div><div class="sidehead">How you feel</div><p>${status[Math.min(s.condition,5)]}</p><div class="line"><span>Head</span><b>${s.condition<2?"Heavy":"Full of noise"}</b></div><div class="line"><span>Body</span><b>${s.condition<2?"Unwell":"Not quite familiar"}</b></div><div class="line"><span>Car keys</span><b>${keyStatus}</b></div><div class="line"><span>Route</span><b>${route}</b></div><div class="line"><span>Journal</span><b>${s.clues.length} saved detail(s)</b></div><div class="rule"></div><div class="sidehead">In your pockets</div>${s.items.map(x=>`<span class="pill">${esc(x)}</span>`).join("")}<p style="margin-top:13px">Your final animal is hidden. There is no transformation meter, and the game will not identify the animal before the last stage.</p>`;
}
function intro(){
 $("story").innerHTML=`<div class="kicker">A new interactive story · Chapter one</div><h1>OFFSHIFT</h1><p class="lead">You wake up feeling sick. Your head hurts, your throat is dry, and something about your skin feels wrong. Work is waiting — but you do not have to go.</p><p>This is a slow-burn transformation mystery. You can stay home, scroll through your phone, get ready for work, search for missing car keys, take the bus, drive or walk. Along the way you will encounter people chosen at random: neighbours, strangers, road users and different co-workers.</p><p>The story has more locations, longer stretches of time and optional side routes. Your choices quietly influence which real animal you eventually become. The game will not show an animal meter or tell you what you are turning into. You only discover the answer when the transformation is complete.</p><div class="rule"></div><label class="kicker" for="playerName">What should people call you?</label><div class="namebox"><input id="playerName" maxlength="20" placeholder="Your name"><button class="primary" id="startBtn">Wake up</button></div><p class="smallprint">Use Phone, Journal and Pockets at the top whenever you want. You can save your progress and start a different route on another playthrough.</p>`;
 $("startBtn").addEventListener("click",()=>{s.name=$("playerName").value.trim()||"You";render();});
}
function renderEnding(){
 const a=s.stats;
 const scores={
  wolf:a.wild*1.15+a.care*.35+a.trust*.25+a.scent*.2,
  fox:a.curious*1.05+a.independent*.9+a.scent*.3,
  cat:a.home*1.1+a.independent*.65+a.calm*.55+a.night*.2,
  dog:a.social*1.1+a.care*.75+a.trust*.55,
  deer:a.herd*.85+a.calm*.6+a.speed*.35+a.sky*.2,
  horse:a.speed*1.0+a.herd*.65+a.wild*.35,
  owl:a.night*1.0+a.sky*.7+a.curious*.35,
  raven:a.curious*.8+a.social*.35+a.sky*.25+a.independent*.35,
  otter:a.water*1.0+a.social*.45+a.curious*.25,
  badger:a.root*.8+a.independent*.8+a.calm*.45,
  hare:a.speed*.8+a.night*.35+a.calm*.35,
  seal:a.water*.8+a.calm*.55+a.social*.35,
  squirrel:a.curious*.6+a.speed*.55+a.home*.25,
  hedgehog:a.home*.45+a.calm*.8+a.independent*.35
 };
 let key="cat",best=0;Object.entries(scores).forEach(([k,v])=>{if(v>best){best=v;key=k;}});
 const e=endings[key];
 $("story").innerHTML=`<div class="kicker">Epilogue · ${s.day===2?"Tuesday":"Monday"} · ${s.time}</div><h2>${e.title}</h2><p class="lead">You are becoming a ${e.animal}.</p>${e.body.map(t=>`<p>${t}</p>`).join("")}<div class="rule"></div><p class="lead">${esc(s.name||"You")}, you are now fully an ordinary ${e.animal}. Your memories remain, but your body is no longer human.</p><p>You explored ${s.visited.length} locations, read ${s.read.length} public posts and saved ${s.clues.length} clues. Your final form was shaped by the decisions you made along the way.</p><div class="choices"><button class="primary" id="again">Play a new story</button><button class="secondary" id="endJournal">Read your journal</button></div>`;
 $("again").addEventListener("click",restart);$("endJournal").addEventListener("click",()=>openModal("journal"));renderSide();
}
function openModal(which="feed"){tab=which;$("overlay").classList.add("open");modal();}
function closeModal(){$("overlay").classList.remove("open");}
function modal(){
 $("modalTitle").textContent=tab==="feed"?"Phone · Feed":tab==="messages"?"Phone · Messages":tab==="journal"?"Journal":"Pockets";
 let html="";
 if(tab==="feed"){
  html=`<div class="tabs"><button class="secondary active" data-tab="feed">Feed</button><button class="secondary" data-tab="messages">Messages</button></div><p class="muted">Scroll through the posts. Most of them look ordinary until they don't.</p>`+posts.map((p,i)=>`<article class="card"><div class="src">${p[0]}</div><p>${p[1]}</p><button data-read="${i}">${s.read.includes(i)?"✓ Read":"Read / save to journal"}</button></article>`).join("");
 }else if(tab==="messages"){
  html=`<div class="tabs"><button class="secondary" data-tab="feed">Feed</button><button class="secondary active" data-tab="messages">Messages</button></div>`+messages.map((p,i)=>`<article class="card"><div class="src">${p[0]}</div><p>${p[1]}</p><button data-msg="${i}">${s.messages.includes(i)?"✓ Read":"Mark as read"}</button></article>`).join("");
 }else if(tab==="journal"){
  html=`<p class="muted">Things you have noticed. The journal keeps details, not answers.</p>`+notes.map(n=>`<article class="card"><div class="src">${n[0]}</div><p>${n[1]}</p></article>`).join("")+s.journal.map(t=>`<article class="card"><p>${t}</p></article>`).join("");
 }else{
  html=`<p class="muted">The things you have picked up or kept.</p>${s.items.map(x=>`<span class="pill">${esc(x)}</span>`).join("")}<div class="rule"></div><p>Your phone is full of posts. Your pockets are full of ordinary things. You are not sure which will matter.</p>`;
 }
 $("modalBody").innerHTML=html;
 $("modalBody").querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>{tab=b.dataset.tab;modal();}));
 $("modalBody").querySelectorAll("[data-read]").forEach(b=>b.addEventListener("click",()=>{const i=Number(b.dataset.read);if(!s.read.includes(i))s.read.push(i);s.journal.push(posts[i][0]+": "+posts[i][1]);if([0,3,5,6,8,11].includes(i))addClue();if(i===6)s.stats.sky++;if(i===4)s.stats.trust++;modal();renderSide();}));
 $("modalBody").querySelectorAll("[data-msg]").forEach(b=>b.addEventListener("click",()=>{const i=Number(b.dataset.msg);if(!s.messages.includes(i))s.messages.push(i);if(i===0){s.stats.trust++;}if(i===1||i===3)s.stats.care++;if(i===4)addClue();modal();renderSide();}));
}
function save(){try{localStorage.setItem("offshift_save_v5",JSON.stringify(s));$("saveBtn").textContent="Saved ✓";setTimeout(()=>$("saveBtn").textContent="Save",1100);}catch(e){alert("This browser could not save the game.");}}
function load(){try{const x=JSON.parse(localStorage.getItem("offshift_save_v5")||"null");if(x&&x.scene&&x.stats){s=x;return true;}}catch(e){}return false;}
function restart(){if(!confirm("Start a new OFFSHIFT story? Your saved game will be replaced."))return;s=fresh();intro();renderSide();closeModal();}
$("phoneBtn").addEventListener("click",()=>openModal("feed"));$("journalBtn").addEventListener("click",()=>openModal("journal"));$("bagBtn").addEventListener("click",()=>openModal("bag"));$("saveBtn").addEventListener("click",save);$("newBtn").addEventListener("click",restart);$("closeBtn").addEventListener("click",closeModal);$("overlay").addEventListener("click",e=>{if(e.target===$("overlay"))closeModal();});document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});
if(load()){if(s.scene==="ending")renderEnding();else render();}else{intro();renderSide();}
})();
</script></body></html>
