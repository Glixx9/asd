wake:{time:"06:42",chapter:"Monday · Before work",title:"You wake up feeling properly wrong.",text:[
"The alarm goes off at 06:42. You reach for the phone, but your arm feels heavier than it should. Your throat is dry and sore. There is a dull ache behind your eyes, a faint pressure in your ears, and a strange warmth under your skin even though the room is cold. You sit up too quickly. The floor tilts for a second. You wait for it to settle, one hand gripping the mattress.",
"You slept badly. You remember waking twice in the night, once because you thought someone was walking along the landing and once because your skin felt cold in patches. Now your head is full of cotton wool. Your mouth tastes metallic. When you swallow, the back of your throat catches. It could be a normal bug. It could be the start of the Greywake illness everyone has been posting about. You do not know, and you do not feel well enough to make a confident decision.",
"Your phone lights up with the usual clutter: a weather alert, a work notification, a delivery advert, a video someone sent you yesterday, and a local headline about another cluster of unexplained illness. The time is moving. Your shift starts later this morning, but you normally leave early. You could stay home, tell work you are unwell and see how you feel. Or you could get up, get ready and try to carry on as normal."
],note:"Your body feels off before the day has even started. You are not sure whether you are ill, exhausted, or noticing something you should not be able to notice.",choices:[

C("↗","Get up and try to make it to work","Maybe a shower, food and fresh air will help.","bathroom",{speed:1,minutes:2})
]},
phone:{time:"06:50",chapter:"Monday · The feed",title:"A normal feed with something wrong underneath it.",text:[
"You open your usual feed. First comes a dog refusing to leave a warm laundry basket. Then a clip of someone dropping an entire tray of chips outside a takeaway. Then a local post about a power cut that apparently lasted eleven minutes and has already become an argument about the council. You almost laugh. People are still posting breakfast photographs, complaining about parking and sharing screenshots with names covered over.",
"The feed refreshes. Greywake appears in three different places. One post says the health service is asking people with fever, strange skin sensitivity or sudden changes in smell to stay home and seek advice. Another says it is nonsense. A third is a shaky video of a bus shelter at night. Someone stands beneath it with their back to the camera, perfectly still, while everyone else keeps a wide distance.",
"The comments contradict one another. Some say the illness is harmless. Some claim a neighbour woke with pale marks along their spine. A pharmacy has posted that cold remedies are selling quickly. An official notice says people who feel unwell should stay home where possible. Your throat aches when you swallow. You scroll past another argument and notice that your hand is trembling slightly."
],note:"You can keep scrolling, get ready, or decide that feeling unwell is a good enough reason to stay home.",choices:[
C("⌕","Open the local Greywake posts","Read the reports rather than the comments.","feed_more",{curious:2,minutes:5}),
C("▤","Read the official health notice","Find out what the actual advice says.","notice",{curious:1,minutes:3}),
C("⌂","Put the phone down and stay home","You do not feel fit for work.","stay_home_call",{home:2,calm:1,minutes:3})
]},
feed_more:{time:"06:52",chapter:"Monday · The feed",title:"The posts do not agree with each other.",text:[
"The oldest report you can find is from a woman whose brother came home from a late shift at the Northline depot with a fever and a ringing in his ears. He slept for fourteen hours. When he woke, he could not stand the smell of coffee, but could smell rain through a closed window. The post has hundreds of replies and no useful information.",
"A second post is from a night-shift cleaner at a different site. They describe a colleague who became convinced the fluorescent lights were humming in a language. A third is a photograph of a pharmacy notice: masks are available, cold remedies are selling out, and staff have been told not to speculate. The official statements use careful words: cluster, unexplained symptoms, precautionary monitoring.",
"At the bottom of a thread, someone has posted a four-second voice note. A low sound, like a distant engine trying to start. The caption says: “This is what my sister hears at night.” You replay it once. Your jaw tightens before you know why. Your phone vibrates again. Ren has sent another message: “I heard someone at the depot went home early. They said the lights were too loud. Not bright. Loud.”"
],choices:[
C("▤","Save the posts to your journal","You want to keep the details.","bathroom",{curious:1,clue:1}),
C("▤","Check the work notice again","Look for a detail the official post left out.","notice",{curious:1}),
C("⌂","Stop scrolling","You need to get ready.","bathroom",{calm:1})
]},
ren:{time:"06:56",chapter:"Monday · Messages",title:"Ren is awake. That is unusual.",text:[
"Ren replies almost immediately, as if they have been waiting for the typing bubble. “I heard it from Lee. Someone at the depot went home early yesterday. They said the lights were too loud. Like they were inside his teeth. Then this morning he called in and said his hands felt wrong. That's all I know.”",
"You type that you are not laughing, then delete it. Ren sends another message. “There was a van outside the old clinic last night. No markings. Two people in white coats. Maybe nothing. But if you feel feverish, don't try to be a hero for a shift.” Ren collects rumours and presents them as evidence, but they also notice when people are not okay.",
"You look at your hands. They seem normal: the small scar near your thumb, the faint line where your watch usually sits. You flex your fingers. A mild tingling moves through them and disappears. You tell Ren you will be careful. It is a promise made mostly to end the conversation."
],choices:[
C("✉","Ask Ren to meet you after work","You would rather not deal with this alone.","bathroom",{trust:2}),
C("⌕","Ask for names and times","You need facts, not rumours.","bathroom",{curious:2,clue:1}),
C("⌂","Tell Ren you're fine","There is no point alarming anyone yet.","bathroom",{calm:1})
]},
bathroom:{time:"07:04",chapter:"Monday · The mirror",title:"The bathroom light is too honest.",text:[
"The shower takes a while to warm up. You stand beneath it longer than you need to, letting the water run over the back of your neck. There is a moment when the spray feels almost painful, then a moment when it feels wonderful, then a moment when you cannot decide which. You turn the temperature down. The pipes knock in the wall. You can hear the water travelling through them, each small change in pressure distinct from the next.",
"In the mirror, your face looks like your face. A little pale. A little tired. You brush your teeth and notice that mint is suddenly too strong, sharp enough to make your eyes water. You rinse twice. The taste stays, but becomes something cool and green and almost electric. You examine your eyes. The whites are clear. Your pupils look ordinary. There is a faint flush at the sides of your neck, perhaps from the shower.",
"You press two fingers there. Your pulse is steady, though it seems to beat in more than one place. That is impossible, so you decide you are feeling the echo of your fingertips. On the shelf are painkillers, shower gel and a hairbrush with a few loose strands caught in it. The normality of these things makes you feel foolish. You dry off, dress for work and avoid looking at the mirror again."
],choices:[
C("⌂","Make coffee and breakfast","A normal breakfast might settle your stomach.","kitchen",{calm:1}),
C("⌕","Look more closely at your neck","Three pale marks seem to sit beneath the skin.","neck",{curious:1}),
C("▣","Check the phone while dressing","See whether the local notice has changed.","notice",{curious:1})
]},
neck:{time:"07:08",chapter:"Monday · The mirror",title:"A pattern that disappears when you stare at it.",text:[
"You lean closer. Along the side of your neck, just below the hairline, are three pale marks. They are not scratches. They are too evenly spaced for that, and they seem to sit beneath the skin rather than on top of it. You touch one. The skin is smooth. The mark fades under pressure, then returns when you let go.",
"You tilt your head and the marks seem to shift, though that may be the bathroom light. You take a photograph. On the screen, the marks are barely visible. When you look up, they are clear again. There is no pain, no swelling, nothing that would justify missing work. You search “pale lines on neck Greywake” and get medical pages, conspiracy posts and an advert for a neck massager.",
"The official page says symptoms vary and advises people not to diagnose themselves from social media. You delete the photograph, regret deleting it, then restore it from the bin. The image looks ordinary. You put the phone away and dress. The marks fade before you leave the bathroom, but you can still feel where they were."
],choices:[C("⌂","Leave for the kitchen","You can think about it later.","kitchen",{clue:1,curious:1})]},
kitchen:{time:"07:18",chapter:"Monday · Breakfast",title:"Breakfast does not taste the way it should.",text:[
"The kitchen smells wrong. Not bad — just different. The coffee machine clicks and hisses. Usually the smell reaches you before the first drip. Today it is faint, almost absent. The toast, on the other hand, smells so vivid that you can tell which side of the slice is browning. You turn the toaster off early. Your stomach gives a small, unpleasant twist.",
"The radio presenter mentions roadworks, a football result, then the Greywake cluster. Several workplaces have reported unusual illness. People are being asked to stay home if they develop a fever or unexplained sensory symptoms. The presenter repeats that there is no confirmed evidence of wider danger. The phrase sounds rehearsed. You eat half a slice of toast and leave the rest on the plate.",
"You fill a water bottle and put your work ID in your pocket. Then you reach for your car keys. The little bowl beside the door is empty. You check the hook. Nothing. You check the pocket of yesterday's jacket. No keys. You are sure you brought them in last night, but you cannot remember where you put them. The clock reads 07:18. You have time to search, take the bus, or change your mind and stay home."
],choices:[
C("⌕","Search the house for your car keys","You normally leave them near the door. They must be somewhere.","key_search",{curious:1,minutes:2}),
C("▣","Forget the car and take the bus","You can still get to work without driving.","bus_stop",{social:1,minutes:8}),
C("⌂","Stay home after all","The sore throat and dizziness are getting harder to ignore.","stay_home_call",{home:2,calm:1,minutes:2})
]},
notice:{time:"07:19",chapter:"Monday · Breakfast",title:"The official notice is short on answers.",text:[
"The notice lists fatigue, temperature changes, sensory disturbance, unusual sleep patterns and transient skin markings. The cause is under investigation. There is no confirmed evidence that ordinary contact is the primary route of spread. People who feel unwell should avoid close contact where practical and contact the relevant health service for advice.",
"The wording is careful. It is also strangely specific. Transient skin markings. You read that phrase twice. The marks on your neck have faded almost completely, but you can still feel where they were, as if the skin remembers being touched. At the bottom is a warning not to share unverified images or personal details of affected people.",
"Your phone buzzes. A message from work: the morning briefing has been moved forward. All staff are to report to the main floor immediately. You put the phone away. Whatever is happening, you will hear more there."
],choices:[C("⌂","Head to work","The briefing is about to start.","commute",{clue:1})]},
commute:{time:"07:32",chapter:"Monday · The journey",title:"The town looks almost normal.",text:[
"The air outside is damp and cold. The street is busy in the usual way: cars edging out of side roads, someone jogging with a dog, a delivery driver carrying two coffees and trying not to spill either. You walk to the stop. Halfway there, a smell catches you — wet concrete, cut grass, the faint metallic tang of a bus engine. You turn your head before you decide to.",
"On the bus, people keep their eyes on their phones. A child watches cartoons without sound. Two passengers argue quietly about whether Greywake is being exaggerated. One says their cousin has it and is fine. The other says their cousin has not answered a message in two days. You take a seat by the window. The glass is cold against your forehead.",
"The engine vibration travels through the seat and into your ribs. For a few seconds, the whole bus seems to have a rhythm: wheels, road, engine, breathing. Your own breath falls into time with it. Then the bus brakes. The rhythm breaks. You blink and realise you have been gripping the edge of the seat hard enough to hurt your fingers."
],choices:[
C("⌕","Watch the passengers","Someone across the aisle wears a clinic wristband.","bus_watch",{curious:1}),
C("▣","Check the work group chat","The moved briefing may explain the rush.","arrival",{trust:1}),C("↗","Get off and walk the last few streets","You need some air before going inside.","walk_to_work",{route:"walking",minutes:7}),
C("⌂","Look out of the window","Do not make a story out of every little thing.","arrival",{calm:1})
]},
bus_watch:{time:"07:38",chapter:"Monday · The journey",title:"The passenger with the paper wristband.",text:[
"The person across the aisle has a pale blue paper wristband, the sort used by clinics. Their eyes are closed, but they are not asleep. Their fingers tap against their thigh in a repeating pattern: two quick taps, a pause, three slow taps. When the bus passes beneath a bridge, the tapping stops.",
"They open their eyes and look directly at you. Their expression is not threatening. It is tired, and for a second you have the odd feeling that they recognise you. They glance at your neck. You touch the place where the marks were. Their mouth moves. You cannot hear the words over the engine, but you read them anyway: “Not yet.”",
"At the next stop, they stand and leave. Through the window, you see them walking away with a careful, uneven gait. They do not look back. The wristband flashes once in the morning light."
],choices:[C("⌂","Get off at your stop","You are close to work.","arrival",{clue:1,curious:1})]},
arrival:{time:"08:02",chapter:"Monday · Northline",title:"The entrance is busier than usual.",text:[
"The automatic doors open with their usual sigh. The lobby smells of floor polish, old coffee and wet jackets. People are gathered around the clock-in terminals, but the usual morning chatter is missing. A few staff members are rubbing their eyes. Someone has left a half-eaten sandwich beside the sign-in tablet. The security guard is speaking quietly into a phone.",
"A person you do not recognise is standing beside the lockers, trying to get a jammed door open. Another worker keeps glancing towards the east corridor, where a temporary barrier blocks the way. The digital clock above reception reads 08:02. It is several minutes later than you expected. You feel a faint pressure behind your ears, as if the building is full of distant machinery.",
"A supervisor asks everyone to report to the briefing room. You can stop and speak to a random colleague first, ask the supervisor why the corridor is closed, or go straight to the briefing. Nobody seems particularly keen to be the first person to ask questions."
],choices:[
C("✉","Speak to the person by the lockers","They look as if they have something to say.","coworker_encounter",{social:1,minutes:5}),
C("⌕","Ask the supervisor about the east corridor","You want a straight answer before starting work.","manager",{curious:1,minutes:3}),
C("↗","Take the elevator to the briefing room","The stairs are busy. You press the lift button.","elevator_event_gate",{minutes:1}),
C("→","Take the stairs instead","Keep your head down until you know more.","briefing",{calm:1,minutes:3})
]},
sam:{time:"07:46",chapter:"Monday · Northline",title:"Sam tells you what they saw.",text:[
"Sam looks over their shoulder before answering. “Martin said the building smelled like the sea. We're nowhere near the sea. He said it was coming through the walls. Then he started rubbing his arms like his sleeves were full of insects.” Sam pauses. “I thought he was having a panic attack. I got him a chair. He was shaking, but he wasn't cold.”",
"Sam taps the side of the cup with one fingernail. Three tiny sounds. Then a pause. Then three more. “Like that. He said they were under the floor. I couldn't hear anything. Then, when I went to get Lee, the lights flickered and Martin was gone.”",
"Sam looks embarrassed by the story. You tell them they did the right thing by helping. Their shoulders drop slightly. The briefing room door opens. The manager calls everyone inside."
],choices:[C("→","Go to the briefing with Sam","Stay together.","briefing",{care:1,trust:1})]},
manager:{time:"07:46",chapter:"Monday · Northline",title:"The official version is polished smooth.",text:[
"Lee is speaking quickly. The manager has a tablet in one hand and a look that suggests the tablet is the only thing keeping the morning under control. “Martin became unwell and was taken off site. That's all we know,” the manager says. “There is no reason to connect this to online rumours.”",
"You ask whether the health notice applies to Northline. The manager's expression changes by a fraction. “We are following the guidance we've been given. If you have symptoms, report them. If you don't, carry on as normal.” Lee says the east corridor is closed. The manager calls it a maintenance issue.",
"You glance towards the corridor. A temporary barrier has been placed across it. Behind the barrier, the overhead lights are on, but the far end looks darker than it should. A faint vibration comes from somewhere beyond it, like a phone buzzing on a hard surface. “Briefing room. Now, please,” the manager says."
],choices:[C("→","Go to the briefing room","You can investigate later.","briefing",{curious:1})]},
briefing:{time:"08:25",chapter:"Monday · The briefing",title:"A normal briefing for an abnormal day.",text:[
"The room is too warm. Chairs are arranged in rows, and the screen displays routine tasks beneath a banner that says SAFETY FIRST. The manager speaks about attendance, production targets and a temporary change to the cleaning schedule. Then the slide changes. A plain white page appears: report unusual symptoms; avoid restricted areas; do not photograph affected colleagues; await further instruction.",
"Nobody asks what counts as unusual. Nobody asks why the cleaning schedule has changed. Lee stands near the door. Two people from the night team are missing. A worker near the back keeps pressing a tissue to one ear. When the manager says Greywake, they flinch so sharply that their chair scrapes the floor.",
"The manager says the east corridor is closed for maintenance. The old loading lift is also unavailable. Everyone is asked to return to their assigned areas. You can go to the work floor, check the locker room first, or ask Lee about the corridor."
],choices:[C("→","Return to the work floor","Try to make it through the morning.","floor",{calm:1,minutes:3}),C("⌕","Check the locker room","You left something in your locker.","locker_room",{curious:1,minutes:5}),C("✉","Ask Lee about the east corridor","The maintenance explanation does not fit.","corridor",{curious:2,minutes:4})]},
nia:{time:"08:02",chapter:"Monday · The briefing",title:"Nia is hearing something nobody else can.",text:[
"Nia stays behind while the others file out. She is holding the tissue against her ear, but there is no blood on it. Her hands are trembling. “It's not ringing,” she says before you ask. “It's like someone is turning pages in the next room. Over and over. But there isn't a next room. It's inside the wall.”",
"You ask whether she wants the first-aid room. She shakes her head, then changes her mind. She says she has been sleeping badly for three nights. Every time she closes her eyes, she sees a shape moving across a ceiling. Not a person. Not an animal. Just a shape that seems to know where she is looking.",
"She asks if you have felt anything strange. You nearly tell her about the marks on your neck, the metallic taste, the way the bus engine seemed to settle into your heartbeat. Instead you say you have been tired. Nia gives a small, humourless laugh. “That's what everyone says first.”"
],choices:[C("→","Walk with Nia to the floor","Don't leave her to handle this alone.","floor",{care:2,trust:1})]},
floor:{time:"08:28",chapter:"Monday · The work floor",title:"The machines keep doing their jobs.",text:[
"The work floor is familiar enough to be unsettling. Conveyor belts move. Screens display numbers. A forklift reverses near the far loading door. Someone has left a half-eaten sandwich beside a keyboard. The building is full of ordinary noises, but they no longer blend together. You hear the fan above your station, a relay behind the panel, the rubber squeak of a trolley wheel three aisles away.",
"You begin the first task on your list. Scan, check, record. You have done it so often that your hands usually move before you think. Today your fingers hesitate above the controls. The screen seems too bright, then too dim. You blink and the numbers settle. You take a sip of water. It tastes faintly sweet, then bitter, then like nothing at all.",
"At 08:36, every screen on the floor flickers at once. The lights dim. Somewhere behind the wall, something knocks three times. A sharp tone cuts across the floor. Not the fire alarm. Something lower, repeated in three bursts. Every machine stops. A colleague at the next station looks at you, then quickly looks away."
],choices:[
C("⌕","Inspect the nearest screen","A line of text appeared for a fraction of a second.","glitch",{curious:2,minutes:3}),
C("✉","Ask the colleague beside you what they saw","They reacted at exactly the same moment.","coworker_floor",{social:1,minutes:4}),
C("↗","Step outside to the loading yard","You need some air and a clearer view of the building.","loading_yard",{wild:1,minutes:6}),
C("⌂","Keep working","Do not become the person who panics first.","incident",{calm:1,minutes:2})
]},
glitch:{time:"08:20",chapter:"Monday · The work floor",title:"A message flashes where the task list should be.",text:[
"For less than a second, the screen displays a line of text: WE CAN HEAR THE SHAPE OF YOU. Then the task list returns. You stare at it long enough for the screen to dim. You take a photograph. The camera catches only the normal interface. You try again, but the message does not return.",
"In the dark part of the screen, your face seems slightly delayed. You move your head. The reflection follows, but not quite at the same time. Behind you, someone drops a metal tool. The clang rings through the floor. Your whole body reacts before you do — shoulders tight, breath held, fingers spread against the worktop.",
"A strange warmth runs from the base of your spine to the back of your head. When you turn, nobody is looking at you. The person who dropped the tool is apologising. The manager is speaking into a phone. The radio has stopped playing."
],choices:[C("→","Step away from the screen","You need a minute before the next task.","incident",{clue:1,curious:1})]},
sam_floor:{time:"08:21",chapter:"Monday · The work floor",title:"Sam is watching the loading bay.",text:[
"Sam stands beside the marked walkway, eyes fixed on the loading bay doors. A delivery truck is parked outside. Its engine is off. Nobody is unloading it. “There was someone there,” Sam says. “Between the pallets. I saw them move.”",
"You look. There is a gap between two stacks of boxes, but it is empty. Sam insists the person was crouched low, almost on all fours. They had a high-visibility jacket on, but the sleeves were too long. Then the truck's lights flashed and the person was gone.",
"Sam's breathing is quick. You stay with them until it slows. As you do, you notice a smell coming from the bay: rain on hot metal, damp cardboard, and something sweet beneath it. It is familiar in a way you cannot place."
],choices:[C("→","Walk with Sam towards the office","You should both be away from the bay.","incident",{care:1,trust:1})]},
incident:{time:"08:27",chapter:"Monday · The first incident",title:"The alarm is not a fire alarm.",text:[
"The manager's voice comes over the public-address system. “All staff remain where they are. This is a precautionary pause. Do not use the east corridor. Further instructions will follow.” Then a second voice comes through the speaker. It is quieter and closer, as if someone has leaned directly into the microphone.",
"““If you can hear this, don't answer it.”” The speaker clicks off. Nobody moves for a moment. Then the questions start. What was that? Who said it? Was it a prank? Lee walks towards the office at a fast pace. Sam grabs your sleeve. Nia has both hands over her ears.",
"You feel a pressure behind your teeth. It pulses once, twice, three times. The sound is not coming from the speaker. It is coming from somewhere inside the building, somewhere below the floor. You have to decide what matters most right now."
],choices:[
C("✋","Help Nia get somewhere quiet","She looks close to breaking down.","help_nia",{care:2}),
C("⌕","Follow Lee towards the office","You need to know what the managers know.","office",{curious:2}),
C("↘","Move towards the loading bay","The warning came from inside. The bay may have an exit.","bay",{wild:1})
]},
help_nia:{time:"08:31",chapter:"Monday · The first incident",title:"The quiet room is not quiet.",text:[
"You guide Nia towards the small meeting room near reception. The lights are softer there. You close the door and ask if she wants water. She nods, then shakes her head, then nods again. For a few minutes, neither of you speaks. The room has a framed photograph of a coastline on the wall. You focus on it, counting the waves in the picture. Nia does the same.",
"Then she says, “I can hear you thinking.” You ask what she means. She presses her palms to her temples. “Not words. More like the feeling before a word. You are worried about your neck. You keep touching it in your mind.” You have not told her about the marks.",
"She seems frightened by what she has said, perhaps more than you are. “I don't want to know what it is,” she says. “I just want it to stop.” You promise to stay with her. Somewhere beyond the door, the lights flicker."
],choices:[C("→","Find Lee and ask for the truth","You cannot stay in the room forever.","office",{care:1,trust:1})]},
office:{time:"08:38",chapter:"Monday · The office",title:"The manager has locked the door.",text:[
"Lee is outside the manager's office, arguing in a low voice. The manager has shut the blinds. Through the glass you can see a second person seated at the desk, wearing a plain grey jacket and a disposable mask. There is a hard case on the floor beside them.",
"Lee says the stranger has been there since before the briefing. Not health service. Not police. They will not say who they work for. The manager opens the door just enough to speak. “You need to return to your assigned area.” You ask whether staff are being sent home. The masked person looks up. Their eyes move to your neck, then to your hands.",
"““Have you experienced any unusual sensory changes?”” the stranger asks. The question is so direct that you almost answer honestly: the metallic taste, the sound in the walls, the marks. You look at Lee. Lee gives the smallest possible shake of the head. The masked person waits. You realise this is the first moment today when telling the truth might change what happens next."
],choices:[
C("✓","Tell them about the marks and sounds","You want an explanation more than you want to hide it.","clinic",{trust:1,clue:1}),
C("—","Say you feel normal","You do not know who they are or what they want.","bay",{calm:1}),
C("⌕","Ask who they are first","They can answer a question before asking one.","office_name",{curious:2})
]},
office_name:{time:"08:42",chapter:"Monday · The office",title:"They give you a name, not an answer.",text:[
"The masked person introduces themselves as Dr Vale. No first name. No organisation. They say they are part of a temporary response team investigating the Greywake cluster. You ask what Greywake is. Vale says it is a working label, not a diagnosis. You ask whether it is contagious. Vale says they are still investigating.",
"You ask why they are in a workplace rather than a clinic. Vale looks towards the manager. “Because the earliest reports came from sites like this.” You ask what happened to Martin. Nobody answers immediately. Vale finally says Martin is safe, but cannot be contacted. The phrasing is exact. Safe, but cannot be contacted.",
"Vale asks again whether you have noticed any changes. You realise that the question is not going away. They can offer an assessment, or you can leave the office and decide for yourself. Neither option feels entirely safe."
],choices:[C("✓","Agree to be checked","If they know something, you need to hear it.","clinic",{trust:2,curious:1}),C("↘","Leave before they can stop you","You need to see what is happening for yourself.","bay",{wild:1})]},
bay:{time:"08:48",chapter:"Monday · The loading bay",title:"The truck is still there.",text:[
"The loading bay doors are half open. Outside, the delivery truck has not moved. The driver is nowhere to be seen. A pallet has been left at an angle, its shrink-wrap torn down one side. There are wet marks on the concrete, although it has not rained since you arrived.",
"You approach carefully. The smell is stronger here: damp earth, cold metal, and something like the inside of a shell. You crouch to look beneath the pallet. There are footprints in the dust. They begin as ordinary shoe prints and become difficult to interpret near the truck. The last marks are long and narrow, with a strange split at the front.",
"You hear movement inside the trailer. A soft scrape. Then a breath. A voice says your name. It is not loud. It does not need to be. Your phone vibrates: an unknown number has sent a message — “Do not let them take you downstairs.”"
],choices:[C("→","Open the trailer door","You need to know who is inside.","trailer",{wild:2,curious:1,minutes:4}),C("⌕","Reply to the unknown message","Whoever sent it may know what is happening.","unknown",{curious:2,minutes:3}),C("↩","Back away and find another worker","You are not going in alone.","coworker_encounter",{social:1,minutes:5})]},
trailer:{time:"08:52",chapter:"Monday · The loading bay",title:"Someone is hiding behind the crates.",text:[
"You pull the trailer door open. The hinges complain. Inside, the air is colder than outside, and the darkness seems to have a texture. At first you see only boxes. Then a hand appears between them. A human hand, pale and trembling, with a work glove caught around the wrist. Martin steps into view.",
"He looks exhausted. His high-visibility jacket hangs loose. His eyes are wide, reflecting the strip light above the loading bay. He raises one finger to his lips. “They said I could go home,” he whispers. “They lied. They want to see what happens when it finishes.”",
"You ask what finishes. Martin looks down at his own hands. The fingers flex, then settle. His skin is marked with pale lines that move when he breathes, as if the marks are following something beneath it. “I don't know what it is,” he says. “I only know it knows the way out.” A scrape comes from the far end of the trailer."
],choices:[C("✋","Get Martin out of the trailer","Whatever happens next, leave together.","reunion",{care:2,trust:1}),C("⌕","Ask what he means by 'it'","You need one clear answer.","martin",{curious:2,wild:1})]},
martin:{time:"08:54",chapter:"Monday · The loading bay",title:"Martin describes a feeling, not a creature.",text:[
"Martin says it began as a fever, but not the sort that makes you sweat. It made him feel as if his body was listening to something. His joints ached, then stopped aching. His skin became too sensitive to fabric. He could smell rain before the clouds arrived.",
"“He says he thought he was getting better. Then he started waking in places he had not gone to sleep: the corridor, the floor, once outside with his shoes beside him. There are moments when he feels taller, then moments when the world seems too high. His hands feel clumsy until he stops trying to use them the way he always has.",
"“The worst part is that sometimes it feels good,” he says. “Like the whole world finally makes sense. Then I remember I don't know whose sense it is.” The scrape behind the crates comes again. Martin grabs your sleeve. You have to leave."
],choices:[C("↩","Get Martin out","Do not wait for the thing behind the crates.","reunion",{care:2,clue:1}),C("→","Run for the service corridor","The trailer is no longer safe.","corridor",{wild:1})]},
unknown:{time:"08:53",chapter:"Monday · The loading bay",title:"The unknown number knows your name.",text:[
"You type: Who is this? The reply arrives before the message has finished sending. “Someone who was there last time.” Then: “The first stage feels like a cold. The second feels like a secret. The third feels like remembering something you never learned.”",
"“You call the number. It rings once, then connects to silence. You hear breathing. Not close to the microphone, but close to you, somehow. Then a voice says, “You have already started.” The call ends. The number has a local prefix, but searching it returns no result.",
"When you look up, the loading bay seems longer than it was a moment ago. The door at the far end is open. A strip of cold light runs along the floor. You have a choice: follow it, or return to the people you know."
],choices:[C("→","Follow the strip of light","You need to find out what is below the building.","corridor",{curious:2,sky:1,clue:1}),C("↩","Return to the main floor","You need other people around you.","reunion",{trust:1})]},
reunion:{time:"09:02",chapter:"Monday · A safer room",title:"A room full of people is not necessarily safe.",text:[
"You find Sam and Nia near the small meeting room. Lee is there too, speaking to someone on the phone. The manager has disappeared. Nobody seems to know whether staff are being sent home or kept on site. Sam wants to leave. Nia wants to find Martin. Lee wants to get everyone somewhere they can think.",
"You tell them enough about the truck and the trailer. You leave out the voice from the unknown number. Nia listens without interrupting. When you mention the pale marks, she touches the side of her own neck. “Mine started there,” she says. “Then behind my knees. Like the skin was trying to draw a map.”",
"Lee says the main exit is being monitored by the response team. Anyone who reports symptoms is being taken to a temporary assessment room below the building. Nobody has been told what happens after that. You can stay together, find the assessment room, or look for another exit."
],choices:[
C("✋","Stay with Sam and Nia","Keep the group together. Nobody goes alone.","group",{care:2,trust:2}),
C("⌕","Find the temporary assessment room","You need to see what the response team is doing.","clinic",{curious:2}),
C("↗","Look for another exit","If the main doors are watched, find a different route.","corridor",{wild:1})
]},
group:{time:"09:08",chapter:"Monday · A safer room",title:"You make a plan with people who are frightened.",text:[
"You move the chairs away from the door and speak quietly. Sam checks the windows. Nia writes down the names of everyone missing from the shift list. Lee studies the floor plan on the wall. It is not a good plan yet. It is a list of things you can do without making the situation worse: keep the group together, avoid the east corridor, do not follow anyone who calls from an empty room, and do not let the response team separate people without explaining where they are going.",
"Sam offers you a cereal bar. You take it, but the smell is overwhelming. You can identify the oats, dried fruit, wrapper ink and faint trace of hand sanitiser on Sam's fingers. You put it away unopened. Nia says she has been hearing a low sound since the weekend. Lee says the ventilation system has been making unusual noises. Nobody believes that is the whole story.",
"Then the lights flicker. In the dark, you hear four different breaths. Yours is the only one that seems to come from somewhere just behind you."
],choices:[C("→","Move towards the service corridor together","A group is harder to isolate.","corridor",{care:1,trust:2}),C("✉","Use the phone to contact Ren","Someone outside may be able to help.","ren_call",{trust:2})]},
ren_call:{time:"09:12",chapter:"Monday · A call outside",title:"Ren answers on the second ring.",text:[
"Ren sounds as if they are walking quickly. There is traffic in the background and a siren somewhere far away. “I was going to call you. The clinic has closed its front doors. People are standing outside, but nobody is going in. I saw a woman come out wearing a blanket. She looked normal until she turned her head. Her neck moved like she was listening behind herself.”",
"You ask Ren to come to Northline. They refuse. They say they are near the old bus station and there are response vehicles on the main road. They tell you not to trust anyone who says the situation is contained. Then Ren asks whether you are feeling anything.",
"You look at your hands. The skin at the base of your fingers feels tight, as if you have been wearing gloves for hours. You tell Ren the truth, or part of it. “If you start hearing a voice that sounds like you, don't follow it,” Ren says. “If you feel like you know where something is without seeing it, don't assume it's your idea.”"
],choices:[C("→","Go to the rear gate to meet Ren","You need a familiar face.","roof",{trust:2}),C("→","Stay with the group","Do not leave Sam and Nia behind.","corridor",{care:1,trust:1})]},
corridor:{time:"09:20",chapter:"Monday · The service corridor",title:"The building has another sound beneath the ordinary one.",text:[
"The service corridor runs behind the offices and storage rooms. The lights wake one by one as you move. The air is colder here. A line of condensation follows the ceiling pipes, and every few metres a drop falls onto the floor with a small, precise click. You hear the low vibration again. It is not a voice. It is not quite a machine.",
"There are three doors. One is marked Maintenance. One is marked Records. The third has no label, only a keypad and a small glass panel. Behind the glass is a stairwell descending into darkness. Lee says the stairwell was not on the floor plan. Sam says the sound is stronger near the door. Nia refuses to stand close to it.",
"On the wall beside the keypad, someone has scratched a sentence into the paint: THEY ARE NOT SICK IN THE WAY WE MEAN. Your phone vibrates. The screen lights without a notification. For a second, the glass shows a reflection of you with your head tilted at an angle you are not holding."
],choices:[
C("⌕","Enter the Records room","Look for documents about the response team.","records",{curious:2,clue:1}),
C("↘","Try the unlabelled stairwell","The sound is coming from below.","underpass",{wild:1,sky:1}),
C("✋","Use the maintenance route with the others","Do not split up without a reason.","maintenance",{care:1,trust:1})
]},
records:{time:"09:27",chapter:"Monday · Records",title:"The files were not meant to be read by staff.",text:[
"The records room smells of paper and dust. A terminal is still logged in. You search for Greywake and find a folder dated three weeks ago. The first document is a list of incident reports from different sites. The second is a transcript of an interview with someone who claims their balance, temperature and hearing changed before any visible symptoms appeared.",
"The notes use phrases like adaptive response, somatic remapping and unknown endpoint. There are sketches of bodies, but the drawings have been redacted so heavily that only the outlines remain. A paragraph says the process appears to follow the subject's environment, habits and repeated emotional responses. It does not say why.",
"A message between two researchers reads: “We keep trying to classify the result before it has finished choosing.” The reply says: “Then stop asking what they are. Ask what the change is trying to solve.” You read that sentence twice. It feels personal in a way you do not understand."
],choices:[C("▤","Download the incident summary","Keep the evidence in case the room is sealed.","summary",{curious:2,clue:2}),C("→","Search the desk for a keycard","The stairwell may lead to the source.","maintenance",{curious:1})]},
summary:{time:"09:33",chapter:"Monday · Records",title:"A document names the stages without explaining them.",text:[
"The internal summary lists fatigue, altered sensory priority, temperature irregularity and sleep disruption as early signs. The next stage may include changes in balance, appetite, reflex, skin sensitivity and sound recognition. Subjects report unfamiliar instincts but often describe them as memories.",
"The final pattern is not consistent across subjects. Attempts to predict it from early symptoms have failed. A note at the bottom says the process may be influenced by the subject's surroundings and repeated behaviour. The report specifically warns staff not to assume that a subject's current appearance predicts the endpoint.",
"It is not a cure, but it is the first thing you have read that sounds honest. It confirms what Martin said: nobody knows what the final change will be. It also suggests that the things you do — your habits, the people you protect, the way you respond under pressure — might matter. You save the file. The terminal logs you out."
],choices:[C("→","Leave the records room","The next decision cannot be made here.","maintenance",{clue:1,curious:1})]},
maintenance:{time:"09:39",chapter:"Monday · Maintenance",title:"A route that smells of rain.",text:[
"The maintenance room is narrow and crowded with tools. A wall fan turns slowly, though nobody has switched it on. There are spare batteries, a first-aid kit, a coil of cable and a box of disposable gloves. You take a small torch and a bottle of water.",
"Behind a shelving unit, a panel has been left loose. It opens onto a narrow passage running beneath the building. The air coming through it smells of wet stone and leaves. It should not smell like that. Northline sits on a paved industrial estate, far from any woodland.",
"You shine the torch into the gap. The beam catches a line of pale marks on the floor. They look like footprints, but the spacing changes. Some are close together, some far apart. They lead down the passage and stop at a door with a circular handle. Your hand moves towards it before you decide to move it. You stop yourself."
],choices:[C("→","Open the passage and go through","You have come too far to stop at a door.","underpass",{wild:1,curious:1}),C("✋","Ask Lee to go first","You do not trust the impulse in your own hand.","underpass",{calm:1,trust:1}),C("↩","Return to the main floor","Find another way to help the others.","reunion",{care:1})]},
underpass:{time:"09:48",chapter:"Monday · Below Northline",title:"There is a place underneath the building.",text:[
"The passage opens into a concrete chamber. It is larger than the building above it should allow. Pipes run along the ceiling, but they are not connected to anything you recognise. Their surfaces are damp. Along one wall are rows of small observation windows, each covered from the inside. A low light pulses behind the glass.",
"The sound is stronger here, but it is not one sound. It is a collection of small noises: clicks, soft scrapes, a flutter like paper, a distant splash, a breath held and released. They overlap until they become a single rhythm. On a desk sits a folder with your first name written on it. You do not remember giving it to anyone.",
"Beside it is a photograph taken from the lobby this morning. You are in the background, looking towards the east corridor. The timestamp is 07:43, before you arrived at work. A second photograph shows the same lobby empty. A pale shape is visible in the reflection of the reception window, standing where you are standing now."
],choices:[C("⌕","Open the folder with your name","Find out how long they have been watching you.","folder",{curious:2,clue:1}),C("✋","Speak to the voice behind the glass","You need to know who is there.","glass",{care:1,trust:1}),C("↩","Turn around and leave","The room is wrong. Get out while you can.","roof",{calm:1})]},
folder:{time:"09:52",chapter:"Monday · Below Northline",title:"Your file begins before the first symptom.",text:[
"The folder contains your staff record, an old photograph from a security camera and a page of handwritten observations. The first note is dated two days ago. It describes you entering the building, stopping beside the vending machine and looking towards the east corridor for eleven seconds.",
"The next note is from last night. It says you were not present, but the system registered a badge movement at 02:13. That is the same time Ren sent their first message. The note says: SUBJECT MAY BE RESPONDING TO LOW-FREQUENCY SIGNAL BEFORE CONSCIOUS EXPOSURE.",
"A third page contains ordinary things: preferred route to work, usual break time, average number of steps between stations, repeated phone use, typical response to conflict. It reads like someone has been studying the small habits that make a person feel like themselves. At the bottom is a sentence: DO NOT TELL THEM WHAT THEY ARE BECOMING. THE ENDPOINT IS NOT FIXED."
],choices:[C("→","Take the folder and leave","You have enough. Get back to the others.","roof",{clue:2,curious:1}),C("⌕","Read the note about the endpoint","There may be something that explains the changes.","endpoint",{curious:2})]},
endpoint:{time:"09:55",chapter:"Monday · Below Northline",title:"The endpoint is a response, not a diagnosis.",text:[
"The final page is not a formal report. It looks like a note written by someone who has been awake too long. “We keep seeing the same mistake. We ask the subject to describe what is happening, then translate the answer into a category we already understand. They say the walls are breathing, and we write auditory disturbance. They say the ground is calling, and we write disorientation.”",
"““Maybe those descriptions are not symptoms. Maybe they are attempts to communicate across a change that has not finished. The pattern is not random, but it is not a simple code either. It seems to gather around what the subject has practised, feared, protected, avoided or loved.”",
"One person becomes faster when frightened. Another becomes still. One follows voices. Another follows light. A third finds water without knowing why. We cannot tell them what they are becoming because we do not know. We should stop pretending we do. You lower the page. Somewhere in you, a small part of the world has clicked into place."
],choices:[C("→","Leave the chamber","The next decision cannot be made down here.","roof",{clue:1,calm:1})]},
glass:{time:"09:54",chapter:"Monday · Below Northline",title:"The person behind the glass knows the sound.",text:[
"A face appears on the other side of the window, then moves out of the light. It belongs to a young man with a hospital wristband. He looks directly at you. “Don't let them finish the test,” he says. “They think the change can be stopped if they keep us still. It can't. It just gets confused.”",
"He says there are others in the rooms, each hearing something different. Some hear rain. Some hear a crowd. Some hear their own footsteps from the future. He presses his hand to the glass. His fingers are long and narrow, but not so unusual that you can name why. His palm leaves a faint print that fades from the centre outwards.",
"““It isn't choosing a monster,” he says. “It is trying to make a body that can live with the world it thinks we're in.” You step away. You cannot tell whether he is warning you or trying to comfort you."
],choices:[C("→","Leave and find the others","You need a plan before you make promises.","roof",{care:1,clue:1})]},
roof:{time:"10:40",chapter:"Monday · The roof",title:"From above, the town looks like a map.",text:[
"The roof door opens onto a wide strip of grey sky. The wind is cold. You walk towards the safety rail and look out over the industrial estate. Cars move along the road. A bus turns at the roundabout. Beyond the warehouses, a line of trees bends in the wind.",
"The sound is clearer here. The low vibration beneath the building is joined by smaller sounds from the town: a bird calling from a roof, a loose sign tapping against a wall, a dog barking behind a fence, the hiss of tyres on wet road. They arrange themselves into layers. You can tell which direction each sound comes from without turning your head.",
"You close your eyes. The wind touches your face and hands. For a moment, the boundary between your skin and the air seems less certain. You feel the pressure of the sky, the weight of the building, the distance to the road. It is not frightening. It is almost beautiful. You can stay and listen, watch the traffic below, or go back inside."
],choices:[C("⌕","Study the town and listen","Let the sounds settle into a pattern.","roof_listen",{sky:2,minutes:7}),C("→","Walk towards the road below","The road seems to be carrying part of the signal.","road_encounter",{route:"walking",speed:1,curious:1,minutes:8}),C("↘","Go back inside","The roof is too exposed.","evening",{calm:1,minutes:5})]},
roof_listen:{time:"10:47",chapter:"Monday · The roof",title:"The world is full of signals.",text:[
"You stand still for a long time. The wind moves over the roof in uneven waves. Somewhere below, a door opens and closes. A truck changes gear. A flock of birds lifts from the far warehouse and turns together, as if pulled by a single thought.",
"You notice that you can follow one sound without losing the others. You can hear traffic and birds and the building, each in its own place. Your attention stretches rather than narrows. The sensation is unfamiliar, but it does not feel like a symptom. It feels like a skill you have forgotten.",
"Then the birds turn towards Northline. Every one of them. They cross the roofline and disappear behind the building. A second later, the low sound beneath the floor changes pitch. You understand, without knowing how, that the sound is not calling you to a place. It is asking whether you can hear it."
],choices:[C("→","Go back inside","You want to know where the signal leads.","evening",{sky:2,curious:1})]},
clinic:{time:"10:18",chapter:"Monday · Assessment",title:"The temporary clinic is not a clinic.",text:[
"The assessment room is behind two locked doors. Dr Vale is there with two assistants. A row of chairs faces a blank wall. A person sits in each chair, separated by a careful distance. Nia is at the far end. She looks up when you enter. Relief crosses her face, then fear. She mouths something you cannot hear.",
"Vale asks you to sit. You refuse. They say nobody is being detained, but the door behind you closes with a magnetic click. They ask about your sleep, appetite, hearing, smell, balance and the marks on your skin. You answer some and avoid others.",
"Vale says the response team has observed changes in several people. The changes are not all the same. Some are temporary. Some are not. They are trying to understand the final stage and whether it can be guided safely. You ask whether they know what you are becoming. Vale looks at the tablet. “No,” they say. “And neither do you.”"
],choices:[C("✋","Ask to sit beside Nia","She should not have to face this alone.","evening",{care:2,trust:1}),C("⌕","Demand to see the full report","You have already found parts of it.","records",{curious:2}),C("↘","Leave the assessment room","The locked door is making it hard to breathe.","roof",{wild:1})]},
evening:{time:"18:26",chapter:"Monday · Evening",title:"The day has become too long to understand.",text:[
"You reach a quiet flat above a closed shop. The person who owns it has left you a key and said you can use the spare room if the roads become difficult. The curtains are drawn. A lamp glows beside the sofa. Someone has left a bowl of keys and loose change on the table. For the first time since waking, nobody is asking you questions.",
"Your phone has a little signal. The news says several workplaces have been closed temporarily. The health department repeats that there is no confirmed evidence of ordinary person-to-person spread. A separate statement says the response team is investigating an environmental source. You make tea. It tastes of warm water and something floral. Your appetite has almost disappeared.",
"Later, you wash your hands. The skin feels too tight. When you look down, the lines across your palms seem deeper than they were this morning. You close your fingers. For a moment, they do not feel like the same hands. Outside, a car passes slowly, then stops. You hear a door open, a short whistle, and footsteps moving away along the pavement."
],choices:[
C("▣","Scroll through the latest updates","See what has happened around town.","feed_night",{curious:1,minutes:8}),
C("⌕","Look out at the street","The footsteps outside have stopped.","evening_window",{night:1,minutes:3}),

talk:{time:"19:03",chapter:"Monday · Evening",title:"Ren asks you to describe the feeling.",text:[
"You tell Ren about the pressure behind your teeth, the sounds in the walls, the smell of rain where there should have been dust. You tell them about the marks on your neck and the way your balance corrected itself in the passage. You tell them that sometimes the changes feel frightening, and sometimes they feel like relief.",
"Ren listens with both hands wrapped around a mug. They do not interrupt. When you finish, they say they have been afraid all day that you would disappear into something they could not recognise. You ask whether they think that is happening. Ren says they do not know.",
"They say the person they know is still here, making jokes at the wrong time, forgetting to charge their phone, worrying about other people before themselves. A different body would not automatically make you a different person. It is kind. It is also not a guarantee. You cannot promise what the next stage will do. You can only promise to try to remember the people who matter."
],choices:[C("→","Stay close and try to rest","Let the room be safe for a little while.","dream",{trust:2,calm:1})]},
feed_night:{time:"19:18",chapter:"Monday · Evening",title:"The feed has changed its tone.",text:[
"The morning's jokes have been replaced by missing-person posts, warnings and shaky videos. A local shop has put a handwritten sign in its window: WE ARE OPEN. PLEASE BE KIND TO STAFF. Someone has posted a photograph of a street where every car is parked with its headlights on. Nobody knows why.",
"One video shows a person standing in the middle of a field at dusk, facing away from the camera. The person filming calls their name. They do not turn. Instead, the grass around them moves in a circle, though there is no wind. The video ends when the camera drops.",
"Another post is a long message from a woman whose partner has changed. She says he still knows her, still remembers their anniversary, still complains about the same television programme. But he no longer sleeps in a bed. He rests beside the open window, listening to the street. She says he seems happier outdoors and more frightened in bright rooms. You put the phone down. You are tired of strangers deciding what the people in these videos are."
],choices:[C("→","Close the feed and rest","Tomorrow is going to ask more of you.","dream",{curious:1})]},
dream:{time:"23:41",chapter:"Monday · The first night",title:"You dream in a language made of sensations.",text:[
"You fall asleep on the sofa with the lamp still on. A blanket slips from the back of the chair and settles across your legs. The dream begins with your ordinary bedroom. The ceiling crack is there. The wardrobe is there. Your phone glows with a notification that never opens. Then the room becomes a corridor. The corridor becomes a road. The road becomes dark ground beneath a sky full of low clouds.",
"You are moving, but you do not know how. Sometimes you are close to the ground. Sometimes you are above rooftops. Sometimes you are under water, looking up at lights that bend and break. There are no clear images of a body. Only the feeling of movement, the pressure of air, the pull of distance, the certainty that somewhere ahead there is a place you are meant to reach.",
"Voices call from different directions: a neighbour, a co-worker, a stranger, your own voice. You cannot answer all of them. You learn to recognise the ones that are afraid and the ones that are trying to guide you. At the end of the dream, you find a door standing in an empty field. A sentence is written across it: WHEN YOU WAKE, DO NOT MISTAKE UNFAMILIAR FOR WRONG."
],choices:[C("→","Wake up","The next morning has arrived.","morning",{calm:1,sky:1})]},
morning:{time:"06:18",chapter:"Tuesday · The second morning",title:"You wake before the alarm.",text:[
"You wake at 06:18, before the alarm and before the traffic outside. The house is quiet. Your phone is charging beside the bed. You feel rested in a way you have not felt for weeks, but your body is unfamiliar. Your shoulders are loose. Your hands are warm. Your hearing seems to reach further into the house than it should.",
"You stand and walk to the kitchen. Outside, the street is wet. A bird is perched on the roof opposite. You can hear it shifting its feet against the tiles. You can hear a neighbour's kettle click on and a car turning three streets away. Your reflection in the dark window looks ordinary until you raise a hand. For a fraction of a second, the fingers seem longer, then return to normal.",
"A message from Dr Vale waits on your phone: the response team has located the source. The old research station is open. You do not have to go, but the signal is getting stronger and the changes are continuing. You can go directly to the station, follow the sound towards the canal, or take the quieter route along the old road."
],choices:[C("⌕","Go to the research station","You want to understand what is happening.","station",{curious:2,sky:1,minutes:10}),C("≈","Follow the sound towards the canal","The water seems to be carrying the signal.","canal_path",{water:2,calm:1,minutes:18}),C("↗","Take the old road towards the weather station","You want to approach the source without meeting the response team.","weather_station_road",{independent:1,wild:1,minutes:20})]},
wait:{time:"08:02",chapter:"Tuesday · The second morning",title:"You decide to wait before going to the station.",text:[
"You decide not to rush. The kettle clicks off. The street outside is busier than yesterday, but people move differently. Some pause at corners and look down side streets. One person stands in the middle of the pavement with their eyes closed, face turned towards the wind. A delivery van passes without its radio playing.",
"The official line is still that the situation is being monitored. Shops are closing early. The bus service is running fewer routes. The local radio has stopped playing music between announcements. You look at your hands. The skin is still slightly tight, but it is not painful. You can feel the small movements of the house around you.",
"Waiting does not make the signal disappear. It only gives you time to decide how to approach it. The research station is still there. The canal path is still open. You can go to the station, or take a longer walk and see whether the town itself has begun to change."
],choices:[C("→","Go to the research station","It is time to face the source.","station",{curious:1,calm:1,minutes:12}),C("≈","Walk along the canal first","You want to understand the signal away from the building.","canal_path",{water:2,minutes:20}),C("🌳","Go through the park","You want to see how the animals are behaving.","park",{wild:1,sky:1,minutes:22})]},
station:{time:"09:06",chapter:"Tuesday · The source",title:"The research station sits beyond the old road.",text:[
"The station is a low building surrounded by fencing and scrub. It was built beside a disused weather-monitoring site, though the signs have been removed. A dish antenna points towards the sky. The gate is open. There are no guards, no response vehicles, no warning lights. The air smells of wet soil and hot wiring.",
"Vale is waiting at the entrance. They look exhausted. They say the station's equipment has been running for weeks without a power supply. The signal began as an experiment to map environmental patterns, but something answered it. The first people exposed to the signal reported symptoms. Then the pattern began to spread through recordings, buildings and shared spaces.",
"You ask what the pattern wants. Vale says they do not know whether it wants anything. It may be a form of life. It may be an ecological response. It may be something that has no word in human language. “It is not turning everyone into the same thing,” Vale says. “It is changing people in ways that seem connected to how they move through the world. We cannot predict the outcome.”"
],choices:[C("⌕","Enter the control room","See the original signal records.","control",{curious:2,sky:1}),C("✋","Ask Vale to bring the affected people outside","No more locked rooms or hidden tests.","outside",{care:2,trust:1,herd:1}),C("↘","Follow the vibration to its source","You can feel where it is strongest.","core",{wild:1,calm:1})]},
control:{time:"09:14",chapter:"Tuesday · The source",title:"The signal has been recording ordinary life.",text:[
"The control room is full of old monitors. Each displays a different stream: weather readings, traffic patterns, audio recordings, temperature maps, power usage, building occupancy. There are recordings of ordinary places at ordinary times. A kitchen at breakfast. A bus at rush hour. A factory floor. A quiet street after rain.",
"The signal appears in the background of all of them. It is faint, almost impossible to hear unless you know what to listen for. The system was designed to identify patterns that human observers overlook. Instead, it began returning patterns that did not belong to the recordings. It began producing new signals. People who heard them started changing.",
"One screen displays a map of the town. Small points glow where the Greywake reports began. The points are not random. They follow routes people use every day: the bus station, the clinic, the depot, the school, the river path, the market. The pattern looks less like an outbreak map and more like a memory of how the town moves. A file opens by itself. It contains a recording of your voice from yesterday morning: “I am here.” You do not remember saying it."
],choices:[C("→","Go to the core room","You want to meet the signal without a screen between you.","core",{curious:1,sky:1})]},
outside:{time:"09:30",chapter:"Tuesday · The source",title:"You insist that everyone gets to choose.",text:[
"Vale brings the people from the observation rooms outside. Some walk unaided. Some are supported by others. None looks exactly as they did in the first photographs, though the changes are not always visible at a glance. One person has a new stillness. Another moves with a fluid, careful grace. A third keeps looking up at the sky.",
"You ask each person whether they want to enter the station. Some say yes. Some say no. One says they want to go home. Vale looks uncomfortable, but does not argue. You tell the group what you have learned: the final pattern is not fixed, and the response team does not know what each person will become.",
"Nia steps forward. She says the signal is not trying to make them into something else. It is trying to give them a way to live with something they cannot yet understand. That does not make it harmless. It only means they should be allowed to decide how to face it. Vale opens the station door. The low sound rises from inside."
],choices:[C("→","Enter the core room with the group","No one is forced to go first.","core",{care:2,trust:2})]},
core:{time:"09:42",chapter:"Tuesday · The source",title:"The source is not a machine.",text:[
"The core room is circular. In the centre stands a column of clear material, taller than a person, filled with tiny points of light. Cables run from it into the floor. The lights move slowly, like dust suspended in water. There is no speaker. No screen. No obvious control panel. Yet the low sound is everywhere. It travels through the floor and into your shoes. It touches the back of your teeth.",
"Vale says the original experiment was designed to map environmental memory: the way places retain patterns of movement, sound and human activity. The system was meant to identify a place's history from the traces left behind. Instead, it began returning patterns that did not belong to the recordings. People who heard them started changing.",
"You ask whether the source is alive. Vale says the question may not apply. You ask whether it can be stopped. Vale says they can shut down the station, but the signal has already moved beyond it. You ask whether the change can be reversed. Vale says they do not know. The column brightens. The room fills with a sound like a thousand distant doors opening."
],choices:[C("✧","Approach slowly and listen","Do not fight the signal. Understand it first.","final",{calm:1,sky:1}),C("⌕","Ask the signal what it wants","You need to hear an answer, even if it is strange.","final",{curious:2}),C("✋","Stand between it and the others","If it reacts, let it react to you first.","final",{care:2,wild:1}),C("⏸","Ask everyone to step back","Nobody should be pushed into this.","final",{trust:2,calm:1}),C("≈","Listen to the water moving through the pipes","Follow the quiet pull beneath the room.","final",{water:2})]},
final:{time:"10:01",chapter:"Tuesday · The final change",title:"The room waits for your answer.",text:[
"The column of light dims. For the first time, the sound becomes quiet enough for you to hear your own breathing. Vale says the next stage may begin now. They cannot stop it. They can only make the room safe and let you decide how to meet it. A few affected people stand behind you. Nobody is telling you what to do.",
"You think about the morning. The alarm. The phone in your hand. The posts you scrolled past. The coffee that tasted wrong. The missing keys. The person on the road. The co-worker by the lockers. The park, the canal, the work floor and the places beneath the building. You remember the small choices that seemed unimportant at the time.",
"You do not know what animal you are turning into. You do not know whether the change will make you fast, quiet, social, solitary, curious or cautious. You only know that it is yours to face. The light moves towards you. Not like a beam. Like a tide, a breeze, a shadow crossing a wall. You feel the first shift begin somewhere deep in your body. It is not pain. It is recognition."
],choices:[C("✧","Let the change happen","You cannot know the shape before it arrives.","ending",{curious:1}),C("⌁","Listen for the pattern that feels like yours","Trust what you have learned about yourself.","ending",{calm:1,sky:1}),C("✋","Hold your ground and wait","You will not be rushed into anything.","ending",{root:1,independent:1})]},
stay_home_call:{time:"07:05",chapter:"Monday · A different decision",title:"You decide not to go in.",text:[
"You open the work app and select the absence option. The form asks for a reason. You type that you have a sore throat, a headache and dizziness. You pause before mentioning the strange sensory changes. There is a box for additional details, but you leave it empty. The message sends. A few seconds later, an automated reply confirms that your supervisor has been notified.",
"The decision brings a small wave of relief, followed by guilt. You are used to getting up and going in even when you feel rough. The flat is quiet. You can hear the fridge compressor start, a tap dripping in the bathroom and a car passing outside. The sounds seem too separate, as though your attention has learned to pull them apart.",
"You put your phone on the bedside table. Nobody is asking you to prove you are ill. You can rest, check your temperature, go to the pharmacy or step outside for some air. You still do not know what Greywake is, but you have given yourself a few hours away from the workplace."
],choices:[C("⌂","Go back to bed for a while","Give your body a chance to rest.","home_rest",{home:2,calm:2,minutes:15,atHome:true}),C("▣","Check your temperature and look in the mirror","You want to know whether you actually have a fever.","home_bathroom",{curious:1,minutes:7,atHome:true}),C("↗","Walk to the pharmacy","You could ask whether other people have reported the same symptoms.","pharmacy",{social:1,minutes:18})]},
home_rest:{time:"07:25",chapter:"Monday · Staying home",title:"The bedroom is quiet, but your body is not.",text:[
"You pull the duvet over your legs and lie back. For a few minutes you feel almost normal. Then a cold shiver moves across your shoulders, even though the room is warm. You check the clock. Only six minutes have passed. You close your eyes and hear a faint tapping from somewhere beyond the wall.",
"You try to sleep. The tapping seems to move from the wall to the ceiling, then to the floor beside the bed. When you open your eyes, the room is still. The curtains hang straight. Your phone has not moved. You sit up and realise that your headache has eased, but your hearing feels sharper than before.",
"There are ordinary things you could do: make something to eat, take a shower, look outside, or go to the corner shop for water and cold medicine. The day is no longer being measured by your shift. It is measured by how you feel and what you notice."
],choices:[C("⌂","Stay in bed and listen","Try to work out where the tapping comes from.","home_window",{night:1,calm:1,root:1,minutes:20}),C("☕","Make a small breakfast","You need something in your stomach.","home_kitchen",{home:1,minutes:12}),C("↗","Go outside for some fresh air","The flat feels too warm.","front_path",{wild:1,minutes:8})]},
home_window:{time:"07:36",chapter:"Monday · Staying home",title:"The street outside is carrying on without you.",text:[
"You move to the window and look down at the street. A neighbour is loading shopping into the boot of a car. Someone is walking a dog. A delivery driver leaves a parcel on a doorstep and checks their phone. Everything looks ordinary, but you can hear more than you should: the dog panting, the parcel tape tearing, the car's indicator clicking before the driver pulls away.",
"Across the road, a person stands beside a lamppost and looks up at your window. You do not recognise them. They do not wave. They seem to be waiting for a sound. When a bus passes at the end of the road, they turn their head in perfect time with it.",
"You could stay inside and rest, go to the corner shop, or step outside and ask whether the person has noticed anything strange. The decision feels larger than it should."
],choices:[C("⌂","Stay inside","You are not ready to talk to anyone.","home_afternoon",{home:1,calm:1,minutes:20}),C("↗","Go to the corner shop","You need water and a little fresh air.","corner_shop",{social:1,minutes:14}),C("✋","Step outside and approach the person","You want to know why they are watching the street.","road_encounter",{social:1,curious:1,minutes:5,route:"walking"})]},
home_bathroom:{time:"07:42",chapter:"Monday · Staying home",title:"The thermometer gives you an ordinary answer.",text:[
"The thermometer gives a reading that is only slightly elevated. Not enough to explain the way your skin feels, but enough to confirm that you are not imagining the illness. You look in the mirror. Your face is pale. Your eyes are clear, although the pupils seem to adjust to the light a little too quickly.",
"You lift your hair and inspect the back of your neck. The pale marks have returned. This time there are four, not three. They form a shallow curve beneath the skin. When you touch them, they fade. When you stop, they return. You take a photograph and, once again, the image shows almost nothing.",
"A drop of water falls from the tap. You hear it hit the basin, bounce once and roll towards the plughole. You can follow the tiny sound all the way. You stand still, listening, until the bathroom fan clicks off by itself."
],choices:[C("▤","Read the health notice again","Check what the official guidance says about staying home.","notice",{curious:1,minutes:5}),C("↗","Go to the pharmacy","You want to ask a real person about the symptoms.","pharmacy",{social:1,minutes:16}),C("⌂","Return to the bedroom","You have done enough for now.","home_rest",{calm:1,minutes:8})]},
home_kitchen:{time:"08:04",chapter:"Monday · Staying home",title:"A quiet breakfast takes longer than expected.",text:[
"You make toast and a mug of tea. The kettle sounds unusually loud as it switches off. The smell of the tea arrives late, then all at once. You eat slowly. The first bite tastes normal. The second tastes faintly of metal. The third is almost sweet. You stop trying to work out why and concentrate on the simple act of eating.",
"Outside, a neighbour pulls a wheelie bin to the kerb. The wheels rattle over the paving stones. You can hear the exact point where one wheel catches on a crack. The neighbour looks up at your window and gives a brief wave. You wave back. It is an ordinary exchange, and for a moment that is enough.",
"Your phone shows a new local update. The council has asked people to avoid the old weather station road. A separate post says the river path is open. You could stay in, visit the corner shop, or take a walk somewhere quieter."
],choices:[C("↗","Go to the corner shop","You need water and something easy to eat.","corner_shop",{social:1,minutes:14}),C("🌿","Walk towards the canal path","Fresh air might clear your head.","canal_path",{water:1,calm:1,minutes:20}),C("⌂","Stay inside and read the updates","You do not feel like going out yet.","home_afternoon",{curious:1,home:1,minutes:20})]},
front_path:{time:"08:18",chapter:"Monday · Outside the house",title:"The air feels colder than it looks.",text:[
"You step outside and close the door behind you. The air is damp, and the pavement has a dark sheen although it has not rained for hours. A delivery van idles at the end of the road. Somewhere nearby, a dog barks twice, pauses, then barks once more.",
"You take a slow breath. The air smells of wet leaves, diesel, bread from the bakery and something sharp that you cannot identify. Your head feels clearer outside. Your skin still has that odd tightness, but the cold air is pleasant against it.",
"A person is coming towards you from the far end of the road. They are carrying a folded umbrella and walking very slowly. They look up as they approach. You have never seen them before, but they seem to recognise the pale marks near your collar."
],choices:[C("✋","Stop and speak to the stranger","They may know something about the local illness.","road_encounter",{social:1,minutes:5,route:"walking"}),C("→","Keep walking towards the shops","You do not have the energy for a conversation.","corner_shop",{independent:1,minutes:12}),C("⌂","Go back inside","The fresh air has helped enough.","home_afternoon",{home:1,calm:1,minutes:5})]},
corner_shop:{time:"08:46",chapter:"Monday · The corner shop",title:"The shopkeeper has heard more than the radio.",text:[
"The bell above the shop door gives a small metallic ring. The shopkeeper is stacking bottles of water beside the till. There are fewer customers than usual. A handwritten sign asks people to be patient if staff need to close early. You pick up a bottle and a packet of plain crackers.",
"The shopkeeper asks whether you are feeling all right. You say you have a sore throat and a headache. They tell you three people from the same street have come in with similar symptoms. One said the smell of coffee had disappeared. Another said they could hear the fridge motor from outside the shop. The shopkeeper says they thought it was a joke until they noticed it themselves.",
"A customer at the back of the shop is standing very still beside the freezer. They have not picked anything up. Their head is tilted slightly, as if they are listening to the compressor. The shopkeeper notices you looking and quietly says they have been there for nearly ten minutes."
],choices:[C("✉","Ask the shopkeeper about the other customers","You want to know whether this is happening nearby.","shopkeeper_detail",{social:1,curious:1,minutes:5}),C("⌕","Approach the person by the freezer","They may be unwell and need help.","freezer_customer",{care:1,minutes:4}),C("→","Pay and leave","You do not want to get involved.","pharmacy",{independent:1,minutes:3})]},
shopkeeper_detail:{time:"08:55",chapter:"Monday · The corner shop",title:"The shopkeeper remembers the details.",text:[
"The shopkeeper says the first customer was a man who normally buys two coffees and a newspaper every morning. Today he bought a bottle of water and stood outside listening to the rain gutter. The second was a woman who said she could smell the river from her kitchen, although she lives several streets away.",
"Neither person looked confused. They knew where they were and what they wanted. They simply seemed to notice things that had always been there but had never mattered before. The shopkeeper says that is what unsettles them most: the people are not acting like strangers. They are acting like themselves with one extra sense switched on.",
"You pay for your water. The shopkeeper gives you a small paper bag and says to take care. As you leave, the customer by the freezer finally moves. They turn towards the door before the bell rings."
],choices:[C("→","Walk to the pharmacy","You want to ask about the symptoms.","pharmacy",{curious:1,minutes:10}),C("🌿","Take the longer route by the canal","You want some space to think.","canal_path",{water:1,minutes:15})]},
freezer_customer:{time:"08:52",chapter:"Monday · The corner shop",title:"The customer is listening to the freezer.",text:[
"You approach slowly. The customer is a young man in a dark coat. His eyes are open, but he seems to be listening to something inside the freezer. You ask if he is all right. He turns immediately and says yes. His voice is steady. He looks embarrassed rather than frightened.",
"He says the freezer has a second sound beneath the compressor. It is like a low note that changes when someone walks past. He has been trying to work out the pattern. When you stand beside him, the sound seems to move into your teeth. You step away, and it fades.",
"The customer thanks you for asking. He says he is going to sit outside for a while. The shopkeeper watches him leave, then turns the freezer off at the wall. The low note continues for another second after the motor stops."
],choices:[C("→","Leave for the pharmacy","You have heard enough for now.","pharmacy",{curious:1,minutes:9}),C("⌂","Go home","You need to rest before the day gets any stranger.","home_afternoon",{home:1,minutes:10})]},
pharmacy:{time:"09:18",chapter:"Monday · The pharmacy",title:"The pharmacist has put a notice on the counter.",text:[
